name: GG EdgeOne C++ Internal APK

on:
  workflow_dispatch:
    inputs:
      edgeone_base_url:
        description: 'EdgeOne Makers HTTPS origin (optional)'
        required: false
        type: string
  push:
    branches:
      - feat/gg-edgeone-license-remote-js-20261111
    paths:
      - 'v2/android/**'
      - '.github/workflows/gg-edgeone-cpp-internal-apk.yml'

permissions:
  contents: read

concurrency:
  group: gg-edgeone-cpp-internal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-parity-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public historical ZIP fixture
        run: |
          python3 edgeone-license/scripts/pack_runtime.py \
            --noname remote-script/release/noname-1.1.4.js \
            --game game-engine/release/game-1.0.5.js \
            --version 1.1.4-1.0.5 --out /tmp/gg-cpp-test
      - name: Compile and execute host C++ core parity tests
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            v2/android/clientNative/src/main/cpp/runtime_bundle.cpp \
            v2/android/clientNative/test/runtime_bundle_smoke.cpp \
            -lz -o /tmp/gg-cpp-native-smoke
          /tmp/gg-cpp-native-smoke /tmp/gg-cpp-test/bundle.zip \
            remote-script/release/noname-1.1.4.js \
            game-engine/release/game-1.0.5.js
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            v2/android/clientNative/src/main/cpp/runtime_bundle.cpp \
            v2/android/clientNative/src/main/cpp/edgeone_protocol.cpp \
            v2/android/clientNative/src/main/cpp/encrypted_transfer.cpp \
            v2/android/clientNative/src/main/cpp/startup_coordinator.cpp \
            v2/android/clientNative/test/edgeone_protocol_smoke.cpp \
            -lz -o /tmp/gg-cpp-protocol-smoke
          /tmp/gg-cpp-protocol-smoke
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            v2/android/clientNative/src/main/cpp/html_compatibility.cpp \
            v2/android/clientNative/test/html_compatibility_smoke.cpp \
            -o /tmp/gg-cpp-html-smoke
          /tmp/gg-cpp-html-smoke
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer \
            v2/android/clientNative/src/main/cpp/browser_policy.cpp \
            v2/android/clientNative/test/browser_policy_smoke.cpp \
            -o /tmp/gg-cpp-browser-smoke
          /tmp/gg-cpp-browser-smoke
          g++ -std=c++17 -Wall -Wextra -Werror -fsanitize=address,undefined \
            -fno-omit-frame-pointer -pthread \
            v2/android/clientNative/src/main/cpp/startup_coordinator.cpp \
            v2/android/clientNative/test/startup_coordinator_smoke.cpp \
            -o /tmp/gg-cpp-startup-smoke
          /tmp/gg-cpp-startup-smoke
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Exercise full JNI boundary from host Java
        run: |
          mkdir -p /tmp/gg-cpp-jni /tmp/gg-cpp-java-classes
          g++ -std=c++17 -Wall -Wextra -Werror -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            v2/android/clientNative/src/main/cpp/runtime_bundle.cpp \
            v2/android/clientNative/src/main/cpp/edgeone_protocol.cpp \
            v2/android/clientNative/src/main/cpp/encrypted_transfer.cpp \
            v2/android/clientNative/src/main/cpp/html_compatibility.cpp \
            v2/android/clientNative/src/main/cpp/browser_policy.cpp \
            v2/android/clientNative/src/main/cpp/startup_coordinator.cpp \
            v2/android/clientNative/src/main/cpp/native_runtime_jni.cpp \
            -lz -o /tmp/gg-cpp-jni/libggnative.so
          javac -d /tmp/gg-cpp-java-classes \
            v2/android/client/src/main/java/com/jinli/ggsecure/UiText.java \
            v2/android/clientNative/test/UiTextSmoke.java \
            v2/android/client/src/main/java/com/jinli/ggsecure/NativeRuntimeBridge.java \
            v2/android/client/src/main/java/com/jinli/ggsecure/StartupGate.java \
            v2/android/client/src/main/java/com/jinli/ggsecure/NativeGameInputStream.java \
            v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeZipReader.java \
            v2/android/client/src/main/java/com/jinli/ggsecure/NativeCiphertextReader.java \
            v2/android/client/src/main/java/com/jinli/ggsecure/EdgeOneHtmlCompatibility.java \
            v2/android/client/src/main/java/com/jinli/ggsecure/DeviceProofCodec.java \
            v2/android/clientNative/test/DeviceProofInteropSmoke.java \
            v2/android/clientNative/test/NativeRuntimeInteropSmoke.java \
            v2/android/clientNative/test/NativeCryptoBuildConfig.java \
            v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeDeliveryCrypto.java \
            edgeone-license/test/RuntimeDeliveryCryptoSmoke.java
          java -Djava.library.path=/tmp/gg-cpp-jni -cp /tmp/gg-cpp-java-classes \
            com.jinli.ggsecure.NativeRuntimeInteropSmoke \
            /tmp/gg-cpp-test/bundle.zip \
            remote-script/release/noname-1.1.4.js \
            game-engine/release/game-1.0.5.js
          java -cp /tmp/gg-cpp-java-classes com.jinli.ggsecure.UiTextSmoke
          node edgeone-license/test/device-proof-interop.mjs
          node edgeone-license/test/runtime-crypto-fixture.mjs | \
            java -Djava.library.path=/tmp/gg-cpp-jni -cp /tmp/gg-cpp-java-classes \
              com.jinli.ggsecure.RuntimeDeliveryCryptoSmoke
      - name: Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build isolated C++ APK and unchanged Java reference
        env:
          GH_EDGEONE_BASE: ${{ inputs.edgeone_base_url || vars.GG_EDGEONE_BASE_URL || 'https://gg-api.xn--8pv109c.top' }}
          GG_INTERNAL_KEYSTORE_B64: ${{ secrets.GG_INTERNAL_KEYSTORE_B64 }}
          GG_INTERNAL_STORE_PASSWORD: ${{ secrets.GG_INTERNAL_STORE_PASSWORD }}
          GG_INTERNAL_KEY_ALIAS: ${{ secrets.GG_INTERNAL_KEY_ALIAS }}
          GG_INTERNAL_KEY_PASSWORD: ${{ secrets.GG_INTERNAL_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          signing_mode=ephemeral-debug
          if [[ -n "$GG_INTERNAL_KEYSTORE_B64" || -n "$GG_INTERNAL_STORE_PASSWORD" ||
                -n "$GG_INTERNAL_KEY_ALIAS" || -n "$GG_INTERNAL_KEY_PASSWORD" ]]; then
            if [[ -z "$GG_INTERNAL_KEYSTORE_B64" || -z "$GG_INTERNAL_STORE_PASSWORD" ||
                  -z "$GG_INTERNAL_KEY_ALIAS" || -z "$GG_INTERNAL_KEY_PASSWORD" ]]; then
              echo 'Incomplete GG internal signing secrets' >&2
              exit 1
            fi
            export GG_INTERNAL_KEYSTORE_FILE="$RUNNER_TEMP/gg-internal-signing.jks"
            printf '%s' "$GG_INTERNAL_KEYSTORE_B64" | base64 --decode > "$GG_INTERNAL_KEYSTORE_FILE"
            chmod 600 "$GG_INTERNAL_KEYSTORE_FILE"
            signing_mode=persistent-internal
          else
            echo '::warning::No persistent internal signing secrets: this APK cannot reliably upgrade an earlier CI run'
          fi
          echo "GG_SIGNING_MODE=$signing_mode" >> "$GITHUB_ENV"
          native_version_code=$((10000 + GITHUB_RUN_NUMBER))
          native_version_name="2.0.4-native-internal.${GITHUB_RUN_NUMBER}"
          echo "GG_NATIVE_VERSION_CODE=$native_version_code" >> "$GITHUB_ENV"
          echo "GG_NATIVE_VERSION_NAME=$native_version_name" >> "$GITHUB_ENV"
          cd v2/android
          gradle --no-daemon \
            :clientNative:lintRelease :clientNative:assembleRelease \
            :client:assembleEdgeOneTest \
            "-PggEdgeOneBaseUrl=${GH_EDGEONE_BASE}" \
            "-PggNativeVersionCode=${native_version_code}" \
            "-PggNativeVersionName=${native_version_name}"
      - name: Verify isolated APKs, ABI libraries and no private JavaScript
        run: |
          set -euo pipefail
          cpp=v2/android/clientNative/build/outputs/apk/release/clientNative-release.apk
          java=v2/android/client/build/outputs/apk/edgeOneTest/client-edgeOneTest.apk
          test -s "$cpp"
          test -s "$java"
          if unzip -Z1 "$cpp" | grep -E '(^|/)(noname|game)([.-][^/]*)?\.js$|\.(ggenc|zip)$'; then
            echo 'Private runtime found in native APK' >&2
            exit 1
          fi
          # The native APK should not expose its own login/loading/UI phrases
          # as trivial plaintext DEX search anchors. This is not a runtime
          # secrecy guarantee, and test-only expected strings are not packaged.
          python3 - "$cpp" <<'PY'
          import sys
          import zipfile
          from pathlib import Path

          markers = [
              '请输入激活码后启动', '请输入32位激活码',
              '正在初始化中…', '正在解除设备绑定…',
              '重置网页数据', '确认更换设备', '安装包签名校验失败',
          ]
          with zipfile.ZipFile(Path(sys.argv[1])) as apk:
              dex_names = [n for n in apk.namelist()
                           if n.startswith('classes') and n.endswith('.dex')]
              if not dex_names:
                  raise SystemExit('No DEX found in native APK')
              for name in dex_names:
                  contents = apk.read(name)
                  for marker in markers:
                      if marker.encode('utf-8') in contents:
                          raise SystemExit(f'Unprotected UI text in {name}: {marker}')
          PY
          unzip -Z1 "$cpp" | grep -F 'lib/arm64-v8a/libggnative.so'
          unzip -Z1 "$cpp" | grep -F 'lib/armeabi-v7a/libggnative.so'
          unzip -Z1 "$cpp" | grep -F 'lib/x86_64/libggnative.so'
          for abi in arm64-v8a armeabi-v7a x86_64; do
            library="$RUNNER_TEMP/libggnative-$abi.so"
            unzip -p "$cpp" "lib/$abi/libggnative.so" > "$library"
            readelf -W --program-headers "$library" | grep -F GNU_RELRO
            readelf -W --program-headers "$library" | grep -E 'GNU_STACK.*RW '
            readelf -W --dynamic "$library" | grep -F BIND_NOW
            readelf -W --dyn-syms "$library" | grep -F Java_com_jinli_ggsecure_NativeRuntimeBridge_
          done
          sdk_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$sdk_tools/aapt" dump badging "$cpp" | grep -F "package: name='com.jinli.quickweb.edgeonecpp'"
          "$sdk_tools/aapt" dump badging "$cpp" | grep -F "versionCode='${GG_NATIVE_VERSION_CODE}' versionName='${GG_NATIVE_VERSION_NAME}'"
          "$sdk_tools/aapt" dump badging "$java" | grep -F "package: name='com.jinli.quickweb.edgeonetest'"
          "$sdk_tools/apksigner" verify --verbose --print-certs "$cpp"
          signer_digest="$("$sdk_tools/apksigner" verify --print-certs "$cpp" | \
            grep -m1 -E 'Signer: certificate SHA-256 digest:' | awk '{print $NF}' | \
            tr '[:upper:]' '[:lower:]')"
          if [[ "$GG_SIGNING_MODE" == "persistent-internal" &&
                "$signer_digest" != "70608347ee8cc3cd72e7dc70c504013e261c9a2fee9850539219cda519c87f34" ]]; then
            echo '::error::Configured persistent signing key differs from the official GG certificate' >&2
            exit 1
          fi
          mkdir -p artifact
          cp "$cpp" artifact/GG-EdgeOne-CPP-internal.apk
          (cd artifact && sha256sum GG-EdgeOne-CPP-internal.apk > SHA256SUMS.txt)
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'version_code=%s\n' "$GG_NATIVE_VERSION_CODE"
            printf 'version_name=%s\n' "$GG_NATIVE_VERSION_NAME"
            printf 'signing_mode=%s\n' "$GG_SIGNING_MODE"
            "$sdk_tools/apksigner" verify --print-certs "$cpp" | grep -E 'Signer: certificate SHA-256 digest:'
          } > artifact/BUILD-METADATA.txt
      - name: Upload internal test APK only
        uses: actions/upload-artifact@v4
        with:
          name: GG-EdgeOne-CPP-internal-${{ github.run_number }}
          path: artifact/
          retention-days: 14
          if-no-files-found: error
      - name: Build unsigned APK for offline official signing
        env:
          GH_EDGEONE_BASE: ${{ inputs.edgeone_base_url || vars.GG_EDGEONE_BASE_URL || 'https://gg-api.xn--8pv109c.top' }}
        run: |
          set -euo pipefail
          cd v2/android
          gradle --no-daemon :clientNative:assembleRelease \
            -PggLocalOfficialUnsigned=true \
            "-PggEdgeOneBaseUrl=${GH_EDGEONE_BASE}" \
            "-PggNativeVersionCode=${GG_NATIVE_VERSION_CODE}" \
            "-PggNativeVersionName=${GG_NATIVE_VERSION_NAME}"
      - name: Verify unsigned APK and stage offline signing kit
        run: |
          set -euo pipefail
          unsigned=v2/android/clientNative/build/outputs/apk/release/clientNative-release-unsigned.apk
          test -s "$unsigned"
          unzip -t "$unsigned" >/dev/null
          sdk_tools="$(find "${ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$sdk_tools/aapt" dump badging "$unsigned" | \
            grep -F "package: name='com.jinli.quickweb.edgeonecpp'"
          "$sdk_tools/aapt" dump badging "$unsigned" | \
            grep -F "versionCode='${GG_NATIVE_VERSION_CODE}' versionName='${GG_NATIVE_VERSION_NAME}'"
          grep -R -F 'GG_REQUIRE_OFFICIAL_APK_SIGNER = true' \
            v2/android/clientNative/build/generated/source/buildConfig/
          "$sdk_tools/zipalign" -c -p 4 "$unsigned"
          if "$sdk_tools/apksigner" verify "$unsigned" >/dev/null 2>&1; then
            echo '::error::Offline signing artifact must be unsigned' >&2
            exit 1
          fi
          mkdir -p official-signing-kit
          cp "$unsigned" official-signing-kit/GG-EdgeOne-CPP-official-unsigned.apk
          cp scripts/Sign-GG-Official-APK.ps1 official-signing-kit/
          cp scripts/Install-GG-Android-BuildTools.ps1 official-signing-kit/
          (cd official-signing-kit && sha256sum GG-EdgeOne-CPP-official-unsigned.apk > SHA256SUMS.txt)
          {
            printf 'source_commit=%s\n' "$GITHUB_SHA"
            printf 'version_code=%s\n' "$GG_NATIVE_VERSION_CODE"
            printf 'version_name=%s\n' "$GG_NATIVE_VERSION_NAME"
            printf 'signing_mode=official-local-unsigned\n'
            printf 'expected_signer_sha256=70608347ee8cc3cd72e7dc70c504013e261c9a2fee9850539219cda519c87f34\n'
          } > official-signing-kit/BUILD-METADATA.txt
      - name: Check offline PowerShell signing helper syntax
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          foreach ($script in @('scripts/Sign-GG-Official-APK.ps1', 'scripts/Install-GG-Android-BuildTools.ps1')) {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors) { $parseErrors | Out-String | Write-Error; exit 1 }
          }
      - name: Upload unsigned official-local signing kit
        uses: actions/upload-artifact@v4
        with:
          name: GG-EdgeOne-CPP-official-local-${{ github.run_number }}
          path: official-signing-kit/
          retention-days: 14
          if-no-files-found: error
