name: Restore complete control center and stable GG client

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/restore-complete-control-center-and-client.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: complete-control-center-restore
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.LICENSE_ADMIN_PASSWORD }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      LICENSE_ENDPOINT: https://gams-license-api.2320006072.workers.dev
      RUNTIME_ENDPOINT: https://gams-runtime-v2.2320006072.workers.dev
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Run atomic verified restore
        id: restore
        shell: bash
        run: bash scripts/run_complete_restore_v2.sh

      - uses: actions/upload-artifact@v4
        id: artifact
        if: steps.restore.outcome == 'success'
        with:
          name: GG-complete-restore-client-and-manager
          path: /tmp/complete-restore/**
          retention-days: 30
          if-no-files-found: error

      - name: Mark artifact result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s /tmp/complete-restore-status.json ]]; then
            jq --arg artifact "${{ steps.artifact.outcome }}" \
              '. + {artifact:$artifact}' /tmp/complete-restore-status.json > /tmp/final-status.json
            content="$(base64 -w0 /tmp/final-status.json)"
            path='docs/COMPLETE_RESTORE_STATUS.json'
            old_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
            args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record final complete restore artifact status' \
              -f content="$content" -f branch=main)
            [[ -z "$old_sha" ]] || args+=(-f sha="$old_sha")
            gh api "${args[@]}" >/dev/null || true
          fi

      - name: Require complete restore and artifact
        if: always()
        shell: bash
        run: |
          test "${{ steps.restore.outcome }}" = success
          test "${{ steps.artifact.outcome }}" = success

