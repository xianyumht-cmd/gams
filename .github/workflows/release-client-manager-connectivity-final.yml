name: Final GG client and manager connectivity release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-client-manager-connectivity-fix
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      LICENSE_ADMIN_PASSWORD: ${{ secrets.LICENSE_ADMIN_PASSWORD }}
      LICENSE_ENDPOINT: https://gams-license-api.2320006072.workers.dev
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply and validate scoped source fixes
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          for name in GG_RELEASE_KEYSTORE_BASE64 GG_RELEASE_KEYSTORE_PASSWORD LICENSE_ADMIN_PASSWORD; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          python3 scripts/apply_2_0_4_client_manager_connectivity_fixes.py
          git diff --exit-code -- remote-script v2/runtime license-api
          grep -Fq 'setSupportMultipleWindows(true)' v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java
          grep -Fq 'boolean onCreateWindow' v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java
          grep -Fq 'ResilientApiTransport.get' v2/android/manager/src/main/java/com/jinli/ggsecure/manager/AdminApiManager.java
          grep -Fq 'static Response get' v2/android/manager/src/main/java/com/jinli/ggsecure/manager/ResilientApiTransport.java

      - name: Build and lint client and manager
        id: build
        working-directory: v2/android
        run: >-
          gradle --no-daemon
          :client:clean :client:lintRelease :client:assembleRelease
          :manager:clean :manager:lintRelease :manager:assembleRelease

      - name: Apply formal JKS signature
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/gg-release.jks' EXIT
          client_in="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          manager_in="$(find v2/android/manager/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$client_in" && test -s "$manager_in"
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"
          mkdir -p /tmp/gg-final

          sign_one() {
            local input="$1" output="$2"
            "$apksigner" sign --ks /tmp/gg-release.jks --ks-key-alias gg-release \
              --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --v4-signing-enabled false --out "$output" "$input"
            "$apksigner" verify --min-sdk-version 24 "$output"
          }
          sign_one "$client_in" /tmp/gg-final/GG-2.0.4-code13.apk
          sign_one "$manager_in" /tmp/gg-final/GG-Manager-2.0.1-code2.apk

          "$aapt" dump badging /tmp/gg-final/GG-2.0.4-code13.apk > /tmp/client.txt
          "$aapt" dump badging /tmp/gg-final/GG-Manager-2.0.1-code2.apk > /tmp/manager.txt
          grep -Fq "package: name='com.jinli.quickweb'" /tmp/client.txt
          grep -Fq "versionCode='13'" /tmp/client.txt
          grep -Fq "versionName='2.0.4'" /tmp/client.txt
          grep -Fq "package: name='com.jinli.ggsecure.manager'" /tmp/manager.txt
          grep -Fq "versionCode='2'" /tmp/manager.txt
          grep -Fq "versionName='2.0.1'" /tmp/manager.txt
          sha256sum /tmp/gg-final/GG-2.0.4-code13.apk | awk '{print $1}' > /tmp/client.sha
          sha256sum /tmp/gg-final/GG-Manager-2.0.1-code2.apk | awk '{print $1}' > /tmp/manager.sha

      - name: Verify actual production admin routes
        id: api
        shell: bash
        run: |
          set -euo pipefail
          payload="$(jq -n --arg password "$LICENSE_ADMIN_PASSWORD" '{password:$password}')"
          login="$(curl -fsS -H 'Content-Type: application/json' --data "$payload" "$LICENSE_ENDPOINT/v1/admin/login")"
          token="$(printf '%s' "$login" | jq -r 'select(.ok == true) | .token')"
          test -n "$token" && test "$token" != null
          curl -fsS -H "Authorization: Bearer $token" "$LICENSE_ENDPOINT/v1/admin/licenses?limit=1" | jq -e '.ok == true' >/dev/null
          unset payload login token

      - name: Commit verified Android fixes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/android/client v2/android/manager
          git commit -m 'Fix GG duplicate external browser and rebuild manager connectivity'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish signed release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          client_sha="$(cat /tmp/client.sha)"
          manager_sha="$(cat /tmp/manager.sha)"
          cat > /tmp/notes.txt <<EOF
          GG 2.0.4 / 管理端 2.0.1

          - 修复网页偶发同时打开 GG 内部页面与系统浏览器。
          - HTTP/HTTPS、target=_blank 与 window.open 统一由 GG 内部 WebView 接管。
          - 管理端 GET/POST 均使用多通道抗 DNS 污染连接。
          - 客户端 SHA-256：${client_sha}
          - 管理端 SHA-256：${manager_sha}
          - 证书 SHA-256：${CERT_SHA256}
          - 未修改核心商城脚本、Runtime、卡密数据库或 Cloudflare 规则。
          EOF
          gh release delete gg-2.0.4 --yes 2>/dev/null || true
          gh release create gg-2.0.4 /tmp/gg-final/*.apk \
            --target "${{ steps.commit.outputs.sha }}" \
            --title 'GG 2.0.4 与管理端 2.0.1' --notes-file /tmp/notes.txt

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: GG-2.0.4-client-and-manager
          path: /tmp/gg-final/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Record final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.patch.outcome }}" == success && "${{ steps.build.outcome }}" == success \
             && "${{ steps.sign.outcome }}" == success && "${{ steps.api.outcome }}" == success \
             && "${{ steps.commit.outcome }}" == success && "${{ steps.release.outcome }}" == success \
             && "${{ steps.artifact.outcome }}" == success ]]; then ok=true; fi
          jq -n --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg triggerCommit "$GITHUB_SHA" --argjson runId "$GITHUB_RUN_ID" --argjson ok "$ok" \
            --arg clientSha "$(cat /tmp/client.sha 2>/dev/null || true)" \
            --arg managerSha "$(cat /tmp/manager.sha 2>/dev/null || true)" --arg certificate "$CERT_SHA256" \
            --arg patch "${{ steps.patch.outcome }}" --arg build "${{ steps.build.outcome }}" \
            --arg sign "${{ steps.sign.outcome }}" --arg api "${{ steps.api.outcome }}" \
            --arg commit "${{ steps.commit.outcome }}" --arg release "${{ steps.release.outcome }}" \
            --arg artifact "${{ steps.artifact.outcome }}" \
            '{schemaVersion:4,generatedAt:$generatedAt,triggerCommit:$triggerCommit,runId:$runId,ok:$ok,client:{versionName:"2.0.4",versionCode:13,sha256:$clientSha},manager:{versionName:"2.0.1",versionCode:2,sha256:$managerSha},certificateSha256:$certificate,steps:{patch:$patch,build:$build,sign:$sign,adminApi:$api,commit:$commit,githubRelease:$release,artifact:$artifact},scope:{webViewSingleWindow:true,managerResilientGet:true,shopCoreModified:false,runtimeModified:false,cloudflareRulesModified:false},secretsExposed:false}' > /tmp/status.json
          path=docs/CLIENT_MANAGER_CONNECTIVITY_FIX_STATUS.json
          content="$(base64 -w0 /tmp/status.json)"
          sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha')"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
            -f message='Record final client and manager connectivity release' \
            -f content="$content" -f sha="$sha" -f branch=main >/dev/null

      - name: Require complete release
        if: always()
        shell: bash
        run: |
          test "${{ steps.patch.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.sign.outcome }}" = success
          test "${{ steps.api.outcome }}" = success
          test "${{ steps.commit.outcome }}" = success
          test "${{ steps.release.outcome }}" = success
          test "${{ steps.artifact.outcome }}" = success
