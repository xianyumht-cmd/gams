name: Probe page five purchase exception scope

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/prepare_page5_purchase_exception_scope_probe.py
      - scripts/page5_purchase_exception_scope.trigger
      - .github/workflows/probe-page5-purchase-exception-scope.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-purchase-exception-scope-20260806
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      IMPLEMENTATION_REF: fix/page5-missing-constructor-mobile-bridge-20260806
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: /tmp/persisted-game-1.0.5.js
      GENERATED_PROBE: scripts/run_page5_purchase_exception_scope.generated.mjs
      OUTPUT_DIR: page5-purchase-exception-scope

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read persisted implementation files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$IMPLEMENTATION_REF:refs/remotes/origin/$IMPLEMENTATION_REF"
          git show "origin/$IMPLEMENTATION_REF:game-engine/release/game-1.0.5.js" > "$CURRENT_SECOND_PATH"
          git show "origin/$IMPLEMENTATION_REF:scripts/prepare_persisted_repeat_reentry_matrix.py" > scripts/prepare_persisted_repeat_reentry_matrix.py
          test -s "$CURRENT_SECOND_PATH"
          test "$(sha256sum "$CURRENT_SECOND_PATH" | awk '{print $1}')" = "9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca"

      - name: Prepare exception scope probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/prepare_five_page_missing_constructor_matrix.py \
            scripts/prepare_page5_repeat_reentry_matrix.py \
            scripts/prepare_persisted_repeat_reentry_matrix.py \
            scripts/prepare_page5_purchase_action_probe.py \
            scripts/prepare_page5_purchase_exception_scope_probe.py
          python3 scripts/prepare_page5_purchase_exception_scope_probe.py --output "$GENERATED_PROBE"
          node --check "$GENERATED_PROBE"
          grep -Fq 'persisted-runtime-page5-purchase-exception-scope-probe' "$GENERATED_PROBE"
          grep -Fq 'Debugger.setPauseOnExceptions' "$GENERATED_PROBE"
          grep -Fq 'tpUndefined' "$GENERATED_PROBE"
          grep -Fq 'currentUserState' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute exception scope probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/page5-purchase-exception-scope.log

      - name: Build compact exception scope status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-purchase-exception-scope.log && cp /tmp/page5-purchase-exception-scope.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path(os.environ['OUTPUT_DIR']) / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          cases = (report or {}).get('cases') or []
          case = cases[0] if cases else {}
          purchase_probe = case.get('purchaseProbe') or {}
          attempts = purchase_probe.get('attempts') or []
          attempt = attempts[0] if attempts else {}
          trace = attempt.get('exceptionTrace') or None
          evaluations = (trace or {}).get('evaluations') or {}
          script = (trace or {}).get('script') or None
          captured = bool(trace and trace.get('reason') and script)
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': bool(report) and captured,
              'mode': 'persisted-runtime-page5-purchase-exception-scope-probe',
              'implementationRef': os.environ.get('IMPLEMENTATION_REF', ''),
              'exceptionCaptured': captured,
              'exceptionTrace': trace,
              'evaluations': evaluations,
              'script': script,
              'pageErrors': attempt.get('pageErrors') or case.get('pageErrors') or [],
              'blockedOrderCount': len(attempt.get('blockedOrders') or []),
              'productDetailObserved': bool((report or {}).get('productDetailObserved')),
              'purchaseActionReached': bool((report or {}).get('purchaseActionReached')),
              'purchaseResultObserved': bool((report or {}).get('purchaseResultObserved')),
              'persistedRuntimeSha256': '9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca',
              'realOrderRequestsAllowed': False,
              'paymentCompleted': False,
              'authorizationOutcomeModified': False,
              'productionDefaultChanged': False,
              'androidClientChanged': False,
              'apkBuilt': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_PURCHASE_EXCEPTION_SCOPE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'ok': status['ok'],
              'exceptionCaptured': captured,
              'workflowOutcome': status['workflowOutcome'],
              'pageErrorCount': len(status['pageErrors']),
              'blockedOrderCount': status['blockedOrderCount'],
              'evaluationNames': sorted(evaluations.keys()),
              'scriptLocation': ({k: script.get(k) for k in ('lineNumber','columnNumber','absoluteIndex')} if script else None),
          }, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-purchase-exception-scope
          path: |
            page5-purchase-exception-scope
            /tmp/PAGE5_PURCHASE_EXCEPTION_SCOPE_STATUS.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish exception scope status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/prepare_persisted_repeat_reentry_matrix.py "$GENERATED_PROBE"
          mkdir -p docs
          cp /tmp/PAGE5_PURCHASE_EXCEPTION_SCOPE_STATUS.json docs/PAGE5_PURCHASE_EXCEPTION_SCOPE_STATUS.json
          git add docs/PAGE5_PURCHASE_EXCEPTION_SCOPE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record final purchase exception scope"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce exception capture gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_PURCHASE_EXCEPTION_SCOPE_STATUS.json >/dev/null
