name: Export latest formal GG manager APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-latest-manager.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: export-latest-gg-manager
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply production API compatibility fix
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_manager_api_compat_2_0_2.py
          python3 scripts/apply_manager_api_compat_2_0_2.py
          main='v2/android/manager/src/main/java/com/jinli/ggsecure/manager/MainActivity.java'
          grep -Fq 'versionCode = 3' v2/android/manager/build.gradle.kts
          grep -Fq 'versionName = "2.0.2"' v2/android/manager/build.gradle.kts
          grep -Fq 'api.get("/v1/admin/licenses?limit=100"' "$main"
          grep -Fq 'body.put("days", days)' "$main"
          grep -Fq '当前服务支持：卡密创建、列表、停用、启用、续期、永久和解绑' "$main"

      - name: Build and lint manager
        id: build
        working-directory: v2/android
        run: gradle --no-daemon :manager:clean :manager:lintRelease :manager:assembleRelease

      - name: Sign and verify formal manager APK
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GG_RELEASE_KEYSTORE_BASE64:-}"
          test -n "${GG_RELEASE_KEYSTORE_PASSWORD:-}"
          trap 'rm -f /tmp/gg-release.jks' EXIT
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks \
            -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"

          unsigned="$(find v2/android/manager/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$unsigned"
          mkdir -p /tmp/gg-manager
          signed=/tmp/gg-manager/GG-Manager-2.0.2-code3.apk
          "$apksigner" sign --ks /tmp/gg-release.jks --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false --out "$signed" "$unsigned"
          "$apksigner" verify --min-sdk-version 24 "$signed"
          "$aapt" dump badging "$signed" > /tmp/manager-badging.txt
          grep -Fq "package: name='com.jinli.ggsecure.manager'" /tmp/manager-badging.txt
          grep -Fq "versionCode='3'" /tmp/manager-badging.txt
          grep -Fq "versionName='2.0.2'" /tmp/manager-badging.txt
          sha256sum "$signed" | awk '{print $1}' > /tmp/manager-sha256.txt

      - name: Commit verified manager source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            v2/android/manager/build.gradle.kts \
            v2/android/manager/src/main/java/com/jinli/ggsecure/manager/MainActivity.java
          git commit -m 'Fix manager routes to match production License API'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: GG-Manager-2.0.2-code3
          path: /tmp/gg-manager/GG-Manager-2.0.2-code3.apk
          retention-days: 30
          if-no-files-found: error

      - name: Record export status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.patch.outcome }}" == success \
             && "${{ steps.build.outcome }}" == success \
             && "${{ steps.sign.outcome }}" == success \
             && "${{ steps.commit.outcome }}" == success \
             && "${{ steps.artifact.outcome }}" == success ]]; then ok=true; fi
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson ok "$ok" \
            --arg sha256 "$(cat /tmp/manager-sha256.txt 2>/dev/null || true)" \
            --arg patch "${{ steps.patch.outcome }}" \
            --arg build "${{ steps.build.outcome }}" \
            --arg sign "${{ steps.sign.outcome }}" \
            --arg commit "${{ steps.commit.outcome }}" \
            --arg artifact "${{ steps.artifact.outcome }}" \
            '{schemaVersion:2,generatedAt:$generatedAt,runId:$runId,ok:$ok,manager:{versionName:"2.0.2",versionCode:3,file:"GG-Manager-2.0.2-code3.apk",sha256:$sha256},compatibility:{dashboardUsesLicenseList:true,unsupportedMenusHidden:true,extendUsesDays:true},steps:{patch:$patch,build:$build,sign:$sign,commit:$commit,artifact:$artifact},secretsExposed:false}' > /tmp/status.json
          path='docs/LATEST_MANAGER_EXPORT.json'
          content="$(base64 -w0 /tmp/status.json)"
          old_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='Record GG manager 2.0.2 export' -f content="$content" -f branch=main)
          [[ -z "$old_sha" ]] || args+=(-f sha="$old_sha")
          gh api "${args[@]}" >/dev/null

      - name: Require successful export
        if: always()
        shell: bash
        run: |
          test "${{ steps.patch.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.sign.outcome }}" = success
          test "${{ steps.commit.outcome }}" = success
          test "${{ steps.artifact.outcome }}" = success

