name: Rotate Runtime release key and build GG 2.0.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rotate-runtime-release-and-build-client.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rotate-runtime-release-and-build-client
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.LICENSE_ADMIN_PASSWORD }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      LICENSE_ENDPOINT: https://gams-license-api.2320006072.workers.dev
      RUNTIME_ENDPOINT: https://gams-runtime-v2.2320006072.workers.dev
      VERSION_NAME: 2.0.3
      VERSION_CODE: 12
      RELEASE_TAG: gg-2.0.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate protected inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_LOGIN_SECRET TOKEN_SIGNING_SECRET RUNTIME_MASTER_KEY GG_RELEASE_KEYSTORE_BASE64 GG_RELEASE_KEYSTORE_PASSWORD; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          test "${#TOKEN_SIGNING_SECRET}" -ge 32
          python3 -m pip install --quiet cryptography
          node --input-type=module - <<'NODE'
          import { decodeRuntimeMasterKey } from "./v2/runtime/src/runtime-key.js";
          const bytes = decodeRuntimeMasterKey(process.env.RUNTIME_MASTER_KEY);
          bytes.fill(0);
          NODE
          test -s remote-script/release/manifest.json
          test -s game-engine/release/manifest.json
          test -s v2/runtime/tools/build_release.py

      - name: Generate new Runtime release signing identity
        id: runtime_key
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/runtime-private.pem /tmp/runtime-public.der' EXIT
          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 \
            -out /tmp/runtime-private.pem
          openssl pkey -in /tmp/runtime-private.pem -pubout \
            -out remote-script/keys/public.pem
          openssl pkey -pubin -in remote-script/keys/public.pem -outform DER \
            -out /tmp/runtime-public.der

          export DERIVED_RUNTIME_SIGNING_PASSWORD="$(python3 - <<'PY'
          import hashlib, hmac, os
          secret = os.environ['GG_RELEASE_KEYSTORE_PASSWORD'].encode()
          print(hmac.new(secret, b'gams-runtime-release-signing-v1', hashlib.sha256).hexdigest())
          PY
          )"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in /tmp/runtime-private.pem \
            -out remote-script/keys/private.pem.enc \
            -pass env:DERIVED_RUNTIME_SIGNING_PASSWORD
          unset DERIVED_RUNTIME_SIGNING_PASSWORD

          public_der_base64="$(base64 -w0 /tmp/runtime-public.der)"
          test -n "$public_der_base64"
          printf '%s' "$public_der_base64" > /tmp/runtime-public.der.b64
          public_sha256="$(sha256sum /tmp/runtime-public.der | awk '{print $1}')"
          echo "public_sha256=$public_sha256" >> "$GITHUB_OUTPUT"

      - name: Patch verified server and Android sources
        id: source_patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          license_path = Path('license-api/src/index.js')
          license = license_path.read_text(encoding='utf-8')
          for function in [
              'adminLogin', 'adminCreateLicenses', 'adminListLicenses',
              'adminLicenseAction', 'issueChallenge', 'activate', 'check', 'selfUnbind'
          ]:
              old = f'        return {function}(request, env);'
              new = f'        return await {function}(request, env);'
              if old in license:
                  license = license.replace(old, new, 1)
              elif new not in license:
                  raise SystemExit(f'License route mismatch: {function}')
          license_path.write_text(license, encoding='utf-8')

          runtime_path = Path('v2/runtime/src/index.js')
          runtime = runtime_path.read_text(encoding='utf-8')
          runtime_pairs = [
              ('        return issueChallenge(request, env);',
               '        return await issueChallenge(request, env);'),
              ('        return runtimeAccess(request, env);',
               '        return await runtimeAccess(request, env);'),
              ('        return runtimeBundle(request, env);',
               '        return await runtimeBundle(request, env);'),
              ('      legacyRuntimePassword: env.LEGACY_RUNTIME_PASSWORD || "",',
               '      legacyRuntimePassword: env.ADMIN_PASSWORD || env.LEGACY_RUNTIME_PASSWORD || "",'),
          ]
          for old, new in runtime_pairs:
              if old in runtime:
                  runtime = runtime.replace(old, new, 1)
              elif new not in runtime:
                  raise SystemExit(f'Runtime source mismatch: {old}')
          runtime_path.write_text(runtime, encoding='utf-8')

          client_path = Path('v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java')
          client = client_path.read_text(encoding='utf-8')
          public_key = Path('/tmp/runtime-public.der.b64').read_text().strip()
          pattern = re.compile(
              r'    private static final String RELEASE_PUBLIC_KEY_DER_BASE64 =\n'
              r'(?:\s+"[^"]*"\s*\+?\n?)+?\s*;',
              re.M,
          )
          replacement = (
              '    private static final String RELEASE_PUBLIC_KEY_DER_BASE64 =\n'
              f'            "{public_key}";'
          )
          client, count = pattern.subn(replacement, client, count=1)
          if count != 1:
              raise SystemExit(f'Android Runtime public key block mismatch: {count}')
          if client.count('private static final int PROTOCOL_APP_VERSION = 11;') != 1:
              raise SystemExit('Android protocol version mismatch')
          client = client.replace(
              'private static final int PROTOCOL_APP_VERSION = 11;',
              'private static final int PROTOCOL_APP_VERSION = 12;',
              1,
          )
          client_path.write_text(client, encoding='utf-8')

          gradle_path = Path('v2/android/client/build.gradle.kts')
          gradle = gradle_path.read_text(encoding='utf-8')
          if gradle.count('versionCode = 11') != 1 or gradle.count('versionName = "2.0.2"') != 1:
              raise SystemExit('Android version contract mismatch')
          gradle = gradle.replace('versionCode = 11', 'versionCode = 12', 1)
          gradle = gradle.replace('versionName = "2.0.2"', 'versionName = "2.0.3"', 1)
          gradle_path.write_text(gradle, encoding='utf-8')

          build_path = Path('.github/workflows/v2-build-apks.yml')
          build = build_path.read_text(encoding='utf-8')
          build = build.replace('2.0.2', '2.0.3')
          build = build.replace('test "$client_code" = "11"', 'test "$client_code" = "12"')
          build = build.replace("versionCode='11' versionName='2.0.3'",
                                "versionCode='12' versionName='2.0.3'")
          build = build.replace('"versionCode":11', '"versionCode":12')
          build_path.write_text(build, encoding='utf-8')
          PY
          node --check license-api/src/index.js
          node --check v2/runtime/src/index.js
          node --check v2/runtime/src/runtime-key.js
          grep -Fq 'PROTOCOL_APP_VERSION = 12' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          grep -Fq 'versionCode = 12' v2/android/client/build.gradle.kts

      - name: Build and sign encrypted Runtime 2.0.3 release
        id: runtime_release
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/runtime-private.pem /tmp/runtime.sig /tmp/v2-runtime-canonical.txt /tmp/v2-runtime-unsigned.json' EXIT

          export DERIVED_RUNTIME_SIGNING_PASSWORD="$(python3 - <<'PY'
          import hashlib, hmac, os
          secret = os.environ['GG_RELEASE_KEYSTORE_PASSWORD'].encode()
          print(hmac.new(secret, b'gams-runtime-release-signing-v1', hashlib.sha256).hexdigest())
          PY
          )"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in remote-script/keys/private.pem.enc \
            -out /tmp/runtime-private.pem \
            -pass env:DERIVED_RUNTIME_SIGNING_PASSWORD
          unset DERIVED_RUNTIME_SIGNING_PASSWORD

          script_file="$(jq -r '.file' remote-script/release/manifest.json)"
          game_file="$(jq -r '.file' game-engine/release/manifest.json)"
          test -s "remote-script/release/${script_file}"
          test -s "game-engine/release/${game_file}"

          python3 v2/runtime/tools/build_release.py \
            "remote-script/release/${script_file}" \
            "game-engine/release/${game_file}" \
            "$VERSION_NAME" \
            "$RUNTIME_MASTER_KEY" \
            v2/runtime/release

          openssl dgst -sha256 -sign /tmp/runtime-private.pem \
            -out /tmp/runtime.sig /tmp/v2-runtime-canonical.txt
          openssl dgst -sha256 -verify remote-script/keys/public.pem \
            -signature /tmp/runtime.sig /tmp/v2-runtime-canonical.txt

          python3 - <<'PY'
          import base64, hashlib, json, os, re, zipfile
          from io import BytesIO
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          manifest = json.loads(Path('/tmp/v2-runtime-unsigned.json').read_text())
          manifest['signatureAlgorithm'] = 'SHA256withECDSA'
          manifest['signature'] = base64.b64encode(Path('/tmp/runtime.sig').read_bytes()).decode()
          release = Path('v2/runtime/release')
          (release / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          bundle = (release / manifest['file']).read_bytes()
          assert len(bundle) == manifest['size']
          assert hashlib.sha256(bundle).hexdigest() == manifest['sha256']

          key_text = os.environ['RUNTIME_MASTER_KEY'].strip()
          if re.fullmatch(r'[0-9a-fA-F]{64}', key_text):
              master = bytes.fromhex(key_text)
          else:
              normalized = key_text.replace('-', '+').replace('_', '/')
              normalized += '=' * ((4 - len(normalized) % 4) % 4)
              master = base64.b64decode(normalized)
          assert len(master) == 32
          content_key = AESGCM(master).decrypt(
              base64.b64decode(manifest['keyIv']),
              base64.b64decode(manifest['keyCipher']),
              f"gg-v2-key|{manifest['versionName']}".encode(),
          )
          plain = AESGCM(content_key).decrypt(
              base64.b64decode(manifest['iv']),
              bundle,
              f"gg-v2-runtime|{manifest['versionName']}".encode(),
          )
          with zipfile.ZipFile(BytesIO(plain)) as archive:
              noname = archive.read('noname.js')
              game = archive.read('game.js')
          assert len(noname) == manifest['nonameSize']
          assert hashlib.sha256(noname).hexdigest() == manifest['nonameSha256']
          assert len(game) == manifest['gameSize']
          assert hashlib.sha256(game).hexdigest() == manifest['gameSha256']
          PY

      - name: Build unsigned GG 2.0.3 client
        id: android_build
        working-directory: v2/android
        run: gradle --no-daemon :client:clean :client:lintRelease :client:assembleRelease

      - name: Sign and verify GG 2.0.3 client
        id: apk_sign
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/gg-release.jks' EXIT
          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$unsigned" && test -s "$unsigned"
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/gg-release.jks
          test -s /tmp/gg-release.jks

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"

          signed="/tmp/GG-${VERSION_NAME}-code${VERSION_CODE}.apk"
          "$apksigner" sign \
            --ks /tmp/gg-release.jks \
            --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$signed" \
            "$unsigned"
          "$apksigner" verify --verbose --print-certs "$signed" > /tmp/apk-verify.txt
          grep -Fq 'Verified using v1 scheme (JAR signing): true' /tmp/apk-verify.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apk-verify.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apk-verify.txt
          "$aapt" dump badging "$signed" > /tmp/apk-badging.txt
          grep -Fq "package: name='com.jinli.quickweb' versionCode='12' versionName='2.0.3'" /tmp/apk-badging.txt
          grep -Fq "application-label:'GG'" /tmp/apk-badging.txt

          cert_hex="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' /tmp/apk-verify.txt | head -n1 | tr '[:lower:]' '[:upper:]')"
          test "${#cert_hex}" = "64"
          cert_colon="$(printf '%s' "$cert_hex" | sed 's/../&:/g;s/:$//')"
          apk_sha256="$(sha256sum "$signed" | awk '{print $1}')"
          printf '%s' "$cert_colon" > /tmp/apk-cert-sha256.txt
          printf '%s' "$apk_sha256" > /tmp/apk-sha256.txt

      - name: Update certificate metadata and canonical Runtime workflow
        id: workflow_update
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          cert = Path('/tmp/apk-cert-sha256.txt').read_text().strip()
          build_path = Path('.github/workflows/v2-build-apks.yml')
          build = build_path.read_text(encoding='utf-8')
          build, count = re.subn(
              r'必须使用证书 SHA-256：[0-9A-F:]{95}',
              f'必须使用证书 SHA-256：{cert}',
              build,
          )
          if count != 1:
              raise SystemExit(f'Build workflow certificate metadata mismatch: {count}')
          build_path.write_text(build, encoding='utf-8')

          runtime_workflow = Path('.github/workflows/v2-deploy-runtime.yml')
          text = runtime_workflow.read_text(encoding='utf-8')
          pattern = re.compile(
              r'      - name: Preserve legacy runtime decryption and async error handling\n'
              r'.*?'
              r'(?=      - name: Locate shared license D1 database\n)',
              re.S,
          )
          replacement = (
              '      - name: Validate Runtime V3 source compatibility\n'
              '        id: patch\n'
              '        shell: bash\n'
              '        run: |\n'
              '          set -euo pipefail\n'
              '          node --check v2/runtime/src/index.js\n'
              '          node --check v2/runtime/src/runtime-key.js\n'
              "          grep -Fq 'return await runtimeAccess' v2/runtime/src/index.js\n"
              "          grep -Fq 'env.ADMIN_PASSWORD || env.LEGACY_RUNTIME_PASSWORD' v2/runtime/src/index.js\n"
              "          grep -Fq 'env.TOKEN_SIGNING_SECRET' v2/runtime/src/index.js\n\n"
          )
          updated, count = pattern.subn(replacement, text)
          if count == 1:
              runtime_workflow.write_text(updated, encoding='utf-8')
          elif 'Validate Runtime V3 source compatibility' not in text:
              raise SystemExit(f'Runtime workflow compatibility block mismatch: {count}')
          PY

      - name: Remove obsolete one-time recovery workflows
        shell: bash
        run: |
          rm -f \
            .github/workflows/check-runtime-release-signing-key.yml \
            .github/workflows/diagnose-production-lifecycle.yml \
            .github/workflows/finalize-minimal-secret-fix.yml \
            .github/workflows/fix-license-async-errors.yml \
            .github/workflows/fix-runtime-token-compat.yml \
            .github/workflows/prepare-hotfix-branch-from-main.yml \
            .github/workflows/recover-production-connectivity.yml \
            .github/workflows/v2-publish-encrypted-runtime.yml \
            .github/workflows/rotate-runtime-release-and-build-client.yml

      - name: Commit rotated release and client source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A \
            remote-script/keys \
            license-api/src/index.js \
            v2/runtime/src/index.js \
            v2/runtime/src/runtime-key.js \
            v2/runtime/tools/build_release.py \
            v2/runtime/release \
            v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java \
            v2/android/client/build.gradle.kts \
            .github/workflows
          git commit -m "Rotate Runtime release signing key and publish GG 2.0.3"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "release_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Locate D1 database and generate Worker configs
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          database_id="$(printf '%s' "$response" | jq -r '.result[] | select(.name=="gams-license-db") | (.uuid // .id)' | head -n1)"
          test -n "$database_id" && test "$database_id" != "null"
          sed "s/__D1_DATABASE_ID__/${database_id}/g" \
            license-api/wrangler.template.jsonc > license-api/wrangler.generated.jsonc
          sed "s/__D1_DATABASE_ID__/${database_id}/g" \
            v2/runtime/wrangler.template.jsonc > v2/runtime/wrangler.generated.jsonc

      - name: Configure and deploy License Worker
        id: license_deploy
        shell: bash
        run: |
          set -euo pipefail
          cd license-api
          printf '%s' "$ADMIN_LOGIN_SECRET" | npx --yes wrangler@4 secret put ADMIN_LOGIN_SECRET --config wrangler.generated.jsonc
          printf '%s' "$TOKEN_SIGNING_SECRET" | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.generated.jsonc
          npx --yes wrangler@4 d1 migrations apply gams-license-db --remote --config wrangler.generated.jsonc
          npx --yes wrangler@4 deploy --config wrangler.generated.jsonc

      - name: Configure and deploy Runtime Worker
        id: runtime_deploy
        shell: bash
        run: |
          set -euo pipefail
          cd v2/runtime
          printf '%s' "$TOKEN_SIGNING_SECRET" | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.generated.jsonc
          printf '%s' "$RUNTIME_MASTER_KEY" | npx --yes wrangler@4 secret put RUNTIME_MASTER_KEY --config wrangler.generated.jsonc
          npx --yes wrangler@4 deploy --config wrangler.generated.jsonc

      - name: Wait for published manifest and both services
        id: health
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/v2/runtime/release/manifest.json"
          for attempt in $(seq 1 48); do
            manifest_version="$(curl -fsS "$manifest_url" | jq -r '.versionName' 2>/dev/null || true)"
            license_status="$(curl -sS -o /tmp/license-health.json -w '%{http_code}' "$LICENSE_ENDPOINT/health" || true)"
            runtime_status="$(curl -sS -o /tmp/runtime-health.json -w '%{http_code}' "$RUNTIME_ENDPOINT/health" || true)"
            if [[ "$manifest_version" == "$VERSION_NAME" && "$license_status" == "200" && "$runtime_status" == "200" ]] \
              && jq -e '.ok and .version == 2 and .signedProtocol == true' /tmp/license-health.json >/dev/null \
              && jq -e '.ok and .version == 3 and .splitSecrets == true' /tmp/runtime-health.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run complete signed production lifecycle
        id: lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/v2-lifecycle-smoke.mjs 2>&1 | tee /tmp/lifecycle.log

      - name: Publish signed APK release
        id: release
        if: steps.lifecycle.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          signed="/tmp/GG-${VERSION_NAME}-code${VERSION_CODE}.apk"
          apk_sha256="$(cat /tmp/apk-sha256.txt)"
          cert_sha256="$(cat /tmp/apk-cert-sha256.txt)"
          cat > /tmp/release-notes.txt <<EOF
          GG ${VERSION_NAME}（versionCode ${VERSION_CODE}）

          - Runtime 运行包已使用独立 RUNTIME_MASTER_KEY 重新加密。
          - Runtime 清单签名密钥已完成轮换。
          - License 与 Runtime 使用独立 TOKEN_SIGNING_SECRET。
          - Android 包名：com.jinli.quickweb
          - APK SHA-256：${apk_sha256}
          - APK 证书 SHA-256：${cert_sha256}
          - 生产完整生命周期验收：通过
          EOF
          gh release create "$RELEASE_TAG" \
            "$signed#GG-${VERSION_NAME}-code${VERSION_CODE}.apk" \
            --target "${{ steps.commit.outputs.release_sha }}" \
            --title "GG ${VERSION_NAME}" \
            --notes-file /tmp/release-notes.txt

      - name: Record clean rotation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          RUNTIME_KEY_OUTCOME: ${{ steps.runtime_key.outcome }}
          SOURCE_PATCH_OUTCOME: ${{ steps.source_patch.outcome }}
          RUNTIME_RELEASE_OUTCOME: ${{ steps.runtime_release.outcome }}
          ANDROID_BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          APK_SIGN_OUTCOME: ${{ steps.apk_sign.outcome }}
          WORKFLOW_UPDATE_OUTCOME: ${{ steps.workflow_update.outcome }}
          COMMIT_OUTCOME: ${{ steps.commit.outcome }}
          LICENSE_DEPLOY_OUTCOME: ${{ steps.license_deploy.outcome }}
          RUNTIME_DEPLOY_OUTCOME: ${{ steps.runtime_deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('/tmp/lifecycle.log')
          text = source.read_text(encoding='utf-8', errors='replace') if source.exists() else ''
          text = text[-5000:]
          text = re.sub(r'(?i)(authorization|token|licenseKey|signature)\\?"?\s*[:=]\s*\\?"?[^,}\s]+', r'\1:<redacted>', text)
          text = re.sub(r'[A-Za-z0-9_+/=-]{48,}', '<redacted>', text)
          Path('/tmp/lifecycle-sanitized.log').write_text(text, encoding='utf-8')
          PY
          ok=false
          if [[ "$INPUTS_OUTCOME" == "success" && "$RUNTIME_KEY_OUTCOME" == "success" \
             && "$SOURCE_PATCH_OUTCOME" == "success" && "$RUNTIME_RELEASE_OUTCOME" == "success" \
             && "$ANDROID_BUILD_OUTCOME" == "success" && "$APK_SIGN_OUTCOME" == "success" \
             && "$WORKFLOW_UPDATE_OUTCOME" == "success" && "$COMMIT_OUTCOME" == "success" \
             && "$LICENSE_DEPLOY_OUTCOME" == "success" && "$RUNTIME_DEPLOY_OUTCOME" == "success" \
             && "$HEALTH_OUTCOME" == "success" && "$LIFECYCLE_OUTCOME" == "success" \
             && "$RELEASE_OUTCOME" == "success" ]]; then
            ok=true
          fi
          apk_sha256="$(cat /tmp/apk-sha256.txt 2>/dev/null || true)"
          cert_sha256="$(cat /tmp/apk-cert-sha256.txt 2>/dev/null || true)"
          public_sha256="${{ steps.runtime_key.outputs.public_sha256 }}"
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg triggerCommit "$GITHUB_SHA" \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg runtimePublicKeySha256 "$public_sha256" \
            --arg apkSha256 "$apk_sha256" \
            --arg apkCertificateSha256 "$cert_sha256" \
            --arg inputs "$INPUTS_OUTCOME" \
            --arg runtimeKey "$RUNTIME_KEY_OUTCOME" \
            --arg sourcePatch "$SOURCE_PATCH_OUTCOME" \
            --arg runtimeRelease "$RUNTIME_RELEASE_OUTCOME" \
            --arg androidBuild "$ANDROID_BUILD_OUTCOME" \
            --arg apkSign "$APK_SIGN_OUTCOME" \
            --arg workflowUpdate "$WORKFLOW_UPDATE_OUTCOME" \
            --arg commit "$COMMIT_OUTCOME" \
            --arg licenseDeploy "$LICENSE_DEPLOY_OUTCOME" \
            --arg runtimeDeploy "$RUNTIME_DEPLOY_OUTCOME" \
            --arg health "$HEALTH_OUTCOME" \
            --arg lifecycle "$LIFECYCLE_OUTCOME" \
            --arg release "$RELEASE_OUTCOME" \
            --rawfile log /tmp/lifecycle-sanitized.log \
            --argjson ok "$ok" \
            '{schemaVersion:1,generatedAt:$generatedAt,triggerCommit:$triggerCommit,ok:$ok,versionName:$versionName,versionCode:$versionCode,runtimePublicKeySha256:$runtimePublicKeySha256,apkSha256:$apkSha256,apkCertificateSha256:$apkCertificateSha256,steps:{inputs:$inputs,runtimeSigningKeyRotation:$runtimeKey,sourcePatch:$sourcePatch,runtimeRelease:$runtimeRelease,androidBuild:$androidBuild,apkSigning:$apkSign,workflowUpdate:$workflowUpdate,commit:$commit,licenseDeploy:$licenseDeploy,runtimeDeploy:$runtimeDeploy,servicesHealthy:$health,signedLifecycleAcceptance:$lifecycle,githubRelease:$release},sanitizedLog:$log,oldRuntimePasswordRequired:false,oldRuntimeSigningPasswordRequired:false,cloudflareSecurityRulesChanged:false,secretsExposed:false}' \
            > /tmp/rotation-status.json
          path="docs/CLEAN_RUNTIME_ROTATION_STATUS.json"
          content="$(base64 -w0 /tmp/rotation-status.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record clean Runtime rotation status' -f content="$content" \
              -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record clean Runtime rotation status' -f content="$content" \
              -f branch=main >/dev/null
          fi

      - name: Require complete clean rotation
        if: always()
        shell: bash
        run: |
          test "${{ steps.inputs.outcome }}" = "success"
          test "${{ steps.runtime_key.outcome }}" = "success"
          test "${{ steps.source_patch.outcome }}" = "success"
          test "${{ steps.runtime_release.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"
          test "${{ steps.apk_sign.outcome }}" = "success"
          test "${{ steps.workflow_update.outcome }}" = "success"
          test "${{ steps.commit.outcome }}" = "success"
          test "${{ steps.license_deploy.outcome }}" = "success"
          test "${{ steps.runtime_deploy.outcome }}" = "success"
          test "${{ steps.health.outcome }}" = "success"
          test "${{ steps.lifecycle.outcome }}" = "success"
          test "${{ steps.release.outcome }}" = "success"
