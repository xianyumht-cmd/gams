name: Rotate Runtime and release GG 2.0.3

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/rotate-runtime-release-and-build-client.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clean-runtime-rotation
  cancel-in-progress: false

jobs:
  rotate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.LICENSE_ADMIN_PASSWORD }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      LICENSE_ENDPOINT: https://gams-license-api.2320006072.workers.dev
      RUNTIME_ENDPOINT: https://gams-runtime-v2.2320006072.workers.dev
      VERSION_NAME: 2.0.3
      VERSION_CODE: 12
      RELEASE_TAG: gg-2.0.3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate protected inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_LOGIN_SECRET TOKEN_SIGNING_SECRET RUNTIME_MASTER_KEY GG_RELEASE_KEYSTORE_BASE64 GG_RELEASE_KEYSTORE_PASSWORD; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          test "${#TOKEN_SIGNING_SECRET}" -ge 32
          python3 -m pip install --quiet cryptography
          node --input-type=module - <<'NODE'
          import { decodeRuntimeMasterKey } from "./v2/runtime/src/runtime-key.js";
          const key = decodeRuntimeMasterKey(process.env.RUNTIME_MASTER_KEY);
          key.fill(0);
          NODE
          test -s v2/runtime/tools/build_release.py

      - name: Generate new Runtime signing identity and patch sources
        id: source
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/runtime-private.pem /tmp/runtime-public.der' EXIT

          openssl genpkey -algorithm EC -pkeyopt ec_paramgen_curve:P-256 -out /tmp/runtime-private.pem
          openssl pkey -in /tmp/runtime-private.pem -pubout -out remote-script/keys/public.pem
          openssl pkey -pubin -in remote-script/keys/public.pem -outform DER -out /tmp/runtime-public.der

          export RUNTIME_SIGNING_PASSWORD="$(python3 - <<'PY'
          import hashlib, hmac, os
          print(hmac.new(
              os.environ['GG_RELEASE_KEYSTORE_PASSWORD'].encode(),
              b'gams-runtime-release-signing-v1',
              hashlib.sha256,
          ).hexdigest())
          PY
          )"
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in /tmp/runtime-private.pem \
            -out remote-script/keys/private.pem.enc \
            -pass env:RUNTIME_SIGNING_PASSWORD
          unset RUNTIME_SIGNING_PASSWORD

          base64 -w0 /tmp/runtime-public.der > /tmp/runtime-public.der.b64
          echo "public_sha256=$(sha256sum /tmp/runtime-public.der | awk '{print $1}')" >> "$GITHUB_OUTPUT"

          git show eaced92b184fd148f583fe17d501576f11787d31:.github/workflows/v2-build-apks.yml \
            > .github/workflows/v2-build-apks.yml

          python3 - <<'PY'
          import re
          from pathlib import Path

          license_path = Path('license-api/src/index.js')
          license = license_path.read_text(encoding='utf-8')
          for fn in ('adminLogin','adminCreateLicenses','adminListLicenses','adminLicenseAction','issueChallenge','activate','check','selfUnbind'):
              old = f'        return {fn}(request, env);'
              new = f'        return await {fn}(request, env);'
              if old in license:
                  license = license.replace(old, new, 1)
              elif new not in license:
                  raise SystemExit(f'License route mismatch: {fn}')
          license_path.write_text(license, encoding='utf-8')

          runtime_path = Path('v2/runtime/src/index.js')
          runtime = runtime_path.read_text(encoding='utf-8')
          for old, new in (
              ('        return issueChallenge(request, env);','        return await issueChallenge(request, env);'),
              ('        return runtimeAccess(request, env);','        return await runtimeAccess(request, env);'),
              ('        return runtimeBundle(request, env);','        return await runtimeBundle(request, env);'),
              ('      legacyRuntimePassword: env.LEGACY_RUNTIME_PASSWORD || "",','      legacyRuntimePassword: env.ADMIN_PASSWORD || env.LEGACY_RUNTIME_PASSWORD || "",'),
          ):
              if old in runtime:
                  runtime = runtime.replace(old, new, 1)
              elif new not in runtime:
                  raise SystemExit(f'Runtime source mismatch: {old}')
          runtime_path.write_text(runtime, encoding='utf-8')

          client_path = Path('v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java')
          client = client_path.read_text(encoding='utf-8')
          public_key = Path('/tmp/runtime-public.der.b64').read_text().strip()
          pattern = re.compile(
              r'    private static final String RELEASE_PUBLIC_KEY_DER_BASE64 =\n'
              r'(?:\s+"[^"]*"\s*\+?\n?)+?\s*;', re.M)
          client, count = pattern.subn(
              '    private static final String RELEASE_PUBLIC_KEY_DER_BASE64 =\n'
              f'            "{public_key}";', client, count=1)
          if count != 1:
              raise SystemExit(f'Runtime public-key block mismatch: {count}')
          if 'PROTOCOL_APP_VERSION = 11' in client:
              client = client.replace('PROTOCOL_APP_VERSION = 11','PROTOCOL_APP_VERSION = 12',1)
          elif 'PROTOCOL_APP_VERSION = 12' not in client:
              raise SystemExit('Android protocol version mismatch')
          client_path.write_text(client, encoding='utf-8')

          gradle_path = Path('v2/android/client/build.gradle.kts')
          gradle = gradle_path.read_text(encoding='utf-8')
          if 'versionCode = 11' in gradle:
              gradle = gradle.replace('versionCode = 11','versionCode = 12',1)
          if 'versionName = "2.0.2"' in gradle:
              gradle = gradle.replace('versionName = "2.0.2"','versionName = "2.0.3"',1)
          if 'versionCode = 12' not in gradle or 'versionName = "2.0.3"' not in gradle:
              raise SystemExit('Android version update failed')
          gradle_path.write_text(gradle, encoding='utf-8')

          build_path = Path('.github/workflows/v2-build-apks.yml')
          build = build_path.read_text(encoding='utf-8')
          build = build.replace('2.0.2','2.0.3')
          build = build.replace('test "$client_code" = "11"','test "$client_code" = "12"')
          build = build.replace("versionCode='11' versionName='2.0.3'","versionCode='12' versionName='2.0.3'")
          build = build.replace('"versionCode":11','"versionCode":12')
          build_path.write_text(build, encoding='utf-8')
          PY

          node --check license-api/src/index.js
          node --check v2/runtime/src/index.js
          node --check v2/runtime/src/runtime-key.js
          grep -Fq 'versionCode = 12' v2/android/client/build.gradle.kts

      - name: Build and sign Runtime 2.0.3
        id: runtime_release
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/runtime-private.pem /tmp/runtime.sig /tmp/v2-runtime-canonical.txt /tmp/v2-runtime-unsigned.json' EXIT

          export RUNTIME_SIGNING_PASSWORD="$(python3 - <<'PY'
          import hashlib, hmac, os
          print(hmac.new(
              os.environ['GG_RELEASE_KEYSTORE_PASSWORD'].encode(),
              b'gams-runtime-release-signing-v1',
              hashlib.sha256,
          ).hexdigest())
          PY
          )"
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in remote-script/keys/private.pem.enc \
            -out /tmp/runtime-private.pem \
            -pass env:RUNTIME_SIGNING_PASSWORD
          unset RUNTIME_SIGNING_PASSWORD

          script_file="$(jq -r '.file' remote-script/release/manifest.json)"
          game_file="$(jq -r '.file' game-engine/release/manifest.json)"
          test -s "remote-script/release/${script_file}"
          test -s "game-engine/release/${game_file}"

          python3 v2/runtime/tools/build_release.py \
            "remote-script/release/${script_file}" \
            "game-engine/release/${game_file}" \
            "$VERSION_NAME" "$RUNTIME_MASTER_KEY" v2/runtime/release

          openssl dgst -sha256 -sign /tmp/runtime-private.pem \
            -out /tmp/runtime.sig /tmp/v2-runtime-canonical.txt
          openssl dgst -sha256 -verify remote-script/keys/public.pem \
            -signature /tmp/runtime.sig /tmp/v2-runtime-canonical.txt

          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('/tmp/v2-runtime-unsigned.json').read_text())
          manifest['signatureAlgorithm'] = 'SHA256withECDSA'
          manifest['signature'] = base64.b64encode(Path('/tmp/runtime.sig').read_bytes()).decode()
          release = Path('v2/runtime/release')
          (release/'manifest.json').write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          bundle = (release/manifest['file']).read_bytes()
          assert len(bundle) == manifest['size']
          assert hashlib.sha256(bundle).hexdigest() == manifest['sha256']
          PY

      - name: Build, sign and verify GG 2.0.3 APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p v2/android :client:clean :client:lintRelease :client:assembleRelease

          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$unsigned" && test -s "$unsigned"
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/gg-release.jks
          test -s /tmp/gg-release.jks

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n1)"
          signed="/tmp/GG-${VERSION_NAME}-code${VERSION_CODE}.apk"

          "$apksigner" sign \
            --ks /tmp/gg-release.jks \
            --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$signed" "$unsigned"

          "$apksigner" verify --verbose --print-certs "$signed" > /tmp/apk-verify.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apk-verify.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apk-verify.txt
          "$aapt" dump badging "$signed" > /tmp/apk-badging.txt
          grep -Fq "package: name='com.jinli.quickweb' versionCode='12' versionName='2.0.3'" /tmp/apk-badging.txt

          cert_hex="$(sed -n 's/^.*certificate SHA-256 digest: //p' /tmp/apk-verify.txt | head -n1 | tr '[:lower:]' '[:upper:]')"
          test "${#cert_hex}" = "64"
          cert_colon="$(printf '%s' "$cert_hex" | sed 's/../&:/g;s/:$//')"
          printf '%s' "$cert_colon" > /tmp/apk-cert-sha256.txt
          sha256sum "$signed" | awk '{print $1}' > /tmp/apk-sha256.txt

          python3 - <<'PY'
          import re
          from pathlib import Path
          cert = Path('/tmp/apk-cert-sha256.txt').read_text().strip()
          path = Path('.github/workflows/v2-build-apks.yml')
          text = path.read_text(encoding='utf-8')
          text, count = re.subn(
              r'必须使用证书 SHA-256：[0-9A-F:]{95}',
              f'必须使用证书 SHA-256：{cert}', text)
          if count != 1:
              raise SystemExit(f'certificate metadata mismatch: {count}')
          path.write_text(text,encoding='utf-8')
          PY

      - name: Commit rotated sources and Runtime release
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/repair-rotation-workflow.yml
          rm -f .github/workflows/diagnose-android-keystore.yml
          rm -f .github/workflows/patch-rotation-apk-signing.yml
          rm -f .github/workflows/diagnose-main-push.yml
          rm -f .github/workflows/fix-rotation-commit-step.yml
          rm -f .push-diagnosis.tmp

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git add -f "v2/runtime/release/bundle-${VERSION_NAME}.bin"
          git status --short
          git commit -m "Rotate Runtime signing key and publish GG 2.0.3"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Configure and deploy both Workers
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          database_id="$(printf '%s' "$response" | jq -r '.result[] | select(.name=="gams-license-db") | (.uuid // .id)' | head -n1)"
          test -n "$database_id" && test "$database_id" != "null"

          sed "s/__D1_DATABASE_ID__/${database_id}/g" license-api/wrangler.template.jsonc \
            > license-api/wrangler.generated.jsonc
          sed "s/__D1_DATABASE_ID__/${database_id}/g" v2/runtime/wrangler.template.jsonc \
            > v2/runtime/wrangler.generated.jsonc

          cd license-api
          printf '%s' "$ADMIN_LOGIN_SECRET" | npx --yes wrangler@4 secret put ADMIN_LOGIN_SECRET --config wrangler.generated.jsonc
          printf '%s' "$TOKEN_SIGNING_SECRET" | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.generated.jsonc
          npx --yes wrangler@4 d1 migrations apply gams-license-db --remote --config wrangler.generated.jsonc
          npx --yes wrangler@4 deploy --config wrangler.generated.jsonc

          cd ../v2/runtime
          printf '%s' "$TOKEN_SIGNING_SECRET" | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.generated.jsonc
          printf '%s' "$RUNTIME_MASTER_KEY" | npx --yes wrangler@4 secret put RUNTIME_MASTER_KEY --config wrangler.generated.jsonc
          npx --yes wrangler@4 deploy --config wrangler.generated.jsonc

      - name: Wait for release propagation
        id: health
        shell: bash
        run: |
          set -euo pipefail
          manifest_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/v2/runtime/release/manifest.json"
          for attempt in $(seq 1 48); do
            manifest_version="$(curl -fsS "$manifest_url" | jq -r '.versionName' 2>/dev/null || true)"
            license_status="$(curl -sS -o /tmp/license-health.json -w '%{http_code}' "$LICENSE_ENDPOINT/health" || true)"
            runtime_status="$(curl -sS -o /tmp/runtime-health.json -w '%{http_code}' "$RUNTIME_ENDPOINT/health" || true)"
            if [[ "$manifest_version" == "$VERSION_NAME" && "$license_status" == "200" && "$runtime_status" == "200" ]] \
              && jq -e '.ok and .version == 2 and .signedProtocol == true' /tmp/license-health.json >/dev/null \
              && jq -e '.ok and .version == 3 and .splitSecrets == true' /tmp/runtime-health.json >/dev/null; then
              sleep 35
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Run complete signed lifecycle
        id: lifecycle
        run: node scripts/v2-lifecycle-smoke.mjs

      - name: Publish signed APK
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          signed="/tmp/GG-${VERSION_NAME}-code${VERSION_CODE}.apk"
          apk_sha256="$(cat /tmp/apk-sha256.txt)"
          cert_sha256="$(cat /tmp/apk-cert-sha256.txt)"
          cat > /tmp/release-notes.txt <<EOF
          GG ${VERSION_NAME}（versionCode ${VERSION_CODE}）

          - Runtime 已用独立 RUNTIME_MASTER_KEY 重新加密。
          - Runtime 清单签名密钥已轮换。
          - License 与 Runtime 使用独立 TOKEN_SIGNING_SECRET。
          - APK SHA-256：${apk_sha256}
          - APK 证书 SHA-256：${cert_sha256}
          - 生产完整生命周期验收：通过
          EOF
          gh release delete "$RELEASE_TAG" --yes 2>/dev/null || true
          gh release create "$RELEASE_TAG" \
            "$signed#GG-${VERSION_NAME}-code${VERSION_CODE}.apk" \
            --target "${{ steps.commit.outputs.sha }}" \
            --title "GG ${VERSION_NAME}" --notes-file /tmp/release-notes.txt

      - name: Record final rotation status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.inputs.outcome }}" == success \
             && "${{ steps.source.outcome }}" == success \
             && "${{ steps.runtime_release.outcome }}" == success \
             && "${{ steps.apk.outcome }}" == success \
             && "${{ steps.commit.outcome }}" == success \
             && "${{ steps.deploy.outcome }}" == success \
             && "${{ steps.health.outcome }}" == success \
             && "${{ steps.lifecycle.outcome }}" == success \
             && "${{ steps.release.outcome }}" == success ]]; then ok=true; fi

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg triggerCommit "$GITHUB_SHA" \
            --argjson ok "$ok" \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg publicKeySha256 "${{ steps.source.outputs.public_sha256 }}" \
            --arg apkSha256 "$(cat /tmp/apk-sha256.txt 2>/dev/null || true)" \
            --arg certificateSha256 "$(cat /tmp/apk-cert-sha256.txt 2>/dev/null || true)" \
            --arg inputs "${{ steps.inputs.outcome }}" \
            --arg source "${{ steps.source.outcome }}" \
            --arg runtime "${{ steps.runtime_release.outcome }}" \
            --arg apk "${{ steps.apk.outcome }}" \
            --arg commit "${{ steps.commit.outcome }}" \
            --arg deploy "${{ steps.deploy.outcome }}" \
            --arg health "${{ steps.health.outcome }}" \
            --arg lifecycle "${{ steps.lifecycle.outcome }}" \
            --arg release "${{ steps.release.outcome }}" \
            '{schemaVersion:2,generatedAt:$generatedAt,triggerCommit:$triggerCommit,ok:$ok,versionName:$versionName,versionCode:$versionCode,runtimePublicKeySha256:$publicKeySha256,apkSha256:$apkSha256,apkCertificateSha256:$certificateSha256,steps:{inputs:$inputs,sourceAndKeyRotation:$source,runtimeRelease:$runtime,apkBuildAndSigning:$apk,commit:$commit,workerDeploy:$deploy,servicesHealthy:$health,signedLifecycleAcceptance:$lifecycle,githubRelease:$release},oldRuntimePasswordRequired:false,cloudflareSecurityRulesChanged:false,secretsExposed:false}' \
            > /tmp/rotation-status.json

          path="docs/CLEAN_RUNTIME_ROTATION_STATUS.json"
          content="$(base64 -w0 /tmp/rotation-status.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record final clean Runtime rotation' -f content="$content" \
              -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record final clean Runtime rotation' -f content="$content" \
              -f branch=main >/dev/null
          fi

      - name: Require complete rotation
        if: always()
        shell: bash
        run: |
          test "${{ steps.inputs.outcome }}" = success
          test "${{ steps.source.outcome }}" = success
          test "${{ steps.runtime_release.outcome }}" = success
          test "${{ steps.apk.outcome }}" = success
          test "${{ steps.commit.outcome }}" = success
          test "${{ steps.deploy.outcome }}" = success
          test "${{ steps.health.outcome }}" = success
          test "${{ steps.lifecycle.outcome }}" = success
          test "${{ steps.release.outcome }}" = success
