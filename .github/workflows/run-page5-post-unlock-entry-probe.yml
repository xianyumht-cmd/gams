name: Probe page five post unlock entry

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_post_unlock_entry_probe.mjs
      - .github/workflows/run-page5-post-unlock-entry-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-post-unlock-entry-probe-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: page5-post-unlock-entry-probe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate probe script
        shell: bash
        run: node --check scripts/run_page5_post_unlock_entry_probe.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute post unlock entry probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_page5_post_unlock_entry_probe.mjs 2>&1 | tee /tmp/page5-post-unlock-entry-probe.log

      - name: Build probe status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-post-unlock-entry-probe.log && cp /tmp/page5-post-unlock-entry-probe.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          cases = report.get('cases', []) if report else []
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-post-unlock-entry-probe-page-only',
              'summary': report.get('summary') if report else None,
              'caseSummary': [{
                  'name': case.get('name'),
                  'entryPoint': case.get('entryPoint'),
                  'entryRequestCount': case.get('entryRequestCount'),
                  'entryDocumentRequestCount': case.get('entryDocumentRequestCount'),
                  'entryMediaRequestCount': case.get('entryMediaRequestCount'),
                  'uniqueScreenshotCount': case.get('uniqueScreenshotCount'),
                  'mainFrameValid': case.get('mainFrameValid'),
                  'pageErrorCount': len(case.get('pageErrors', [])),
                  'blockedOrderCount': len(case.get('blockedOrders', [])),
              } for case in cases],
              'reportAvailable': bool(report),
              'artifactName': 'page5-post-unlock-entry-probe',
              'pageOnlyProbe': True,
              'candidateTested': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_POST_UNLOCK_ENTRY_PROBE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-post-unlock-entry-probe
          path: page5-post-unlock-entry-probe
          retention-days: 30
          if-no-files-found: warn

      - name: Publish probe status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_POST_UNLOCK_ENTRY_PROBE_STATUS.json docs/PAGE5_POST_UNLOCK_ENTRY_PROBE_STATUS.json
          git add docs/PAGE5_POST_UNLOCK_ENTRY_PROBE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five post unlock entry probe"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce probe capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_POST_UNLOCK_ENTRY_PROBE_STATUS.json >/dev/null
