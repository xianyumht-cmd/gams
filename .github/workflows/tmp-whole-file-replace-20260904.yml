          set -euo pipefail
          if [[ ! -f "${RECIPE}" ]]; then
            python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          old = Path(os.environ['TARGET']).read_bytes()
          sigs=[]
          for i,item in enumerate(os.environ['TARGET_BLOCK_SIGS'].split(';')):
              n,w,h=item.split(',',2)
              sigs.append((i,int(n),int(w,16),h))
          full=[s for s in sigs if s[1] == 65536]
          byweak={}
          for i,n,w,h in full:
              byweak.setdefault(w,[]).append((i,h))
          n=65536
          if len(old) < n:
              raise SystemExit('current file too small')
          win=old[:n]
          s1=sum(win)&0xffff
          s2=sum((n-j)*v for j,v in enumerate(win))&0xffff
          matches={}
          def check(off,s1,s2):
              weak=s1 | (s2<<16)
              candidates=byweak.get(weak)
              if not candidates:
                  return
              strong=hashlib.sha256(old[off:off+n]).hexdigest()
              for idx,h in candidates:
                  if idx not in matches and h == strong:
                      matches[idx]=off
          check(0,s1,s2)
          for off in range(1,len(old)-n+1):
              x=old[off-1]
              y=old[off+n-1]
              s1=(s1-x+y)&0xffff
              s2=(s2+s1-(n*x))&0xffff
              check(off,s1,s2)
          unmatched=[i for i,nn,_,_ in sigs if nn == n and i not in matches]
          print('BLOCK_MATCHES ' + ','.join(f'{i}:{matches[i]}' for i in sorted(matches)))
          print('BLOCK_UNMATCHED ' + ','.join(map(str,unmatched)))
          print(f'BLOCK_COUNTS matched={len(matches)} unmatched={len(unmatched)} total_full={len(full)}')
          PY
            exit 0
          fi

          python3 - <<'PY'
          import base64, hashlib, json, os
          from pathlib import Path
          target = Path(os.environ['TARGET'])
          recipe = json.loads(Path(os.environ['RECIPE']).read_text(encoding='utf-8'))
          old = target.read_bytes()
          out = bytearray()
          for op in recipe['ops']:
              if op[0] == 'r':
                  start, length = int(op[1]), int(op[2])
                  out.extend(old[start:start+length])
              elif op[0] == 'l':
                  out.extend(base64.b64decode(op[1]))
              else:
                  raise SystemExit(f'unknown recipe op: {op[0]}')
          got_size = len(out)
          got_sha = hashlib.sha256(out).hexdigest()
          if got_size != int(recipe['target_size']):
              raise SystemExit(f'target size mismatch: {got_size}')
          if got_sha != recipe['target_sha256']:
              raise SystemExit(f'target sha256 mismatch: {got_sha}')
          tmp = target.with_suffix(target.suffix + '.whole-replacement.tmp')
          tmp.write_bytes(out)
          os.replace(tmp, target)
          print(f'REPLACED size={got_size} sha256={got_sha}')
          PY

          git add "${TARGET}"
          git rm -f "${RECIPE}" "${SELF}"
          git commit -m "Replace game engine 1.0.5 JS as whole file"
          git push origin HEAD:main
