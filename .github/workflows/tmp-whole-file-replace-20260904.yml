name: Temporary whole-file JS replacement

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-whole-file-replace-20260904.yml'

permissions:
  contents: read

jobs:
  export-current-target:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
      - name: Upload current target snapshot
        uses: actions/upload-artifact@v4
        with:
          name: current-game-engine-1.0.5
          path: game-engine/release/game-1.0.5.js
          if-no-files-found: error
          compression-level: 6
