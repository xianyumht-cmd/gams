name: Diagnose production V2 lifecycle

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-production-lifecycle.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.LICENSE_ADMIN_PASSWORD }}
      LICENSE_ENDPOINT: https://gams-license-api.2320006072.workers.dev
      RUNTIME_ENDPOINT: https://gams-runtime-v2.2320006072.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify both health endpoints
        id: health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS "$LICENSE_ENDPOINT/health" | jq -e '.ok and .version == 2 and .signedProtocol == true' >/dev/null
          curl -fsS "$RUNTIME_ENDPOINT/health" | jq -e '.ok and .encryptedRuntime == true' >/dev/null

      - name: Start Runtime Worker live tail
        id: tail
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}"
          : > /tmp/runtime-tail.log
          timeout 90s npx --yes wrangler@4 tail gams-runtime-v2 --format json \
            > /tmp/runtime-tail.log 2>&1 &
          echo $! > /tmp/runtime-tail.pid
          sleep 8

      - name: Run lifecycle with captured log
        id: lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/v2-lifecycle-smoke.mjs 2>&1 | tee /tmp/lifecycle.log

      - name: Stop Runtime Worker live tail
        if: always()
        shell: bash
        run: |
          if [[ -s /tmp/runtime-tail.pid ]]; then
            kill "$(cat /tmp/runtime-tail.pid)" 2>/dev/null || true
          fi
          sleep 5

      - name: Record sanitized diagnosis
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          TAIL_OUTCOME: ${{ steps.tail.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          def sanitize(path, limit):
              source = Path(path)
              text = source.read_text(encoding='utf-8', errors='replace') if source.exists() else ''
              text = text[-limit:]
              text = re.sub(r'(?i)(authorization|token|licenseKey|signature)\\?"?\s*[:=]\s*\\?"?[^,}\s]+', r'\1:<redacted>', text)
              text = re.sub(r'[A-Za-z0-9_+/=-]{48,}', '<redacted>', text)
              return text

          Path('/tmp/lifecycle-sanitized.log').write_text(
              sanitize('/tmp/lifecycle.log', 5000), encoding='utf-8')
          Path('/tmp/runtime-tail-sanitized.log').write_text(
              sanitize('/tmp/runtime-tail.log', 12000), encoding='utf-8')
          PY

          ok=false
          if [[ "$HEALTH_OUTCOME" == "success" && "$LIFECYCLE_OUTCOME" == "success" ]]; then ok=true; fi
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg health "$HEALTH_OUTCOME" \
            --arg tail "$TAIL_OUTCOME" \
            --arg lifecycle "$LIFECYCLE_OUTCOME" \
            --rawfile lifecycleLog /tmp/lifecycle-sanitized.log \
            --rawfile runtimeTail /tmp/runtime-tail-sanitized.log \
            --argjson ok "$ok" \
            '{schemaVersion:2,generatedAt:$generatedAt,triggerCommit:$commit,ok:$ok,health:$health,tail:$tail,lifecycle:$lifecycle,sanitizedLifecycleLog:$lifecycleLog,sanitizedRuntimeTail:$runtimeTail,secretsExposed:false}' \
            > /tmp/diagnosis.json

          path="docs/PRODUCTION_LIFECYCLE_DIAGNOSIS.json"
          content="$(base64 -w0 /tmp/diagnosis.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record production Runtime access diagnosis' -f content="$content" \
              -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record production Runtime access diagnosis' -f content="$content" \
              -f branch=main >/dev/null
          fi

      - name: Require successful lifecycle
        if: always()
        run: test "${{ steps.lifecycle.outcome }}" = "success"
