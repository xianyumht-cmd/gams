name: Temporary device validation diagnostics

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-device-validation-diagnostics-20260904.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply diagnostics patch
        run: python3 docs/tmp_device_validation_patch.py
      - name: Commit diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add license-api/src/index.js
          git commit -m "diag: identify invalid device validation field"
          git push origin HEAD:main
