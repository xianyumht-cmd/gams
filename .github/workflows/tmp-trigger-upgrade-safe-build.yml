name: Temporary upgrade-safe build trigger

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/tmp-trigger-upgrade-safe-build.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove one-shot trigger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-trigger-upgrade-safe-build.yml
          git commit -m "chore: remove one-shot upgrade-safe build trigger"
          git push origin HEAD:main
