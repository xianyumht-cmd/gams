name: Repair complete restore workflow assertions

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-control-center-restore.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace rigid manager source assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/restore-complete-control-center-and-client.yml')
          text = path.read_text(encoding='utf-8')
          pairs = [
              ("grep -Fq 'api.get(\"/v1/admin/dashboard\"' \"$manager\"",
               "grep -Fq '/v1/admin/dashboard' \"$manager\""),
              ("grep -Fq 'api.get(\"/v1/admin/devices' \"$manager\"",
               "grep -Fq '/v1/admin/devices' \"$manager\""),
              ("grep -Fq 'api.get(\"/v1/admin/audit' \"$manager\"",
               "grep -Fq '/v1/admin/audit' \"$manager\""),
              ("grep -Fq 'api.get(\"/v1/admin/runtime' \"$manager\"",
               "grep -Fq '/v1/admin/runtime' \"$manager\""),
          ]
          changed = 0
          for old, new in pairs:
              if old in text:
                  text = text.replace(old, new, 1)
                  changed += 1
              elif new not in text:
                  raise SystemExit(f'neither old nor new assertion found: {old}')
          if changed == 0:
              raise SystemExit('restore workflow was already patched; refusing empty trigger')
          path.write_text(text, encoding='utf-8')
          print(f'replaced {changed} rigid assertions')
          PY
          grep -Fq "grep -Fq '/v1/admin/dashboard' \"\$manager\"" .github/workflows/restore-complete-control-center-and-client.yml
          grep -Fq "grep -Fq '/v1/admin/devices' \"\$manager\"" .github/workflows/restore-complete-control-center-and-client.yml
          grep -Fq "grep -Fq '/v1/admin/audit' \"\$manager\"" .github/workflows/restore-complete-control-center-and-client.yml
          grep -Fq "grep -Fq '/v1/admin/runtime' \"\$manager\"" .github/workflows/restore-complete-control-center-and-client.yml
          git diff --check

      - name: Commit repair and trigger complete restore
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/restore-complete-control-center-and-client.yml
          git commit -m 'Relax manager route assertions for complete restore'
          git pull --rebase origin main
          git push origin HEAD:main

