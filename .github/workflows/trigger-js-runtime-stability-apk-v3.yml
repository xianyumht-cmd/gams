name: Trigger JS runtime stability APK v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-js-runtime-stability-apk-v3.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch v3 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run build-js-runtime-stability-apk-v3.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main

