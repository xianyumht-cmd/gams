name: Security and compatibility regression

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-and-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reject generated and sensitive repository files
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(git ls-files | grep -E '(^|/)(node_modules|build|\.gradle)/|\.(apk|aab|class|dex|jks|keystore)$' || true)"
          if [[ -n "$forbidden" ]]; then
            printf '%s\n' "$forbidden"
            echo "Generated, dependency, or sensitive build files are tracked"
            exit 1
          fi

      - name: Run syntax and source security checks
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          python3 -m py_compile v2/runtime/tools/build_release.py
          node --check license-api/src/index.js
          node --check v2/runtime/src/index.js
          node --check v2/runtime/src/runtime-key.js
          node --check scripts/v2-lifecycle-smoke.mjs
          node --check tests/runtime-key-compat.test.mjs
          node --check tests/source-security.test.mjs
          node tests/runtime-key-compat.test.mjs
          node tests/source-security.test.mjs

      - name: Validate Wrangler configuration and local migrations
        shell: bash
        run: |
          set -euo pipefail
          sed 's/__D1_DATABASE_ID__/00000000-0000-0000-0000-000000000000/g' \
            license-api/wrangler.template.jsonc > license-api/wrangler.generated.jsonc
          sed 's/__D1_DATABASE_ID__/00000000-0000-0000-0000-000000000000/g' \
            v2/runtime/wrangler.template.jsonc > v2/runtime/wrangler.generated.jsonc
          npx --yes wrangler@4 d1 migrations apply gams-license-db --local \
            --config license-api/wrangler.generated.jsonc
          npx --yes wrangler@4 deploy --dry-run --config license-api/wrangler.generated.jsonc
          npx --yes wrangler@4 deploy --dry-run --config v2/runtime/wrangler.generated.jsonc

  android-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build and lint hardened client
        working-directory: v2/android
        run: gradle --no-daemon :client:clean :client:lintRelease :client:assembleRelease
