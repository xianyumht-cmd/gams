name: Temporary deploy License API without secret reset

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-deploy-license-api-no-secret-reset-20260904.yml

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate current source
        run: node --check license-api/src/index.js
      - name: Resolve D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          list="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          database_id="$(printf '%s' "$list" | jq -r '.result[] | select(.name=="gams-license-db") | (.uuid // .id)' | head -n1)"
          test -n "$database_id" && test "$database_id" != "null"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"
      - name: Generate Wrangler configuration
        working-directory: license-api
        run: sed "s/__D1_DATABASE_ID__/${{ steps.d1.outputs.database_id }}/g" wrangler.template.jsonc > wrangler.generated.jsonc
      - name: Deploy current production worker
        working-directory: license-api
        run: npx --yes wrangler@4 deploy --config wrangler.generated.jsonc
      - name: Verify worker health
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://gams-license-api.2320006072.workers.dev/health"
          for attempt in $(seq 1 20); do
            status="$(curl -sS -o /tmp/health.json -w '%{http_code}' "$endpoint" || true)"
            if [[ "$status" == "200" ]] && jq -e '.ok == true and .signedProtocol == true' /tmp/health.json >/dev/null; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 3
          done
          cat /tmp/health.json 2>/dev/null || true
          exit 1
