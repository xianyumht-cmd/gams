name: Extract second purchase call-chain source slices

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_latest_page_lifecycle_request_trace.mjs
      - .github/workflows/run-latest-page-lifecycle-trace.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-second-purchase-callchain-slice-20260806
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IMPLEMENTATION_REF: fix/page5-missing-constructor-mobile-bridge-20260806
      OUTPUT_DIR: page5-second-purchase-callchain-slice
      CURRENT_SECOND_PATH: /tmp/current-game-1.0.5.js
      CURRENT_SECOND_SHA256: 57765fbb8d9a0529ed1463623f1bed9c05052e76396a6aaa89fdd2ecc673bc72

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read isolated implementation runtime
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$IMPLEMENTATION_REF:refs/remotes/origin/$IMPLEMENTATION_REF"
          git show "origin/$IMPLEMENTATION_REF:game-engine/release/game-1.0.5.js" > "$CURRENT_SECOND_PATH"
          test -s "$CURRENT_SECOND_PATH"
          test "$(sha256sum "$CURRENT_SECOND_PATH" | awk '{print $1}')" = "$CURRENT_SECOND_SHA256"

      - name: Verify bounded static diagnostic
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run_latest_page_lifecycle_request_trace.mjs
          grep -Fq 'page5-second-purchase-callchain-slice' scripts/run_latest_page_lifecycle_request_trace.mjs
          grep -Fq '3522415' scripts/run_latest_page_lifecycle_request_trace.mjs
          grep -Fq '1935617' scripts/run_latest_page_lifecycle_request_trace.mjs
          grep -Fq '397012' scripts/run_latest_page_lifecycle_request_trace.mjs
          grep -Fq '2035610' scripts/run_latest_page_lifecycle_request_trace.mjs

      - name: Extract bounded call-chain contexts
        id: inspect_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_latest_page_lifecycle_request_trace.mjs 2>&1 | tee /tmp/page5-second-purchase-callchain-slice.log

      - name: Build static diagnostic status
        if: always()
        shell: bash
        env:
          INSPECT_OUTCOME: ${{ steps.inspect_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-second-purchase-callchain-slice.log && cp /tmp/page5-second-purchase-callchain-slice.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          capture_ok = bool(report) and bool(report.get('captureOk')) and os.environ.get('INSPECT_OUTCOME') == 'success'
          slices = (report or {}).get('slices') or []
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('INSPECT_OUTCOME', 'unknown'),
              'ok': capture_ok,
              'captureOk': capture_ok,
              'mode': 'page5-second-purchase-callchain-slice',
              'implementationRef': os.environ['IMPLEMENTATION_REF'],
              'runtimeSha256': os.environ['CURRENT_SECOND_SHA256'],
              'summary': (report or {}).get('summary') or {},
              'sliceIndex': [
                  {
                      'label': item.get('label'),
                      'traceOffset': item.get('traceOffset'),
                      'nearestTokenOffset': item.get('nearestTokenOffset'),
                      'nearestTokenDistance': item.get('nearestTokenDistance'),
                      'snippetSha256': item.get('snippetSha256'),
                  }
                  for item in slices
              ],
              'artifactName': 'page5-second-purchase-callchain-slice',
              'candidatePrepared': False,
              'correctionApplied': False,
              'runtimeFilesChanged': False,
              'productionDefaultChanged': False,
              'androidClientChanged': False,
              'apkBuilt': False,
              'paymentCompleted': False,
          }
          Path('/tmp/PAGE5_SECOND_PURCHASE_CALLCHAIN_SLICE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-second-purchase-callchain-slice
          path: |
            page5-second-purchase-callchain-slice
            /tmp/PAGE5_SECOND_PURCHASE_CALLCHAIN_SLICE_STATUS.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish static diagnostic status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          mkdir -p docs
          cp /tmp/PAGE5_SECOND_PURCHASE_CALLCHAIN_SLICE_STATUS.json docs/PAGE5_SECOND_PURCHASE_CALLCHAIN_SLICE_STATUS.json
          git add docs/PAGE5_SECOND_PURCHASE_CALLCHAIN_SLICE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record second purchase call-chain source slices"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce read-only slice gate
        if: always()
        shell: bash
        run: jq -e '.captureOk == true and .candidatePrepared == false and .correctionApplied == false and .apkBuilt == false' /tmp/PAGE5_SECOND_PURCHASE_CALLCHAIN_SLICE_STATUS.json >/dev/null
