name: Probe target open-menu callback contract

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_guard_full_entry_matrix.mjs
      - scripts/prepare_page5_scoped_mobile_contract_matrix.py
      - scripts/prepare_target_open_menu_contract_probe.py
      - scripts/prepare_target_open_menu_contract_probe_fixed.py
      - scripts/target_open_menu_contract_probe.trigger
      - .github/workflows/test-page5-platform-fallback-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: target-open-menu-contract-probe-20260806
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: target-open-menu-contract-probe
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js
      GENERATED_PROBE: scripts/run_target_open_menu_contract_probe.generated.mjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare callback contract probe
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CURRENT_FIRST_PATH"
          test -s "$CURRENT_SECOND_PATH"
          python3 -m py_compile scripts/prepare_page5_scoped_mobile_contract_matrix.py scripts/prepare_target_open_menu_contract_probe.py scripts/prepare_target_open_menu_contract_probe_fixed.py
          python3 scripts/prepare_target_open_menu_contract_probe_fixed.py --output "$GENERATED_PROBE"
          node --check "$GENERATED_PROBE"
          grep -Fq 'target-open-menu-contract-read-only-probe' "$GENERATED_PROBE"
          grep -Fq '__gamsOpenMenuContractProbe' "$GENERATED_PROBE"
          grep -Fq 'secondBooleanFields' "$GENERATED_PROBE"
          grep -Fq 'workingTargetListCount > 0' "$GENERATED_PROBE"
          grep -Fq 'page5TargetReadCount > 0' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute callback contract comparison
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/target-open-menu-contract-probe.log

      - name: Build callback contract status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/target-open-menu-contract-probe.log && cp /tmp/target-open-menu-contract-probe.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          summary = (report or {}).get('summary') or {}
          cases = (report or {}).get('cases') or []

          def compact_case(page_name):
              case = next((item for item in cases if item.get('page') == page_name), None)
              if not case:
                  return None
              contract = case.get('openMenuContract') or {}
              calls = contract.get('calls') or []
              callbacks = contract.get('callbacks') or []
              return {
                  'page': page_name,
                  'install': case.get('openMenuContractInstall'),
                  'callCount': len(calls),
                  'callbackCount': len(callbacks),
                  'calls': [
                      {
                          'argCount': item.get('argCount'),
                          'callbackIndex': item.get('callbackIndex'),
                          'argTypes': [(arg or {}).get('type') for arg in (item.get('args') or [])],
                      }
                      for item in calls[:20]
                  ],
                  'callbacks': [
                      {
                          'callIndex': item.get('callIndex'),
                          'argCount': item.get('argCount'),
                          'argTypes': [(arg or {}).get('type') for arg in (item.get('args') or [])],
                          'secondOwnKeys': item.get('secondOwnKeys') or [],
                          'secondBooleanFields': item.get('secondBooleanFields') or {},
                      }
                      for item in callbacks[:20]
                  ],
                  'targetWindow': case.get('targetWindow'),
                  'pageErrorCount': len(case.get('pageErrors') or []),
                  'blockedOrderCount': len(case.get('blockedOrders') or []),
                  'fatalError': case.get('fatalError'),
              }

          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'target-open-menu-contract-read-only-probe',
              'summary': summary,
              'workingPage': compact_case('working-page'),
              'page5': compact_case('page5'),
              'candidatePatch': (report or {}).get('candidatePatch'),
              'reportAvailable': bool(report),
              'artifactName': 'target-open-menu-contract-probe',
              'readOnlyProbe': True,
              'callbackArgumentsForwardedUnchanged': True,
              'callbackReturnValuesModified': False,
              'candidatePersisted': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/TARGET_OPEN_MENU_CONTRACT_PROBE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-open-menu-contract-probe
          path: target-open-menu-contract-probe
          retention-days: 30
          if-no-files-found: warn

      - name: Publish callback contract status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/TARGET_OPEN_MENU_CONTRACT_PROBE_STATUS.json docs/TARGET_OPEN_MENU_CONTRACT_PROBE_STATUS.json
          git add docs/TARGET_OPEN_MENU_CONTRACT_PROBE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record target menu callback contract probe"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce callback contract capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/TARGET_OPEN_MENU_CONTRACT_PROBE_STATUS.json >/dev/null
