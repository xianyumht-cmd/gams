name: Probe page five candidate mouse-up state

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_candidate_mouseup_state_probe.mjs
      - scripts/page5_candidate_mouseup_state_probe.trigger
      - .github/workflows/test-page5-platform-fallback-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-candidate-mouseup-state-probe-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUTPUT_DIR: page5-candidate-mouseup-state-probe
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate candidate mouse-up state probe
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CURRENT_FIRST_PATH"
          test -s "$CURRENT_SECOND_PATH"
          node --check scripts/run_page5_candidate_mouseup_state_probe.mjs
          grep -Fq 'page5-candidate-mouseup-state-read-only-probe' scripts/run_page5_candidate_mouseup_state_probe.mjs
          grep -Fq 'before-core' scripts/run_page5_candidate_mouseup_state_probe.mjs
          grep -Fq 'after-click-decision' scripts/run_page5_candidate_mouseup_state_probe.mjs
          grep -Fq 'blockedOrders' scripts/run_page5_candidate_mouseup_state_probe.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute candidate mouse-up state probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_page5_candidate_mouseup_state_probe.mjs 2>&1 | tee /tmp/page5-candidate-mouseup-state-probe.log

      - name: Build candidate mouse-up state status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-candidate-mouseup-state-probe.log && cp /tmp/page5-candidate-mouseup-state-probe.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          pauses = report.get('pauses', []) if report else []
          compact_pauses = []
          for pause in pauses:
              state = pause.get('state', {}) or {}
              compact_pauses.append({
                  'labels': pause.get('labels', []),
                  'functionName': pause.get('functionName'),
                  'location': pause.get('location'),
                  'stateAvailable': state.get('available'),
                  'state': state.get('value'),
                  'stateError': state.get('exception'),
              })
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-candidate-mouseup-state-read-only-probe',
              'pauseCount': len(pauses),
              'pauses': compact_pauses,
              'function': report.get('function') if report else None,
              'beforeCoreBreakpoint': report.get('before-core') if report else None,
              'afterDecisionBreakpoint': report.get('after-click-decision') if report else None,
              'mainFrameValid': report.get('mainFrameValid') if report else None,
              'pageErrorCount': len(report.get('pageErrors', [])) if report else None,
              'blockedOrderCount': len(report.get('blockedOrders', [])) if report else None,
              'debuggerErrorCount': len(report.get('debuggerErrors', [])) if report else None,
              'candidatePatch': report.get('candidatePatch') if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'page5-candidate-mouseup-state-probe',
              'readOnlyProbe': True,
              'pageScriptModified': False,
              'candidatePersisted': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_CANDIDATE_MOUSEUP_STATE_PROBE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-candidate-mouseup-state-probe
          path: page5-candidate-mouseup-state-probe
          retention-days: 30
          if-no-files-found: warn

      - name: Publish candidate mouse-up state status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_CANDIDATE_MOUSEUP_STATE_PROBE_STATUS.json docs/PAGE5_CANDIDATE_MOUSEUP_STATE_PROBE_STATUS.json
          git add docs/PAGE5_CANDIDATE_MOUSEUP_STATE_PROBE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five candidate mouse-up state"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce candidate mouse-up state capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_CANDIDATE_MOUSEUP_STATE_PROBE_STATUS.json >/dev/null
