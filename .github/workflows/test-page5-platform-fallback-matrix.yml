name: Analyze second-file old baseline delta

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/analyze_second_file_baseline_delta.py
      - scripts/second_file_baseline_delta.trigger
      - .github/workflows/test-page5-platform-fallback-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: second-file-old-baseline-delta-20260805
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTPUT_DIR: second-file-old-baseline-delta
      BASELINE_PATH: /tmp/old-clean-baseline.js
      CURRENT_PATH: game-engine/release/game-1.0.5.js

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - name: Validate delta analyzer
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/analyze_second_file_baseline_delta.py
          test -s "$CURRENT_PATH"
          git show origin/candidate-game-baseline-ab-20260804:candidate-runtime-game-baseline/release/game-1.0.5.js > "$BASELINE_PATH"
          test -s "$BASELINE_PATH"

      - name: Analyze old baseline to current delta
        id: delta_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 scripts/analyze_second_file_baseline_delta.py \
            --baseline "$BASELINE_PATH" \
            --current "$CURRENT_PATH" \
            --output "$OUTPUT_DIR" 2>&1 | tee /tmp/second-file-old-baseline-delta.log

      - name: Build baseline delta status
        if: always()
        shell: bash
        env:
          DELTA_OUTCOME: ${{ steps.delta_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/second-file-old-baseline-delta.log && cp /tmp/second-file-old-baseline-delta.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('DELTA_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('DELTA_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'second-file-old-baseline-delta-analysis',
              'baseline': report.get('baseline') if report else None,
              'current': report.get('current') if report else None,
              'sizeDelta': report.get('sizeDelta') if report else None,
              'commonPrefixLength': report.get('commonPrefixLength') if report else None,
              'commonSuffixLength': report.get('commonSuffixLength') if report else None,
              'baselineMiddle': report.get('baselineMiddle') if report else None,
              'currentMiddle': report.get('currentMiddle') if report else None,
              'singleContiguousDelta': report.get('singleContiguousDelta') if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'second-file-old-baseline-delta',
              'readOnlyAnalysis': True,
              'candidatePersisted': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/SECOND_FILE_OLD_BASELINE_DELTA_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: second-file-old-baseline-delta
          path: second-file-old-baseline-delta
          retention-days: 30
          if-no-files-found: warn

      - name: Publish baseline delta status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/SECOND_FILE_OLD_BASELINE_DELTA_STATUS.json docs/SECOND_FILE_OLD_BASELINE_DELTA_STATUS.json
          git add docs/SECOND_FILE_OLD_BASELINE_DELTA_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record second-file old baseline delta"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce baseline delta analysis
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/SECOND_FILE_OLD_BASELINE_DELTA_STATUS.json >/dev/null
