name: Build isolated page five device candidate through registered entry

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/page5_device_candidate.trigger
      - scripts/run_page5_device_candidate_worker.sh
      - .github/workflows/test-page5-platform-fallback-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-device-candidate-workers-dev-20260806
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CANDIDATE_BRANCH: candidate-page5-runtime-device-20260806
      CANDIDATE_BASE_COMMIT: a1de079f395642fe2f2c081492f286239538812c
      EXPECTED_GAME_SHA256: 57765fbb8d9a0529ed1463623f1bed9c05052e76396a6aaa89fdd2ecc673bc72
      CANDIDATE_RUNTIME_VERSION: 2.0.5-page5-device-c1
      CANDIDATE_WORKER_NAME: gams-runtime-v2-page5-candidate
      CANDIDATE_WORKER_HOST: gams-runtime-v2-page5-candidate.2320006072.workers.dev
      PRIMARY_HOST: gams-runtime-v2-page5-candidate.2320006072.workers.dev
      FALLBACK_HOST: gams-runtime-v2-page5-candidate.2320006072.workers.dev
      CANDIDATE_PREFIX: /
      CANDIDATE_ROUTE: gams-runtime-v2-page5-candidate.2320006072.workers.dev/*
      APK_VERSION_NAME: 2.0.11-page5-candidate
      APK_VERSION_CODE: 21
      WORKTREE: /tmp/gams-page5-device-candidate
      OUTPUT_DIR: /tmp/gams-page5-device-output
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - name: Publish running marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'running',
              'ok': False,
              'mode': 'isolated-device-runtime-and-apk-candidate',
              'candidateBranch': os.environ['CANDIDATE_BRANCH'],
              'candidateRuntimeVersion': os.environ['CANDIDATE_RUNTIME_VERSION'],
              'candidatePrefix': os.environ['CANDIDATE_PREFIX'],
              'candidateRoute': os.environ['CANDIDATE_ROUTE'],
              'candidateWorkerHost': os.environ['CANDIDATE_WORKER_HOST'],
              'apkVersionName': os.environ['APK_VERSION_NAME'],
              'apkVersionCode': int(os.environ['APK_VERSION_CODE']),
              'productionDefaultChanged': False,
              'productionRuntimeChanged': False,
              'formalApkChanged': False,
              'candidateApkPublished': False,
              'paymentCompleted': False,
          }
          Path('/tmp/PAGE5_DEVICE_CANDIDATE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          mkdir -p docs
          cp /tmp/PAGE5_DEVICE_CANDIDATE_STATUS.json docs/PAGE5_DEVICE_CANDIDATE_STATUS.json
          git add docs/PAGE5_DEVICE_CANDIDATE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Mark isolated Workers.dev device candidate running"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Execute isolated runtime and APK candidate build
        id: candidate_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          chmod +x scripts/run_page5_device_candidate_worker.sh
          scripts/run_page5_device_candidate_worker.sh 2>&1 | tee /tmp/page5-device-candidate.log

      - name: Build completed candidate status
        if: always()
        shell: bash
        env:
          CANDIDATE_OUTCOME: ${{ steps.candidate_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-device-candidate.log && cp /tmp/page5-device-candidate.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          apk_files = sorted(output.glob('*.apk'))
          manifest_path = output / 'runtime-manifest.json'
          route_path = output / 'route-probe.json'
          runtime_commit_path = Path('/tmp/page5-device-runtime-commit.txt')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8')) if manifest_path.exists() else None
          route = json.loads(route_path.read_text(encoding='utf-8')) if route_path.exists() else None
          runtime_commit = runtime_commit_path.read_text(encoding='utf-8').strip() if runtime_commit_path.exists() else None
          apk = None
          if len(apk_files) == 1:
              data = apk_files[0].read_bytes()
              apk = {
                  'name': apk_files[0].name,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
                  'packageName': 'com.jinli.quickweb',
                  'versionCode': int(os.environ['APK_VERSION_CODE']),
                  'versionName': os.environ['APK_VERSION_NAME'],
              }
          ok = (
              os.environ.get('CANDIDATE_OUTCOME') == 'success'
              and apk is not None
              and apk['size'] > 30000
              and bool(manifest)
              and manifest.get('versionName') == os.environ['CANDIDATE_RUNTIME_VERSION']
              and manifest.get('gameSha256') == os.environ['EXPECTED_GAME_SHA256']
              and bool(route)
              and route.get('primary', {}).get('ok') is True
              and route.get('fallback', {}).get('ok') is True
              and bool(runtime_commit)
          )
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('CANDIDATE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'isolated-device-runtime-and-apk-candidate',
              'candidateBranch': os.environ['CANDIDATE_BRANCH'],
              'candidateRuntimeCommit': runtime_commit,
              'candidateRuntimeVersion': os.environ['CANDIDATE_RUNTIME_VERSION'],
              'candidateRuntimeManifest': manifest,
              'candidatePrefix': os.environ['CANDIDATE_PREFIX'],
              'candidateRoute': os.environ['CANDIDATE_ROUTE'],
              'candidateWorkerName': os.environ['CANDIDATE_WORKER_NAME'],
              'candidateWorkerHost': os.environ['CANDIDATE_WORKER_HOST'],
              'primaryHost': os.environ['PRIMARY_HOST'],
              'fallbackHost': os.environ['FALLBACK_HOST'],
              'routeProbe': route,
              'apk': apk,
              'artifactName': 'GG-page5-device-candidate',
              'browserValidationRunId': 31051809043,
              'finalInteractionRunId': 31050480987,
              'productionDefaultChanged': False,
              'productionRuntimeChanged': False,
              'formalApkChanged': False,
              'candidateApkPublished': False,
              'paymentCompleted': False,
              'realOrderRequestsAllowed': False,
              'diagnosticBranch': os.environ.get('GITHUB_REF_NAME', ''),
              'diagnosticCommit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_DEVICE_CANDIDATE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GG-page5-device-candidate
          path: |
            /tmp/gams-page5-device-output
            /tmp/PAGE5_DEVICE_CANDIDATE_STATUS.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish completed status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          mkdir -p docs
          cp /tmp/PAGE5_DEVICE_CANDIDATE_STATUS.json docs/PAGE5_DEVICE_CANDIDATE_STATUS.json
          git add docs/PAGE5_DEVICE_CANDIDATE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record isolated Workers.dev device candidate build"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce device candidate gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_DEVICE_CANDIDATE_STATUS.json >/dev/null
