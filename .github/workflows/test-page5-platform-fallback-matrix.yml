name: Probe page five candidate scope state v5

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_candidate_mouseup_state_probe.mjs
      - scripts/prepare_page5_candidate_mouseup_state_probe_v2.py
      - scripts/prepare_page5_candidate_cover_listener_probe.py
      - scripts/prepare_page5_candidate_scope_state_probe_v5.py
      - scripts/page5_candidate_scope_state_probe_v5.trigger
      - .github/workflows/test-page5-platform-fallback-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-candidate-scope-state-probe-v5-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUTPUT_DIR: page5-candidate-scope-state-probe-v5
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js
      GENERATED_PROBE: scripts/run_page5_candidate_scope_state_probe_v5.generated.mjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare candidate scope state probe v5
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CURRENT_FIRST_PATH"
          test -s "$CURRENT_SECOND_PATH"
          python3 -m py_compile scripts/prepare_page5_candidate_mouseup_state_probe_v2.py scripts/prepare_page5_candidate_cover_listener_probe.py scripts/prepare_page5_candidate_scope_state_probe_v5.py
          python3 scripts/prepare_page5_candidate_scope_state_probe_v5.py --output "$GENERATED_PROBE"
          node --check "$GENERATED_PROBE"
          grep -Fq 'page5-candidate-scope-state-read-only-probe-v5' "$GENERATED_PROBE"
          grep -Fq 'snapshotTrackedScopes' "$GENERATED_PROBE"
          grep -Fq 'scopeBefore' "$GENERATED_PROBE"
          grep -Fq 'scopeAfter' "$GENERATED_PROBE"
          grep -Fq '__gamsNavigationGuard' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute candidate scope state probe v5
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/page5-candidate-scope-state-probe-v5.log

      - name: Build candidate scope state v5 status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-candidate-scope-state-probe-v5.log && cp /tmp/page5-candidate-scope-state-probe-v5.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          before = report.get('scopeBefore', []) if report else []
          after = report.get('scopeAfter', []) if report else []
          before_values = {}
          after_values = {}
          for scope in before:
              for name, value in (scope.get('values', {}) or {}).items():
                  before_values[name] = value
          for scope in after:
              for name, value in (scope.get('values', {}) or {}).items():
                  after_values[name] = value
          names = sorted(set(before_values) | set(after_values))
          delta = {
              name: {'before': before_values.get(name), 'after': after_values.get(name)}
              for name in names
              if before_values.get(name) != after_values.get(name)
          }
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-candidate-scope-state-read-only-probe-v5',
              'listenerSourceLength': (report.get('listener') or {}).get('sourceLength') if report else None,
              'listenerSourceSha256': (report.get('listener') or {}).get('sourceSha256') if report else None,
              'listenerScopeCount': (report.get('listener') or {}).get('scopeCount') if report else None,
              'scopeBefore': before,
              'scopeAfter': after,
              'trackedBeforeValues': before_values,
              'trackedAfterValues': after_values,
              'trackedDelta': delta,
              'canvasListener': report.get('canvasListener') if report else None,
              'goto': report.get('goto') if report else None,
              'final': report.get('final') if report else None,
              'fatalError': report.get('fatalError') if report else None,
              'mainFrameValid': report.get('mainFrameValid') if report else None,
              'pageErrorCount': len(report.get('pageErrors', [])) if report else None,
              'blockedOrderCount': len(report.get('blockedOrders', [])) if report else None,
              'debuggerErrorCount': len(report.get('debuggerErrors', [])) if report else None,
              'candidatePatch': report.get('candidatePatch') if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'page5-candidate-scope-state-probe-v5',
              'readOnlyProbe': True,
              'pageScriptModified': False,
              'candidatePersisted': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_CANDIDATE_SCOPE_STATE_PROBE_V5_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-candidate-scope-state-probe-v5
          path: page5-candidate-scope-state-probe-v5
          retention-days: 30
          if-no-files-found: warn

      - name: Publish candidate scope state v5 status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_CANDIDATE_SCOPE_STATE_PROBE_V5_STATUS.json docs/PAGE5_CANDIDATE_SCOPE_STATE_PROBE_V5_STATUS.json
          git add docs/PAGE5_CANDIDATE_SCOPE_STATE_PROBE_V5_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five candidate scope state v5"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce candidate scope state v5 capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_CANDIDATE_SCOPE_STATE_PROBE_V5_STATUS.json >/dev/null
