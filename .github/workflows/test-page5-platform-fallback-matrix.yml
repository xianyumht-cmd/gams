name: Test five-page missing-constructor bridge matrix

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_guard_full_entry_matrix.mjs
      - scripts/prepare_five_page_missing_constructor_matrix.py
      - scripts/five_page_missing_constructor_matrix.trigger
      - .github/workflows/test-page5-platform-fallback-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: five-page-missing-constructor-bridge-matrix-20260806
  cancel-in-progress: true

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      OUTPUT_DIR: five-page-missing-constructor-matrix
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js
      GENERATED_MATRIX: scripts/run_five_page_missing_constructor_matrix.generated.mjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare five-page matrix
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CURRENT_FIRST_PATH"
          test -s "$CURRENT_SECOND_PATH"
          python3 -m py_compile scripts/prepare_five_page_missing_constructor_matrix.py
          python3 scripts/prepare_five_page_missing_constructor_matrix.py --output "$GENERATED_MATRIX"
          node --check "$GENERATED_MATRIX"
          grep -Fq 'five-page-missing-constructor-mobile-bridge-matrix' "$GENERATED_MATRIX"
          grep -Fq "typeof SCGMenu==='undefined'" "$GENERATED_MATRIX"
          grep -Fq '__gamsFivePageCanvasEngine' "$GENERATED_MATRIX"
          grep -Fq 'candidateFirstFourMarkerCount === 4' "$GENERATED_MATRIX"
          grep -Fq 'candidatePage5TargetListCount > 0' "$GENERATED_MATRIX"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute current and candidate five-page matrix
        id: matrix_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_MATRIX" 2>&1 | tee /tmp/five-page-missing-constructor-matrix.log

      - name: Build five-page matrix status
        if: always()
        shell: bash
        env:
          MATRIX_OUTCOME: ${{ steps.matrix_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/five-page-missing-constructor-matrix.log && cp /tmp/five-page-missing-constructor-matrix.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          summary = (report or {}).get('summary') or {}
          cases = (report or {}).get('cases') or []

          compact_cases = []
          for item in cases:
              compact_cases.append({
                  'pair': item.get('pair'),
                  'page': item.get('page'),
                  'marker': item.get('marker'),
                  'targetScreenChanged': item.get('targetScreenChanged'),
                  'targetWindow': item.get('targetWindow'),
                  'dynamicTarget': item.get('dynamicTarget'),
                  'engineCapture': item.get('engineCapture'),
                  'pageErrorCount': len(item.get('pageErrors') or []),
                  'pageErrors': item.get('pageErrors') or [],
                  'blockedOrderCount': len(item.get('blockedOrders') or []),
                  'fatalError': item.get('fatalError'),
              })

          ok = bool(report) and bool(report.get('pass')) and os.environ.get('MATRIX_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('MATRIX_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'five-page-missing-constructor-mobile-bridge-matrix',
              'summary': summary,
              'cases': compact_cases,
              'candidatePatch': (report or {}).get('candidatePatch'),
              'reportAvailable': bool(report),
              'artifactName': 'five-page-missing-constructor-matrix',
              'currentCandidateCompared': True,
              'candidatePersisted': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/FIVE_PAGE_MISSING_CONSTRUCTOR_MATRIX_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: five-page-missing-constructor-matrix
          path: five-page-missing-constructor-matrix
          retention-days: 30
          if-no-files-found: warn

      - name: Publish five-page matrix status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/FIVE_PAGE_MISSING_CONSTRUCTOR_MATRIX_STATUS.json docs/FIVE_PAGE_MISSING_CONSTRUCTOR_MATRIX_STATUS.json
          git add docs/FIVE_PAGE_MISSING_CONSTRUCTOR_MATRIX_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record five-page missing-constructor bridge matrix"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce five-page matrix gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/FIVE_PAGE_MISSING_CONSTRUCTOR_MATRIX_STATUS.json >/dev/null
