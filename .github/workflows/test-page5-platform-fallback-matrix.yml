name: Probe page five menu callback contract via established runner

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/prepare_page5_menu_callback_contract_probe.py
      - scripts/prepare_page5_menu_callback_contract_probe_v2.py
      - scripts/page5_menu_callback_contract_probe.trigger
      - .github/workflows/test-page5-platform-fallback-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-menu-callback-contract-probe-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: page5-menu-callback-contract-probe
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js
      GENERATED_PROBE: scripts/run_page5_menu_callback_contract_probe.generated.mjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare isolated callback contract probe
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CURRENT_FIRST_PATH"
          test -s "$CURRENT_SECOND_PATH"
          python3 -m py_compile scripts/prepare_page5_menu_callback_contract_probe.py scripts/prepare_page5_menu_callback_contract_probe_v2.py
          python3 scripts/prepare_page5_menu_callback_contract_probe_v2.py --output "$GENERATED_PROBE"
          node --check "$GENERATED_PROBE"
          grep -Fq 'page5-menu-callback-contract-probe' "$GENERATED_PROBE"
          grep -Fq '__gamsPage5MenuContractHistory' "$GENERATED_PROBE"
          grep -Fq 'candidatePage5MenuContractHistoryLength > 0' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute current and callback-contract candidate
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/page5-menu-callback-contract-probe.log

      - name: Build callback contract status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-menu-callback-contract-probe.log && cp /tmp/page5-menu-callback-contract-probe.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output_dir = Path(os.environ['OUTPUT_DIR'])
          report_path = output_dir / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          summary = report.get('summary', {}) if report else {}
          contract = summary.get('candidatePage5MenuContract') if summary else None
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-menu-callback-contract-probe',
              'summary': summary,
              'contractCaptured': bool(contract),
              'secondArgumentAvailable': bool(contract and contract.get('second', {}).get('available')),
              'secondArgumentOwnKeys': contract.get('second', {}).get('ownKeys', []) if contract else [],
              'secondArgumentPrototypeKeys': contract.get('second', {}).get('prototypeKeys', []) if contract else [],
              'secondArgumentBooleanFields': contract.get('second', {}).get('booleanFields', {}) if contract else {},
              'candidatePatch': report.get('candidatePatch') if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'page5-menu-callback-contract-probe',
              'readOnlyContractProbe': True,
              'candidatePersisted': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_MENU_CALLBACK_CONTRACT_PROBE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-menu-callback-contract-probe
          path: page5-menu-callback-contract-probe
          retention-days: 30
          if-no-files-found: warn

      - name: Publish callback contract status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_MENU_CALLBACK_CONTRACT_PROBE_STATUS.json docs/PAGE5_MENU_CALLBACK_CONTRACT_PROBE_STATUS.json
          git add docs/PAGE5_MENU_CALLBACK_CONTRACT_PROBE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five menu callback contract"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce callback contract capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_MENU_CALLBACK_CONTRACT_PROBE_STATUS.json >/dev/null
