name: Probe page five cover mouse-up callback

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_menu_callback_scope_probe.mjs
      - scripts/prepare_page5_cover_mouseup_callback_probe.py
      - scripts/page5_cover_mouseup_callback_probe.trigger
      - .github/workflows/test-page5-platform-fallback-matrix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-cover-mouseup-callback-probe-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUTPUT_DIR: page5-cover-mouseup-callback-probe
      GENERATED_PROBE: scripts/run_page5_cover_mouseup_callback_probe.generated.mjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare cover mouse-up callback probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/prepare_page5_cover_mouseup_callback_probe.py
          python3 scripts/prepare_page5_cover_mouseup_callback_probe.py --output "$GENERATED_PROBE"
          node --check "$GENERATED_PROBE"
          grep -Fq 'page5-cover-mouseup-callback-scope-read-only-probe' "$GENERATED_PROBE"
          grep -Fq "eventListenerMap['mouse up'][0].listener" "$GENERATED_PROBE"
          grep -Fq 'after-title-reveal' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute cover mouse-up callback probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/page5-cover-mouseup-callback-probe.log

      - name: Build cover mouse-up callback status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-cover-mouseup-callback-probe.log && cp /tmp/page5-cover-mouseup-callback-probe.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          callback = report.get('callback', {}) if report else {}
          structure = callback.get('structure', {}) if callback else {}
          internal_names = [item.get('name') for item in structure.get('internalProperties', []) if item.get('name')]
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-cover-mouseup-callback-scope-read-only-probe',
              'pauseCaptured': report.get('pauseCaptured') if report else None,
              'selectedNodeIndex': report.get('selectedNodeIndex') if report else None,
              'callbackSourceLength': callback.get('sourceLength') if callback else None,
              'callbackSourceSha256': callback.get('sourceSha256') if callback else None,
              'callbackInternalPropertyNames': internal_names,
              'callbackRemote': callback.get('remote') if callback else None,
              'coverScreenshotChanged': report.get('coverScreenshotChanged') if report else None,
              'mainFrameValid': report.get('mainFrameValid') if report else None,
              'pageErrorCount': len(report.get('pageErrors', [])) if report else None,
              'blockedOrderCount': len(report.get('blockedOrders', [])) if report else None,
              'debuggerErrorCount': len(report.get('debuggerErrors', [])) if report else None,
              'preStepCssPoints': report.get('preStepCssPoints') if report else None,
              'probeCssPoint': report.get('probeCssPoint') if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'page5-cover-mouseup-callback-probe',
              'readOnlyProbe': True,
              'pageScriptModified': False,
              'candidateTested': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_COVER_MOUSEUP_CALLBACK_PROBE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-cover-mouseup-callback-probe
          path: page5-cover-mouseup-callback-probe
          retention-days: 30
          if-no-files-found: warn

      - name: Publish cover mouse-up callback status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_COVER_MOUSEUP_CALLBACK_PROBE_STATUS.json docs/PAGE5_COVER_MOUSEUP_CALLBACK_PROBE_STATUS.json
          git add docs/PAGE5_COVER_MOUSEUP_CALLBACK_PROBE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five cover mouse-up callback"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce cover mouse-up callback capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_COVER_MOUSEUP_CALLBACK_PROBE_STATUS.json >/dev/null
