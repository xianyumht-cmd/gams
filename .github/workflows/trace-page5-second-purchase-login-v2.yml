name: Trace second purchase login initiator safely v2

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - .github/workflows/trace-page5-second-purchase-login-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-second-purchase-login-trace-v2-20260806
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      IMPLEMENTATION_REF: fix/page5-missing-constructor-mobile-bridge-20260806
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: /tmp/persisted-game-1.0.5.js
      CURRENT_RUNTIME_SHA256: 57765fbb8d9a0529ed1463623f1bed9c05052e76396a6aaa89fdd2ecc673bc72
      GENERATED_TRACE: scripts/run_page5_second_purchase_login_trace_v2.generated.mjs
      OUTPUT_DIR: page5-second-purchase-login-trace-v2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read current isolated implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$IMPLEMENTATION_REF:refs/remotes/origin/$IMPLEMENTATION_REF"
          git show "origin/$IMPLEMENTATION_REF:game-engine/release/game-1.0.5.js" > "$CURRENT_SECOND_PATH"
          git show "origin/$IMPLEMENTATION_REF:scripts/prepare_persisted_repeat_reentry_matrix.py" > scripts/prepare_persisted_repeat_reentry_matrix.py
          test "$(sha256sum "$CURRENT_SECOND_PATH" | awk '{print $1}')" = "$CURRENT_RUNTIME_SHA256"

      - name: Prepare initiator trace
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/prepare_five_page_missing_constructor_matrix.py \
            scripts/prepare_page5_repeat_reentry_matrix.py \
            scripts/prepare_persisted_repeat_reentry_matrix.py \
            scripts/prepare_page5_purchase_action_probe.py \
            scripts/prepare_page5_purchase_action_probe_guard.py \
            scripts/prepare_page5_repeat_purchase_action_probe.py \
            scripts/prepare_page5_second_purchase_login_trace.py
          python3 scripts/prepare_page5_second_purchase_login_trace.py --output "$GENERATED_TRACE"
          node --check "$GENERATED_TRACE"
          grep -Fq 'persisted-runtime-page5-second-purchase-login-initiator-trace' "$GENERATED_TRACE"
          grep -Fq 'Network.requestWillBeSent' "$GENERATED_TRACE"
          grep -Fq 'loginInitiators' "$GENERATED_TRACE"
          grep -Fq "$CURRENT_RUNTIME_SHA256" "$GENERATED_TRACE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute trace
        id: trace_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          OUTPUT_DIR="$OUTPUT_DIR" node "$GENERATED_TRACE" 2>&1 | tee /tmp/page5-second-purchase-login-trace-v2.log

      - name: Build status
        if: always()
        shell: bash
        env:
          TRACE_OUTCOME: ${{ steps.trace_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-second-purchase-login-trace-v2.log && cp /tmp/page5-second-purchase-login-trace-v2.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json, os
          from collections import Counter
          from datetime import datetime, timezone
          from pathlib import Path
          p = Path(os.environ['OUTPUT_DIR']) / 'report.json'
          report = json.loads(p.read_text(encoding='utf-8')) if p.exists() else None
          cases = (report or {}).get('cases') or []
          case = cases[0] if cases else {}
          trace = case.get('loginInitiators') or []
          frames = [f for item in trace for f in (item.get('frames') or [])]
          counts = Counter(str(f.get('sourceClass') or 'missing') for f in frames)
          attempts = ((case.get('purchaseProbe') or {}).get('attempts') or [])
          second = next((x for x in attempts if x.get('label') == 'second'), None)
          blocked_nav = case.get('blockedExternalNavigations') or []
          errors = case.get('pageErrors') or []
          orders = case.get('blockedOrders') or []
          redirect = bool(second) and (str(second.get('url') or '').startswith('chrome-error://') or bool(blocked_nav))
          ok = bool(report) and bool(trace) and redirect and not errors and not orders
          if counts.get('runtime-second', 0): source = 'runtime-second-frame-observed'
          elif counts.get('official-page-runtime', 0) or counts.get('official-render-library', 0): source = 'official-page-frame-observed'
          elif frames: source = 'other-script-frame-observed'
          else: source = 'no-script-frame-browser-or-form-navigation'
          status = {
            'schemaVersion': 2,
            'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'runId': int(os.environ['GITHUB_RUN_ID']),
            'state': 'completed',
            'workflowOutcome': os.environ.get('TRACE_OUTCOME','unknown'),
            'ok': ok,
            'mode': 'page5-second-purchase-login-initiator-trace-v2',
            'implementationRef': os.environ['IMPLEMENTATION_REF'],
            'runtimeSha256': os.environ['CURRENT_RUNTIME_SHA256'],
            'secondRedirectObserved': redirect,
            'loginInitiatorCount': len(trace),
            'initiatorTypes': dict(Counter(str(x.get('initiatorType') or 'missing') for x in trace)),
            'frameSourceCounts': dict(counts),
            'sourceAssessment': source,
            'trace': trace,
            'pageErrorCount': len(errors),
            'blockedOrderCount': len(orders),
            'blockedExternalNavigationCount': len(blocked_nav),
            'realOrderRequestsAllowed': False,
            'paymentCompleted': False,
            'authorizationOutcomeModified': False,
            'productionDefaultChanged': False,
            'androidClientChanged': False,
            'apkBuilt': False,
            'branch': os.environ.get('GITHUB_REF_NAME',''),
            'commit': os.environ.get('GITHUB_SHA',''),
          }
          Path('/tmp/PAGE5_SECOND_PURCHASE_LOGIN_TRACE_V2_STATUS.json').write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-second-purchase-login-trace-v2
          path: |
            page5-second-purchase-login-trace-v2
            /tmp/PAGE5_SECOND_PURCHASE_LOGIN_TRACE_V2_STATUS.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/prepare_persisted_repeat_reentry_matrix.py "$GENERATED_TRACE"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          mkdir -p docs
          cp /tmp/PAGE5_SECOND_PURCHASE_LOGIN_TRACE_V2_STATUS.json docs/PAGE5_SECOND_PURCHASE_LOGIN_TRACE_V2_STATUS.json
          git add docs/PAGE5_SECOND_PURCHASE_LOGIN_TRACE_V2_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record second purchase login initiator trace v2"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce evidence gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_SECOND_PURCHASE_LOGIN_TRACE_V2_STATUS.json >/dev/null
