name: Build premium UI candidate APK

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-premium-ui-candidate.yml
      - v2/android/client/src/main/AndroidManifest.xml
      - v2/android/client/src/main/java/com/jinli/ggsecure/PremiumApplication.java
      - scripts/build_premium_ui_candidate.trigger

permissions:
  contents: write

concurrency:
  group: premium-ui-candidate-v1
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.ref == 'fix/page5-missing-constructor-mobile-bridge-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build sign and verify premium UI APK
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's/APK_VERSION_NAME="2.0.14-page5-bridge"/APK_VERSION_NAME="2.0.15-premium-ui"/g' \
            -e 's/APK_VERSION_CODE="25"/APK_VERSION_CODE="26"/g' \
            -e 's/versionCode = 25/versionCode = 26/g' \
            -e 's/2.0.14-page5-bridge/2.0.15-premium-ui/g' \
            scripts/build_safe_js_compat_candidate.sh
          sed -i '/^ARTIFACT_DIR=/a export RUNTIME_DIR RUNTIME_VERSION SECOND_SIZE SECOND_SHA256 RUNTIME_MASTER_KEY FIRST_FILE SECOND_FILE' scripts/build_safe_js_compat_candidate.sh
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build_safe_js_compat_candidate.sh')
          text = path.read_text(encoding='utf-8')
          old_keytool = 'grep -Fq "SHA256: $CERT_SHA256" /tmp/safe-compat-keytool.txt'
          if old_keytool not in text:
              old_keytool = 'grep -Fq "$CERT_SHA256" /tmp/safe-compat-keytool.txt'
          if old_keytool not in text:
              raise SystemExit('certificate precheck anchor not found')
          text = text.replace(old_keytool, ': # certificate digest is verified after APK signing', 1)

          anchor = '"$apksigner" verify --verbose --print-certs "$SIGNED" > /tmp/safe-compat-apk-verify.txt\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'apksigner verification anchor mismatch: {text.count(anchor)}')
          verification = anchor + '''EXPECTED_CERT="$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_CERT="$(grep -i 'certificate SHA-256 digest:' /tmp/safe-compat-apk-verify.txt | head -n1 | awk -F': ' '{print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test -n "$ACTUAL_CERT"
          test "$ACTUAL_CERT" = "$EXPECTED_CERT"
          '''
          text = text.replace(anchor, verification, 1)
          path.write_text(text, encoding='utf-8')
          PY
          chmod +x scripts/build_safe_js_compat_candidate.sh
          scripts/build_safe_js_compat_candidate.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.15-premium-ui-code26
          path: /tmp/safe-compat-artifact/**
          retention-days: 30
          if-no-files-found: error
