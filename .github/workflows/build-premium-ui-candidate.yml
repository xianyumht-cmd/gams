name: Build premium UI candidate APK

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-premium-ui-candidate.yml
      - v2/android/client/src/main/AndroidManifest.xml
      - v2/android/client/src/main/java/com/jinli/ggsecure/PremiumApplication.java
      - scripts/build_premium_ui_candidate.trigger

permissions:
  contents: write

concurrency:
  group: premium-ui-candidate-v1
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.ref == 'fix/page5-missing-constructor-mobile-bridge-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build sign and verify premium UI APK
        shell: bash
        run: |
          set -euo pipefail
          sed -i \
            -e 's/APK_VERSION_NAME="2.0.14-page5-bridge"/APK_VERSION_NAME="2.0.15-premium-ui"/g' \
            -e 's/APK_VERSION_CODE="25"/APK_VERSION_CODE="26"/g' \
            -e 's/versionCode = 25/versionCode = 26/g' \
            -e 's/2.0.14-page5-bridge/2.0.15-premium-ui/g' \
            scripts/build_safe_js_compat_candidate.sh
          sed -i '/^ARTIFACT_DIR=/a export RUNTIME_DIR RUNTIME_VERSION SECOND_SIZE SECOND_SHA256 RUNTIME_MASTER_KEY FIRST_FILE SECOND_FILE' scripts/build_safe_js_compat_candidate.sh
          chmod +x scripts/build_safe_js_compat_candidate.sh
          scripts/build_safe_js_compat_candidate.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.15-premium-ui-code26
          path: /tmp/safe-compat-artifact/**
          retention-days: 30
          if-no-files-found: error
