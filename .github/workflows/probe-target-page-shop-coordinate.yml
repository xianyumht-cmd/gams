name: Probe target page purchase entry coordinate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/probe-target-page-shop-coordinate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: target-page-shop-coordinate-probe-20260804
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTPUT_DIR: target-page-shop-coordinate-probe
      HISTORICAL_FIRST_PATH: /tmp/noname-1.1.1.js
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      HISTORICAL_SECOND_PATH: game-engine/release/game-1.0.2.js
      HISTORICAL_FIRST_COMMIT: 29bf86c0e2cf87e0f1b1dfac9456bba0b27cf61c
      HISTORICAL_SECOND_SIZE: 11589175
      HISTORICAL_SECOND_SHA256: 51ae52887d0c0475870e4c985edf747a14672f0908221779826934f37b73db43
      TARGET_URL: https://m.66rpg.com/h5/1682748?ohp=v3&quality=32
      TAP_X: 173
      TAP_Y: 509
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare exact inputs and extended load wait
        shell: bash
        run: |
          set -euo pipefail
          git show "${HISTORICAL_FIRST_COMMIT}:remote-script/src/noname.js" > "$HISTORICAL_FIRST_PATH"
          test -s "$HISTORICAL_FIRST_PATH"
          test -s "$CURRENT_FIRST_PATH"
          test "$(stat -c%s "$HISTORICAL_SECOND_PATH")" = "$HISTORICAL_SECOND_SIZE"
          test "$(sha256sum "$HISTORICAL_SECOND_PATH" | awk '{print $1}')" = "$HISTORICAL_SECOND_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/run_target_page_coordinate_probe.mjs')
          text = path.read_text(encoding='utf-8')
          old = 'await page.waitForTimeout(18000);'
          new = 'await page.waitForTimeout(28000);'
          if text.count(old) != 1:
              raise SystemExit('load wait marker mismatch')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          node --check scripts/run_target_page_coordinate_probe.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute purchase entry probe
        id: probe
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_target_page_coordinate_probe.mjs 2>&1 | tee /tmp/shop-coordinate-probe.log

      - name: Build status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/shop-coordinate-probe.log && cp /tmp/shop-coordinate-probe.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          report_path = Path(os.environ["OUTPUT_DIR"]) / "report.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else None
          cases = report.get("cases", []) if report else []
          status = {
              "schemaVersion": 1,
              "generatedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "state": "completed",
              "workflowOutcome": os.environ.get("PROBE_OUTCOME", "unknown"),
              "ok": bool(report) and os.environ.get("PROBE_OUTCOME") == "success",
              "mode": "chromium-webview-equivalent-purchase-entry-probe",
              "apkExecuted": False,
              "paymentCompleted": False,
              "targetUrl": os.environ["TARGET_URL"],
              "tap": {"x": int(os.environ["TAP_X"]), "y": int(os.environ["TAP_Y"])},
              "cases": [{"pair": item.get("pair"), "fatal": bool(item.get("fatalError"))} for item in cases],
              "reportAvailable": bool(report),
              "artifactName": "target-page-shop-coordinate-probe",
          }
          Path("/tmp/TARGET_PAGE_SHOP_COORDINATE_PROBE_STATUS.json").write_text(json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: target-page-shop-coordinate-probe
          path: target-page-shop-coordinate-probe
          retention-days: 30
          if-no-files-found: warn

      - name: Publish status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          rm -rf /tmp/shop-coordinate-status
          git worktree add -B shop-coordinate-status /tmp/shop-coordinate-status origin/main
          cd /tmp/shop-coordinate-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/TARGET_PAGE_SHOP_COORDINATE_PROBE_STATUS.json docs/TARGET_PAGE_SHOP_COORDINATE_PROBE_STATUS.json
          git add docs/TARGET_PAGE_SHOP_COORDINATE_PROBE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record target page purchase entry probe"
            git push origin HEAD:main
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/shop-coordinate-status
