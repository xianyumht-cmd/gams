name: GG Local JS Test APK

on:
  push:
    branches:
      - feat/gg-local-js-test-20261110
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gg-local-js-test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/feat/gg-local-js-test-20261110'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify HTML integrity compatibility with the page inline check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/local-html-test"
          javac -d "$RUNNER_TEMP/local-html-test" \
            v2/android/client/src/main/java/com/jinli/ggsecure/LocalHtmlRewriter.java \
            scripts/LocalHtmlRewriterSmoke.java
          java -cp "$RUNNER_TEMP/local-html-test" com.jinli.ggsecure.LocalHtmlRewriterSmoke

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and verify three independently installable APKs
        shell: bash
        run: |
          set -euo pipefail
          dest='v2/android/client/src/localTest/assets'
          mkdir -p "$dest" dist
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt | sort -V | tail -n1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner | sort -V | tail -n1)"
          test -x "$aapt" && test -x "$apksigner"
          for pair in "1.1.4:1.0.5" "1.1.3:1.0.5" "1.1.2:1.0.4"; do
            IFS=: read -r noname game <<< "$pair"
            cp "remote-script/release/noname-${noname}.js" "$dest/noname.js"
            cp "game-engine/release/game-${game}.js" "$dest/game.js"
            python3 scripts/test_local_js_variant.py "$noname" "$game"
            node --check "$dest/noname.js"
            node --check "$dest/game.js"
            ( cd v2/android && gradle --no-daemon :client:lintLocalTest :client:assembleLocalTest "-PggLocalNonameVersion=$noname" --stacktrace )
            apk='v2/android/client/build/outputs/apk/localTest/client-localTest.apk'
            test -s "$apk"
            package="com.jinli.quickweb.localtest${noname//./}"
            "$aapt" dump badging "$apk" | grep -Fq "package: name='$package' versionCode='16' versionName='2.0.3-stable-local-$noname'"
            "$aapt" dump badging "$apk" | grep -Fq "application-label:'GG测试$noname'"
            "$apksigner" verify --min-sdk-version 24 "$apk"
            test "$(unzip -p "$apk" assets/noname.js | sha256sum | cut -d' ' -f1)" = \
              "$(sha256sum "remote-script/release/noname-${noname}.js" | cut -d' ' -f1)"
            test "$(unzip -p "$apk" assets/game.js | sha256sum | cut -d' ' -f1)" = \
              "$(sha256sum "game-engine/release/game-${game}.js" | cut -d' ' -f1)"
            cp "$apk" "dist/GG-local-noname-${noname}-game-${game}.apk"
          done
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GG-local-three-compatibility-apks
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish isolated pre-release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="gg-local-js-test-${GITHUB_SHA:0:7}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/*.apk dist/SHA256SUMS.txt \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" \
              dist/*.apk \
              dist/SHA256SUMS.txt \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "GG 三版本本地 JS 对比测试 (${GITHUB_SHA:0:7})" \
              --notes '同一仓库原生注入框架生成三个独立包名 APK：noname 1.1.4 + game 1.0.5；noname 1.1.3 + game 1.0.5；noname 1.1.2 + game 1.0.4。三个 APK 免 GG 激活码及在线授权校验，可同时安装。游戏网页自身仍需网络。本版本仅用于测试，正式版不受影响。' \
              --prerelease \
              --latest=false
          fi
