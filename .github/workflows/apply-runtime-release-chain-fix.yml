name: Apply runtime release chain repair

on:
  push:
    branches:
      - codex/fix-all-audited-bugs-20260801
    paths:
      - .github/workflows/apply-runtime-release-chain-fix.yml

permissions:
  contents: write

concurrency:
  group: apply-runtime-release-chain-repair
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-all-audited-bugs-20260801
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply source repairs
        run: python3 scripts/apply_runtime_release_chain_fix_20260801.py

      - name: Run reproducible key migration tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          python3 -m py_compile v2/runtime/tools/build_release.py
          node --check v2/runtime/src/index.js
          node --check v2/runtime/src/runtime-key.js
          node --check tests/runtime-key-compat.test.mjs
          node --check tests/source-security.test.mjs
          node tests/runtime-key-compat.test.mjs

      - name: Commit verified non-workflow source repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/apply_runtime_release_chain_fix_20260801.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo 'Permanent workflow files must be updated through the GitHub connector'
            exit 1
          fi
          git commit -m 'fix: repair runtime key migration source chain'
          git push origin HEAD:codex/fix-all-audited-bugs-20260801
