name: Build isolated safe JS compatibility candidate

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/build-safe-js-compat-candidate.yml
      - scripts/build_safe_js_compat_candidate.sh
      - scripts/build_safe_js_compat_candidate.trigger

permissions:
  contents: write

concurrency:
  group: safe-js-compat-candidate-c2
  cancel-in-progress: false

jobs:
  build:
    if: github.event.pull_request.head.ref == 'fix/page5-missing-constructor-mobile-bridge-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and verify isolated candidate
        shell: bash
        run: |
          sed -i '/^ARTIFACT_DIR=/a export RUNTIME_DIR RUNTIME_VERSION SECOND_SIZE SECOND_SHA256 RUNTIME_MASTER_KEY FIRST_FILE SECOND_FILE' scripts/build_safe_js_compat_candidate.sh
          chmod +x scripts/build_safe_js_compat_candidate.sh
          scripts/build_safe_js_compat_candidate.sh

      - uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.14-page5-bridge-code25
          path: /tmp/safe-compat-artifact/**
          retention-days: 30
          if-no-files-found: error
