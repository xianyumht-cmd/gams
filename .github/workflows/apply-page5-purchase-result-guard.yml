name: Apply page five purchase result guard

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/apply_page5_purchase_result_guard.py
      - scripts/apply_page5_purchase_result_guard.trigger
      - .github/workflows/apply-page5-purchase-result-guard.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-page5-purchase-result-guard-20260806
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMPLEMENTATION_REF: fix/page5-missing-constructor-mobile-bridge-20260806
      WORKTREE: /tmp/gams-page5-purchase-result-guard
      NEW_RUNTIME_SHA256: 57765fbb8d9a0529ed1463623f1bed9c05052e76396a6aaa89fdd2ecc673bc72

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify or apply guarded runtime change
        id: apply_guard
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_page5_purchase_result_guard.py
          git fetch origin "$IMPLEMENTATION_REF:refs/remotes/origin/$IMPLEMENTATION_REF"
          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" "origin/$IMPLEMENTATION_REF"
          python3 scripts/apply_page5_purchase_result_guard.py \
            --runtime "$WORKTREE/game-engine/release/game-1.0.5.js" \
            --five-helper "$WORKTREE/scripts/prepare_persisted_five_page_matrix.py" \
            --repeat-helper "$WORKTREE/scripts/prepare_persisted_repeat_reentry_matrix.py" \
            --metadata /tmp/page5-purchase-result-guard-apply.json
          test "$(sha256sum "$WORKTREE/game-engine/release/game-1.0.5.js" | awk '{print $1}')" = "$NEW_RUNTIME_SHA256"
          node --check "$WORKTREE/game-engine/release/game-1.0.5.js"
          python3 -m py_compile \
            "$WORKTREE/scripts/prepare_persisted_five_page_matrix.py" \
            "$WORKTREE/scripts/prepare_persisted_repeat_reentry_matrix.py"
          grep -Fq "$NEW_RUNTIME_SHA256" "$WORKTREE/scripts/prepare_persisted_five_page_matrix.py"
          grep -Fq "$NEW_RUNTIME_SHA256" "$WORKTREE/scripts/prepare_persisted_repeat_reentry_matrix.py"

          cd "$WORKTREE"
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          printf '%s\n' "${changed[@]}" | sed '/^$/d' > /tmp/page5-purchase-result-guard-files.txt
          already_applied="$(jq -r '.alreadyApplied' /tmp/page5-purchase-result-guard-apply.json)"
          if [[ "$already_applied" == "true" ]]; then
            test "${#changed[@]}" -eq 0
            implementation_commit="$(git rev-parse HEAD)"
          else
            expected=(
              game-engine/release/game-1.0.5.js
              scripts/prepare_persisted_five_page_matrix.py
              scripts/prepare_persisted_repeat_reentry_matrix.py
            )
            mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
            test "${changed[*]}" = "${expected_sorted[*]}"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "${expected[@]}"
            git commit -m "Guard missing purchase result state"
            implementation_commit="$(git rev-parse HEAD)"
            git push origin "HEAD:$IMPLEMENTATION_REF"
          fi
          printf '%s\n' "$implementation_commit" > /tmp/page5-purchase-result-guard-commit.txt

      - name: Build apply status
        if: always()
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply_guard.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          metadata_path = Path('/tmp/page5-purchase-result-guard-apply.json')
          metadata = json.loads(metadata_path.read_text(encoding='utf-8')) if metadata_path.exists() else None
          commit_path = Path('/tmp/page5-purchase-result-guard-commit.txt')
          implementation_commit = commit_path.read_text(encoding='utf-8').strip() if commit_path.exists() else None
          files_path = Path('/tmp/page5-purchase-result-guard-files.txt')
          changed_files = files_path.read_text(encoding='utf-8').splitlines() if files_path.exists() else []
          expected_sha = os.environ['NEW_RUNTIME_SHA256']
          ok = (
              os.environ.get('APPLY_OUTCOME') == 'success'
              and bool(metadata)
              and metadata.get('newSha256') == expected_sha
              and metadata.get('guardCount') == 1
              and bool(implementation_commit)
          )
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('APPLY_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'persist-page5-purchase-result-state-guard',
              'implementationRef': os.environ['IMPLEMENTATION_REF'],
              'implementationCommit': implementation_commit,
              'changedFiles': changed_files,
              'metadata': metadata,
              'productionDefaultChanged': False,
              'androidClientChanged': False,
              'apkBuilt': False,
              'realOrderRequestsAllowed': False,
              'paymentCompleted': False,
              'authorizationOutcomeModified': False,
              'diagnosticBranch': os.environ.get('GITHUB_REF_NAME', ''),
              'diagnosticCommit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_PURCHASE_RESULT_GUARD_APPLY_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-purchase-result-guard-apply
          path: |
            /tmp/PAGE5_PURCHASE_RESULT_GUARD_APPLY_STATUS.json
            /tmp/page5-purchase-result-guard-apply.json
            /tmp/page5-purchase-result-guard-files.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Publish apply status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_PURCHASE_RESULT_GUARD_APPLY_STATUS.json docs/PAGE5_PURCHASE_RESULT_GUARD_APPLY_STATUS.json
          git add docs/PAGE5_PURCHASE_RESULT_GUARD_APPLY_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record purchase result guard persistence"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce apply gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_PURCHASE_RESULT_GUARD_APPLY_STATUS.json >/dev/null
