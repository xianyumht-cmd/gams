name: Build signed V2 JSONP probe overlay

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "v2_diagnostics_patch/**"
      - ".github/workflows/build-v2-jsonp-probe-overlay.yml"

jobs:
  build-v2-jsonp-probe-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate signing inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GG_RELEASE_KEYSTORE_BASE64:-}"
          test -n "${GG_RELEASE_KEYSTORE_PASSWORD:-}"

      - name: Apply V2 diagnostics and JSONP probe
        shell: bash
        run: |
          set -euo pipefail
          python3 v2_diagnostics_patch/apply.py
          python3 v2_diagnostics_patch/apply_jsonp_probe.py
          node --check v2/android/client/src/main/assets/diagnostic-prelude.js
          node --check v2/android/client/src/main/assets/diagnostic-postlude.js

      - name: Verify observation-only guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 27' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.16-page5-jsonp-probe"' v2/android/client/build.gradle.kts
          grep -Fq 'PROTOCOL_APP_VERSION = 25' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          grep -Fq 'android:label="GG JSONP定位版"' v2/android/client/src/main/AndroidManifest.xml
          grep -Fq 'order_jsonp_probe_installed' v2/android/client/src/main/assets/diagnostic-postlude.js
          grep -Fq 'order_jsonp_src' v2/android/client/src/main/assets/diagnostic-postlude.js
          grep -Fq 'order_callback_state' v2/android/client/src/main/assets/diagnostic-postlude.js
          grep -Fq 'return descriptor.set.call(this, value)' v2/android/client/src/main/assets/diagnostic-postlude.js
          grep -Fq 'return existingSetAttribute.apply(this, arguments)' v2/android/client/src/main/assets/diagnostic-postlude.js
          if grep -Fq 'order_jsonp_virtualized' v2/android/client/src/main/assets/diagnostic-postlude.js; then exit 1; fi
          if grep -Fq 'requestBody' v2/android/client/src/main/assets/diagnostic-postlude.js; then exit 1; fi
          if grep -Fq 'responseBody' v2/android/client/src/main/assets/diagnostic-postlude.js; then exit 1; fi
          test ! -e v2/android/client/src/main/assets/noname.js
          test ! -e v2/android/client/src/main/assets/game.js

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon -p v2/android :client:clean :client:lintRelease :client:assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-v2-jsonp-probe.log

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$unsigned" && test -s "$unsigned"
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/gg-release.jks
          test -s /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks \
            -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool-v2-jsonp-probe.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool-v2-jsonp-probe.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"

          mkdir -p dist-jsonp-probe
          signed="dist-jsonp-probe/GG-2.0.16-page5-JSONP定位覆盖版-code27.apk"
          "$apksigner" sign \
            --ks /tmp/gg-release.jks \
            --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$signed" "$unsigned"

          "$apksigner" verify --verbose --print-certs "$signed" > /tmp/apksigner-v2-jsonp-probe.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner-v2-jsonp-probe.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner-v2-jsonp-probe.txt
          expected_digest="$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual_digest="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ {print tolower($2); exit}' /tmp/apksigner-v2-jsonp-probe.txt | tr -d '[:space:]')"
          test "$actual_digest" = "$expected_digest"

          "$aapt" dump badging "$signed" > /tmp/aapt-v2-jsonp-probe.txt
          grep -Fq "package: name='com.jinli.quickweb' versionCode='27' versionName='2.0.16-page5-jsonp-probe'" /tmp/aapt-v2-jsonp-probe.txt
          sha256sum "$signed" > dist-jsonp-probe/SHA256SUMS.txt
          cat > dist-jsonp-probe/使用说明.txt <<'TXT'
          此包是 observation-only JSONP 定位覆盖版：
          - package: com.jinli.quickweb
          - versionCode: 27
          - runtime protocol: 25（保持 page5 bridge c2 通道）
          - 使用正式 gg-release 证书签名，可直接覆盖 code26
          - 只记录动态订单脚本、回调状态和页面跳转时序，不修改请求、响应或购买结果

          不要卸载原应用。覆盖安装后，在同一商品上完整重复操作至少两次，然后点击顶部“日志”→“导出并发送”。
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.16-page5-JSONP-probe-overlay-code27
          path: dist-jsonp-probe/*
          retention-days: 14
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GG-V2-JSONP-probe-build-logs
          path: |
            /tmp/gradle-v2-jsonp-probe.log
            /tmp/keytool-v2-jsonp-probe.txt
            /tmp/apksigner-v2-jsonp-probe.txt
            /tmp/aapt-v2-jsonp-probe.txt
          retention-days: 7
          if-no-files-found: warn
