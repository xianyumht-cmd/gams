name: Calibrate page five title progression

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_title_progression_calibration.mjs
      - .github/workflows/run-page5-title-progression-calibration.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-title-progression-calibration-20260805
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUTPUT_DIR: page5-title-progression-calibration

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate calibration script
        shell: bash
        run: |
          set -euo pipefail
          node --check scripts/run_page5_title_progression_calibration.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute page-only title progression probes
        id: calibration_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_page5_title_progression_calibration.mjs 2>&1 | tee /tmp/page5-title-progression-calibration.log

      - name: Build calibration status
        if: always()
        shell: bash
        env:
          CALIBRATION_OUTCOME: ${{ steps.calibration_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-title-progression-calibration.log && cp /tmp/page5-title-progression-calibration.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output_dir = Path(os.environ['OUTPUT_DIR'])
          report_path = output_dir / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('CALIBRATION_OUTCOME') == 'success'
          cases = report.get('cases', []) if report else []
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('CALIBRATION_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-title-progression-calibration-page-only',
              'summary': report.get('summary') if report else None,
              'caseSummary': [
                  {
                      'name': case.get('name'),
                      'point': case.get('point'),
                      'attempts': case.get('attempts'),
                      'uniqueScreenshotCount': case.get('uniqueScreenshotCount'),
                      'fatalError': bool(case.get('fatalError')),
                      'pageErrorCount': len(case.get('pageErrors', [])),
                  }
                  for case in cases
              ],
              'reportAvailable': bool(report),
              'artifactName': 'page5-title-progression-calibration',
              'pageOnlyCalibration': True,
              'candidateTested': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_TITLE_PROGRESSION_CALIBRATION_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-title-progression-calibration
          path: page5-title-progression-calibration
          retention-days: 30
          if-no-files-found: warn

      - name: Publish branch calibration status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_TITLE_PROGRESSION_CALIBRATION_STATUS.json docs/PAGE5_TITLE_PROGRESSION_CALIBRATION_STATUS.json
          git add docs/PAGE5_TITLE_PROGRESSION_CALIBRATION_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five title progression calibration"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce calibration capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_TITLE_PROGRESSION_CALIBRATION_STATUS.json >/dev/null
