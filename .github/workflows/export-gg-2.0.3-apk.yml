name: Export GG 2.0.3 APK

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/export-gg-2.0.3-apk.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SHA256: 4665123e4681dbc8b57dc06afa3b65dc8e7d674838339349b490492b668ae9c9
    steps:
      - uses: actions/checkout@v4

      - name: Download and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gg-apk
          gh release download gg-2.0.3 \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'GG-2.0.3-code12.apk' \
            --dir /tmp/gg-apk
          apk=/tmp/gg-apk/GG-2.0.3-code12.apk
          test -s "$apk"
          actual="$(sha256sum "$apk" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          stat -c '%s' "$apk" > /tmp/apk-size.txt

      - uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.3-code12-apk
          path: /tmp/gg-apk/GG-2.0.3-code12.apk
          retention-days: 30
          if-no-files-found: error

      - name: Record artifact run
        shell: bash
        run: |
          set -euo pipefail
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runId "$GITHUB_RUN_ID" \
            --arg artifactName 'GG-2.0.3-code12-apk' \
            --arg fileName 'GG-2.0.3-code12.apk' \
            --arg sha256 "$EXPECTED_SHA256" \
            --argjson size "$(cat /tmp/apk-size.txt)" \
            '{schemaVersion:1,generatedAt:$generatedAt,ok:true,runId:$runId,artifactName:$artifactName,fileName:$fileName,sha256:$sha256,size:$size,secretsExposed:false}' \
            > /tmp/export-status.json
          path='docs/APK_EXPORT_STATUS.json'
          content="$(base64 -w0 /tmp/export-status.json)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$current" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record GG 2.0.3 APK export' -f content="$content" \
              -f sha="$current" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record GG 2.0.3 APK export' -f content="$content" \
              -f branch=main >/dev/null
          fi
