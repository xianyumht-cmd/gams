name: Probe final purchase action safely v2

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/prepare_page5_purchase_action_probe.py
      - scripts/page5_purchase_action_probe_v2.trigger
      - .github/workflows/test-page5-purchase-action-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-safe-final-purchase-action-probe-v2-20260806
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      IMPLEMENTATION_REF: fix/page5-missing-constructor-mobile-bridge-20260806
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: /tmp/persisted-game-1.0.5.js
      GENERATED_PROBE: scripts/run_page5_purchase_action_probe_v2.generated.mjs
      OUTPUT_DIR: page5-purchase-action-probe-v2

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - name: Publish probe start
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'running',
              'commit': os.environ.get('GITHUB_SHA', ''),
              'realOrderRequestsAllowed': False,
              'paymentCompleted': False,
          }
          Path('/tmp/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          mkdir -p docs
          cp /tmp/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json docs/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json
          git add docs/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record final purchase probe start"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read persisted implementation files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$IMPLEMENTATION_REF:refs/remotes/origin/$IMPLEMENTATION_REF"
          git show "origin/$IMPLEMENTATION_REF:game-engine/release/game-1.0.5.js" > "$CURRENT_SECOND_PATH"
          git show "origin/$IMPLEMENTATION_REF:scripts/prepare_persisted_repeat_reentry_matrix.py" > scripts/prepare_persisted_repeat_reentry_matrix.py
          test -s "$CURRENT_SECOND_PATH"
          test "$(sha256sum "$CURRENT_SECOND_PATH" | awk '{print $1}')" = "9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca"

      - name: Prepare final purchase action probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/prepare_five_page_missing_constructor_matrix.py \
            scripts/prepare_page5_repeat_reentry_matrix.py \
            scripts/prepare_persisted_repeat_reentry_matrix.py \
            scripts/prepare_page5_purchase_action_probe.py
          python3 scripts/prepare_page5_purchase_action_probe.py --output "$GENERATED_PROBE"
          node --check "$GENERATED_PROBE"
          grep -Fq 'persisted-runtime-page5-safe-final-purchase-action-probe' "$GENERATED_PROBE"
          grep -Fq 'left-middle-purchase' "$GENERATED_PROBE"
          grep -Fq 'product-detail-final-buy' "$GENERATED_PROBE"
          grep -Fq 'blocked-order-mutation' "$GENERATED_PROBE"
          grep -Fq 'safeProbeCompleted' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute final purchase action probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/page5-purchase-action-probe-v2.log

      - name: Build final status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-purchase-action-probe-v2.log && cp /tmp/page5-purchase-action-probe-v2.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          report_path = Path(os.environ['OUTPUT_DIR']) / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          cases = (report or {}).get('cases') or []
          case = cases[0] if cases else {}
          probe = case.get('purchaseProbe') or {}
          attempts = probe.get('attempts') or []
          status = {
              'schemaVersion': 2,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': bool(report) and bool(report.get('safeProbeCompleted')) and os.environ.get('PROBE_OUTCOME') == 'success',
              'mode': (report or {}).get('mode'),
              'summary': (report or {}).get('summary') or {},
              'productDetailObserved': bool((report or {}).get('productDetailObserved')),
              'purchaseActionReached': bool((report or {}).get('purchaseActionReached')),
              'purchaseResultObserved': bool((report or {}).get('purchaseResultObserved')),
              'requiresCompatibilityReview': bool((report or {}).get('requiresCompatibilityReview')),
              'productDetail': probe.get('productDetail'),
              'attempt': attempts[0] if attempts else None,
              'pageErrors': case.get('pageErrors') or [],
              'dialogs': case.get('dialogs') or [],
              'blockedOrderCount': len(case.get('blockedOrders') or []),
              'requestFailures': case.get('requestFailures') or [],
              'persistedRuntimeSha256': '9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca',
              'realOrderRequestsAllowed': False,
              'paymentCompleted': False,
              'authorizationOutcomeModified': False,
              'productionDefaultChanged': False,
              'androidClientChanged': False,
              'apkBuilt': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json').write_text(json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-purchase-action-probe-v2
          path: |
            page5-purchase-action-probe-v2
            /tmp/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish final status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/prepare_persisted_repeat_reentry_matrix.py "$GENERATED_PROBE"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          mkdir -p docs
          cp /tmp/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json docs/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json
          git add docs/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record final purchase action probe v2"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce final probe gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_PURCHASE_ACTION_PROBE_V2_STATUS.json >/dev/null
