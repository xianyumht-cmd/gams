name: Test latest page compatibility candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-latest-page-compat-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-page-compat-candidate-20260804
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUTPUT_DIR: latest-page-compat-acceptance
      BASELINE_FIRST_PATH: /tmp/noname-1.1.4-baseline.js
      CANDIDATE_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js
      CURRENT_SECOND_SIZE: 11590534
      CURRENT_SECOND_SHA256: ba8103ab7ef8ee8327df6d1d73daba8aca3a4c90d2370e30ab93001fce289112
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare baseline and candidate
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          cp "$CANDIDATE_FIRST_PATH" "$BASELINE_FIRST_PATH"
          test -s "$BASELINE_FIRST_PATH"
          grep -Fq '@version      1.1.4' "$BASELINE_FIRST_PATH"
          test "$(stat -c%s "$CURRENT_SECOND_PATH")" = "$CURRENT_SECOND_SIZE"
          test "$(sha256sum "$CURRENT_SECOND_PATH" | awk '{print $1}')" = "$CURRENT_SECOND_SHA256"
          python3 -m py_compile scripts/apply_latest_page_compat_candidate.py
          python3 scripts/apply_latest_page_compat_candidate.py
          python3 scripts/apply_latest_page_compat_candidate.py
          node --check "$CANDIDATE_FIRST_PATH"
          grep -Fq '@version      1.1.5' "$CANDIDATE_FIRST_PATH"
          grep -Fq 'latest-page repeat compatibility v1' "$CANDIDATE_FIRST_PATH"
          node --check scripts/run_latest_page_compat_acceptance.mjs
          {
            echo "baseline_size=$(stat -c%s "$BASELINE_FIRST_PATH")"
            echo "baseline_sha=$(sha256sum "$BASELINE_FIRST_PATH" | awk '{print $1}')"
            echo "candidate_size=$(stat -c%s "$CANDIDATE_FIRST_PATH")"
            echo "candidate_sha=$(sha256sum "$CANDIDATE_FIRST_PATH" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Publish running marker
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          rm -rf /tmp/latest-page-status
          git worktree add -B latest-page-status /tmp/latest-page-status origin/main
          cd /tmp/latest-page-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          jq -n --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson runId "$GITHUB_RUN_ID" \
            '{schemaVersion:1,generatedAt:$generatedAt,runId:$runId,state:"running",ok:false,reportAvailable:false,apkBuilt:false,productionDefaultChanged:false}' \
            > docs/LATEST_PAGE_COMPAT_ACCEPTANCE_STATUS.json
          git add docs/LATEST_PAGE_COMPAT_ACCEPTANCE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record latest page compatibility test start"
            git push origin HEAD:main
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/latest-page-status

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute five URL repeat matrix
        id: browser_test
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_latest_page_compat_acceptance.mjs 2>&1 | tee /tmp/latest-page-compat.log

      - name: Build final status
        if: always()
        shell: bash
        env:
          TEST_OUTCOME: ${{ steps.browser_test.outcome }}
          BASELINE_SIZE: ${{ steps.prepare.outputs.baseline_size }}
          BASELINE_SHA: ${{ steps.prepare.outputs.baseline_sha }}
          CANDIDATE_SIZE: ${{ steps.prepare.outputs.candidate_size }}
          CANDIDATE_SHA: ${{ steps.prepare.outputs.candidate_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/latest-page-compat.log && cp /tmp/latest-page-compat.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          report_path = Path(os.environ["OUTPUT_DIR"]) / "report.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else None
          summary = report.get("summary") if report else None
          passed = bool(report) and bool(report.get("pass")) and os.environ.get("TEST_OUTCOME") == "success"
          status = {
              "schemaVersion": 1,
              "generatedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "state": "completed",
              "workflowOutcome": os.environ.get("TEST_OUTCOME", "unknown"),
              "ok": passed,
              "mode": "chromium-webview-equivalent-latest-page-compatibility",
              "versionPair": {
                  "baseline": {"firstVersion": "1.1.4", "firstSize": int(os.environ.get("BASELINE_SIZE") or 0), "firstSha256": os.environ.get("BASELINE_SHA", "")},
                  "candidate": {"firstVersion": "1.1.5", "firstSize": int(os.environ.get("CANDIDATE_SIZE") or 0), "firstSha256": os.environ.get("CANDIDATE_SHA", "")},
                  "secondVersion": "1.0.5",
                  "secondSize": int(os.environ["CURRENT_SECOND_SIZE"]),
                  "secondSha256": os.environ["CURRENT_SECOND_SHA256"],
              },
              "summary": summary,
              "reportAvailable": bool(report),
              "artifactName": "latest-page-compat-acceptance",
              "apkBuilt": False,
              "productionDefaultChanged": False,
          }
          Path("/tmp/LATEST_PAGE_COMPAT_ACCEPTANCE_STATUS.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-page-compat-acceptance
          path: latest-page-compat-acceptance
          retention-days: 30
          if-no-files-found: warn

      - name: Publish final status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          rm -rf /tmp/latest-page-status
          git worktree add -B latest-page-status /tmp/latest-page-status origin/main
          cd /tmp/latest-page-status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/LATEST_PAGE_COMPAT_ACCEPTANCE_STATUS.json docs/LATEST_PAGE_COMPAT_ACCEPTANCE_STATUS.json
          git add docs/LATEST_PAGE_COMPAT_ACCEPTANCE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record latest page compatibility test status"
            git push origin HEAD:main
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force /tmp/latest-page-status

      - name: Enforce acceptance
        if: always()
        shell: bash
        run: |
          jq -e '.ok == true' /tmp/LATEST_PAGE_COMPAT_ACCEPTANCE_STATUS.json >/dev/null
