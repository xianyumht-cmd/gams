name: Temporary fix client version 12

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/tmp-fix-client-version-12.yml"

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply client version 12
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p0 = Path('hardening_client_parts/OnlineLicenseManager.java/part00')
          t0 = p0.read_text(encoding='utf-8')
          old0 = 'private static final int APP_VERSION_CODE = 8;'
          new0 = 'private static final int APP_VERSION_CODE = 12;'
          if t0.count(old0) != 1:
              raise SystemExit('APP_VERSION_CODE source did not match expected value 8')
          p0.write_text(t0.replace(old0, new0), encoding='utf-8')

          p1 = Path('hardening_client_parts/OnlineLicenseManager.java/part01')
          t1 = p1.read_text(encoding='utf-8')
          old1 = '"GG/8 Android"'
          new1 = '"GG/12 Android"'
          if t1.count(old1) != 1:
              raise SystemExit('client user-agent source did not match expected value 8')
          p1.write_text(t1.replace(old1, new1), encoding='utf-8')

          assert 'APP_VERSION_CODE = 12;' in p0.read_text(encoding='utf-8')
          assert '"GG/12 Android"' in p1.read_text(encoding='utf-8')
          PY

      - name: Commit final source state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/tmp-fix-client-version-12.yml
          git add hardening_client_parts/OnlineLicenseManager.java/part00
          git add hardening_client_parts/OnlineLicenseManager.java/part01
          git commit -m "fix: align client app version with server version 12"
          git push origin HEAD:main

      - name: Start corrected APK build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 2
          gh workflow run build-apk.yml --ref main
