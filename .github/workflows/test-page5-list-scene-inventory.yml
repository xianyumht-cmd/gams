name: Inventory page five list scene nodes

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_guard_full_entry_matrix.mjs
      - scripts/prepare_five_page_missing_constructor_matrix.py
      - scripts/prepare_page5_list_scene_inventory.py
      - scripts/page5_list_scene_inventory.trigger
      - .github/workflows/test-page5-list-scene-inventory.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-list-scene-inventory-20260806
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUTPUT_DIR: page5-list-scene-inventory
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js
      GENERATED_PROBE: scripts/run_page5_list_scene_inventory.generated.mjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare list scene inventory
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CURRENT_FIRST_PATH"
          test -s "$CURRENT_SECOND_PATH"
          python3 -m py_compile \
            scripts/prepare_five_page_missing_constructor_matrix.py \
            scripts/prepare_page5_list_scene_inventory.py
          python3 scripts/prepare_page5_list_scene_inventory.py --output "$GENERATED_PROBE"
          node --check "$GENERATED_PROBE"
          grep -Fq 'page5-list-scene-node-inventory' "$GENERATED_PROBE"
          grep -Fq 'listSceneInventory' "$GENERATED_PROBE"
          grep -Fq 'clickableNodeCount' "$GENERATED_PROBE"
          grep -Fq 'candidateTargetListCount > 0' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute list scene inventory
        id: inventory_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/page5-list-scene-inventory.log

      - name: Build list scene inventory status
        if: always()
        shell: bash
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-list-scene-inventory.log && cp /tmp/page5-list-scene-inventory.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          summary = (report or {}).get('summary') or {}
          cases = (report or {}).get('cases') or []
          case = cases[0] if cases else None
          inventory = (case or {}).get('listSceneInventory') or {}
          clickable = [node for node in inventory.get('nodes') or [] if node.get('clickable')]
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('INVENTORY_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('INVENTORY_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-list-scene-node-inventory',
              'summary': summary,
              'clickableNodes': clickable,
              'candidatePatch': (report or {}).get('candidatePatch'),
              'reportAvailable': bool(report),
              'artifactName': 'page5-list-scene-inventory',
              'candidatePersisted': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_LIST_SCENE_INVENTORY_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-list-scene-inventory
          path: page5-list-scene-inventory
          retention-days: 30
          if-no-files-found: warn

      - name: Publish list scene inventory status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_LIST_SCENE_INVENTORY_STATUS.json docs/PAGE5_LIST_SCENE_INVENTORY_STATUS.json
          git add docs/PAGE5_LIST_SCENE_INVENTORY_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five list scene node inventory"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce list scene inventory gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_LIST_SCENE_INVENTORY_STATUS.json >/dev/null
