name: Genericize JS task branch

on:
  push:
    branches:
      - codex/generic-js-anonymization-20260809
    paths:
      - tools/genericize-js.mjs
      - .github/workflows/genericize-js-once.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/genericize-js.mjs
      - .github/workflows/genericize-js-once.yml

permissions:
  contents: write

concurrency:
  group: genericize-js-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  genericize:
    if: github.head_ref == '' || github.head_ref == 'codex/generic-js-anonymization-20260809'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser dependency
        run: npm install --no-save --no-package-lock acorn@8

      - name: Optimize large-file interval scan
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tools/genericize-js.mjs';
          let source = fs.readFileSync(file, 'utf8');
          const before = `    const overlap = replacements.some((r) => item.start < r.end && item.end > r.start);`;
          const after = `    const lastReplacement = replacements[replacements.length - 1];\n    const overlap = Boolean(lastReplacement && item.start < lastReplacement.end && item.end > lastReplacement.start);`;
          if (!source.includes(before)) throw new Error('genericizer optimization target not found');
          source = source.replace(before, after);
          fs.writeFileSync(file, source);
          NODE

      - name: Apply anonymous generic template conversion
        run: node tools/genericize-js.mjs apply

      - name: Verify anonymous templates
        run: node tools/genericize-js.mjs verify

      - name: Commit generated JS and registry
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add remote-script/src/noname.js game-engine/release/game-1.0.5.js docs/GENERIC_JS_ANONYMIZATION.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "refactor: genericize JS literals [genericized]"
          git push origin "HEAD:${TARGET_BRANCH}"
