name: Genericize JS task branch

on:
  push:
    branches:
      - codex/generic-js-anonymization-20260809
    paths:
      - tools/genericize-js.mjs
      - .github/workflows/genericize-js-once.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/genericize-js.mjs
      - .github/workflows/genericize-js-once.yml

permissions:
  contents: write

concurrency:
  group: genericize-js-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  genericize:
    if: github.head_ref == '' || github.head_ref == 'codex/generic-js-anonymization-20260809'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout task branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install parser dependency
        run: npm install --no-save --no-package-lock acorn@8

      - name: Persist validated large-file fixes
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const file = 'tools/genericize-js.mjs';
          let source = fs.readFileSync(file, 'utf8');

          const overlapBefore = `    const overlap = replacements.some((r) => item.start < r.end && item.end > r.start);`;
          const overlapAfter = `    const lastReplacement = replacements[replacements.length - 1];\n    const overlap = Boolean(lastReplacement && item.start < lastReplacement.end && item.end > lastReplacement.start);`;
          if (source.includes(overlapBefore)) source = source.replace(overlapBefore, overlapAfter);

          const applyBefore = `function applyPlan(source, plan) {\n  let out = source;\n  for (const item of plan) {\n    out = out.slice(0, item.start) + item.genericSource + out.slice(item.end);\n  }\n  return out;\n}`;
          const applyAfter = `function applyPlan(source, plan) {\n  const ascending = [...plan].sort((a, b) => a.start - b.start || a.end - b.end);\n  let out = '';\n  let cursor = 0;\n  for (const item of ascending) {\n    out += source.slice(cursor, item.start);\n    out += item.genericSource;\n    cursor = item.end;\n  }\n  out += source.slice(cursor);\n  return out;\n}`;
          if (source.includes(applyBefore)) source = source.replace(applyBefore, applyAfter);

          source = source.replaceAll('\\d{6}', '\\d{6,}');
          fs.writeFileSync(file, source);
          NODE

      - name: Apply anonymous generic template conversion if needed
        shell: bash
        run: |
          if grep -q 'GJS_ANONYMIZED_V1' remote-script/src/noname.js; then
            echo "Anonymous templates already generated"
          else
            node tools/genericize-js.mjs apply
          fi

      - name: Verify anonymous templates
        run: node tools/genericize-js.mjs verify

      - name: Commit validated helper and generated outputs
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/genericize-js.mjs remote-script/src/noname.js game-engine/release/game-1.0.5.js docs/GENERIC_JS_ANONYMIZATION.md
          if git diff --cached --quiet; then
            echo "No generated changes"
            exit 0
          fi
          git commit -m "chore: persist validated genericizer helper"
          git push origin "HEAD:${TARGET_BRANCH}"
