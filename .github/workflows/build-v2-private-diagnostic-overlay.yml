name: Build signed V2 strict private diagnostic overlay

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "v2_privacy_strict_patch/**"
      - "v2_diagnostics_patch/**"
      - ".github/workflows/build-v2-private-diagnostic-overlay.yml"

jobs:
  build-v2-private-diagnostic-overlay:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Validate signing inputs
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GG_RELEASE_KEYSTORE_BASE64:-}"
          test -n "${GG_RELEASE_KEYSTORE_PASSWORD:-}"

      - name: Apply diagnostic base and strict privacy layer
        shell: bash
        run: |
          set -euo pipefail
          python3 v2_diagnostics_patch/apply.py
          python3 v2_privacy_strict_patch/apply.py
          node --check v2/android/client/src/main/assets/diagnostic-prelude.js
          node --check v2/android/client/src/main/assets/diagnostic-postlude.js

      - name: Verify strict non-identifying guardrails
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'versionCode = 28' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.17-private-diagnostic"' v2/android/client/build.gradle.kts
          grep -Fq 'PROTOCOL_APP_VERSION = 25' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          grep -Fq 'android:label="匿名诊断工具"' v2/android/client/src/main/AndroidManifest.xml
          grep -Fq 'assertPrivacySafe(logFile)' v2/android/client/src/main/java/com/jinli/ggsecure/DiagnosticLogger.java
          grep -Fq 'No exact or hashed domain' v2/android/client/src/main/java/com/jinli/ggsecure/DiagnosticLogger.java
          grep -Fq 'privateSessionNonce' v2/android/client/src/main/java/com/jinli/ggsecure/DiagnosticLogger.java
          grep -Fq 'dynamic_script_start' v2/android/client/src/main/assets/diagnostic-postlude.js
          grep -Fq 'callback_state' v2/android/client/src/main/assets/diagnostic-postlude.js
          grep -Fq 'routeToken' v2/android/client/src/main/assets/diagnostic-prelude.js
          grep -Fq 'selectorToken' v2/android/client/src/main/assets/diagnostic-prelude.js
          grep -Fq 'getWindow().addFlags(WindowManager.LayoutParams.FLAG_SECURE)' v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java

          combined="/tmp/private-diagnostic-sources.txt"
          cat v2/android/client/src/main/assets/diagnostic-prelude.js \
              v2/android/client/src/main/assets/diagnostic-postlude.js > "$combined"
          for forbidden in \
            '66rpg' 'cgyouxi' 'createBuyOrder' 'goods_id' 'buy_num' \
            'mallViewData' 'https://' 'http://' 'userAgentHash' 'messageHash' \
            'stackHash' 'sha256' 'textLength' 'className' 'responseBody' \
            'requestBody'; do
            if grep -Fiq "$forbidden" "$combined"; then
              echo "Strict privacy guard failed: $forbidden" >&2
              exit 1
            fi
          done
          test ! -e v2/android/client/src/main/assets/noname.js
          test ! -e v2/android/client/src/main/assets/game.js

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon -p v2/android :client:clean :client:lintRelease :client:assembleRelease --stacktrace 2>&1 | tee /tmp/gradle-v2-private-diagnostic.log

      - name: Sign and verify APK
        shell: bash
        run: |
          set -euo pipefail
          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$unsigned" && test -s "$unsigned"
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/gg-release.jks
          test -s /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks \
            -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool-v2-private-diagnostic.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool-v2-private-diagnostic.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"

          mkdir -p dist-private-diagnostic
          signed="dist-private-diagnostic/GG-2.0.17-严格匿名诊断覆盖版-code28.apk"
          "$apksigner" sign \
            --ks /tmp/gg-release.jks \
            --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out "$signed" "$unsigned"

          "$apksigner" verify --verbose --print-certs "$signed" > /tmp/apksigner-v2-private-diagnostic.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apksigner-v2-private-diagnostic.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apksigner-v2-private-diagnostic.txt
          expected_digest="$(printf '%s' "$CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          actual_digest="$(awk -F': ' '/certificate SHA-256 digest:/ {print tolower($2); exit}' /tmp/apksigner-v2-private-diagnostic.txt | tr -d '[:space:]')"
          test "$actual_digest" = "$expected_digest"

          "$aapt" dump badging "$signed" > /tmp/aapt-v2-private-diagnostic.txt
          grep -Fq "package: name='com.jinli.quickweb' versionCode='28' versionName='2.0.17-private-diagnostic'" /tmp/aapt-v2-private-diagnostic.txt
          unzip -l "$signed" > /tmp/apk-v2-private-diagnostic-files.txt
          grep -Fq 'assets/diagnostic-prelude.js' /tmp/apk-v2-private-diagnostic-files.txt
          grep -Fq 'assets/diagnostic-postlude.js' /tmp/apk-v2-private-diagnostic-files.txt
          if grep -Fq 'assets/noname.js' /tmp/apk-v2-private-diagnostic-files.txt; then exit 1; fi
          if grep -Fq 'assets/game.js' /tmp/apk-v2-private-diagnostic-files.txt; then exit 1; fi

          sha256sum "$signed" > dist-private-diagnostic/SHA256SUMS.txt
          cat > dist-private-diagnostic/使用说明.txt <<'TXT'
          严格匿名诊断覆盖版：
          - package: com.jinli.quickweb
          - versionCode: 28
          - runtime protocol: 25
          - 正式 gg-release 证书签名，可覆盖 code26/code27
          - 不修改目标 JS、请求、响应或功能结果，只增加匿名运行记录
          - 不导出域名/网址特征、稳定哈希、页面文字、对象字段、脚本摘要或精确资源指纹
          - 路由、选择器、回调和错误只使用本次运行有效的临时编号
          - 导出前执行二次隐私审计，发现疑似标识会拒绝导出

          不要卸载原应用。覆盖后先点击“日志→清空”，彻底关闭 App，再打开并完整复现至少两次，最后导出 ZIP。
          TXT

      - uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.17-strict-private-diagnostic-overlay-code28
          path: dist-private-diagnostic/*
          retention-days: 14
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GG-V2-strict-private-diagnostic-build-logs
          path: |
            /tmp/gradle-v2-private-diagnostic.log
            /tmp/keytool-v2-private-diagnostic.txt
            /tmp/apksigner-v2-private-diagnostic.txt
            /tmp/aapt-v2-private-diagnostic.txt
          retention-days: 7
          if-no-files-found: warn
