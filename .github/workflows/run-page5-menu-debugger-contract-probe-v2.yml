name: Probe page five menu contract with debugger v2

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - .github/workflows/run-page5-menu-debugger-contract-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-menu-debugger-contract-probe-v2-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OUTPUT_DIR: page5-menu-debugger-contract-probe-v2
      GENERATED_PROBE: scripts/run_page5_menu_debugger_contract_probe_v2.generated.mjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare guaranteed-path debugger probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('scripts/run_page5_menu_debugger_contract_probe.mjs').read_text(encoding='utf-8')
          source = source.replace(
              'const outputDir = process.env.OUTPUT_DIR || "page5-menu-debugger-contract-probe";',
              'const outputDir = process.env.OUTPUT_DIR || "page5-menu-debugger-contract-probe-v2";',
              1,
          )
          marker = '      const [, controllerVar, runtimeVar, menuCtorVar] = match;\n'
          insertion = '''      const [, controllerVar, runtimeVar, menuCtorVar] = match;
                const pauseNeedle = `${controllerVar}['_g'+'GM'+'su'+'n2'+'Fw'+'wT'+'o']()['pa'+'us'+'eC'+'ou'+'nt'+'Se'+'rv'+'er']()`;
                const pauseIndex = source.lastIndexOf(pauseNeedle, match.index);
                if (pauseIndex < 0) throw new Error("guaranteed menu path not found");
          '''
          if source.count(marker) != 1:
              raise SystemExit(f'identifier marker count mismatch: {source.count(marker)}')
          source = source.replace(marker, insertion, 1)
          if source.count('columnNumber: match.index,') != 1:
              raise SystemExit('breakpoint column marker mismatch')
          source = source.replace('columnNumber: match.index,', 'columnNumber: pauseIndex,', 1)
          source = source.replace(
              'expressionIndex: match.index,\n        identifiers:',
              'expressionIndex: match.index,\n        breakpointIndex: pauseIndex,\n        identifiers:',
              1,
          )
          source = source.replace(
              'expressionIndex: scriptInfo.expressionIndex,\n      };',
              'expressionIndex: scriptInfo.expressionIndex,\n        breakpointIndex: scriptInfo.breakpointIndex,\n      };',
              1,
          )
          source = source.replace(
              'mode: "page5-menu-debugger-contract-read-only-probe",',
              'mode: "page5-menu-debugger-contract-read-only-probe-v2",',
              1,
          )
          output = Path('scripts/run_page5_menu_debugger_contract_probe_v2.generated.mjs')
          output.write_text(source, encoding='utf-8')
          print(output)
          PY
          node --check "$GENERATED_PROBE"
          grep -Fq 'columnNumber: pauseIndex' "$GENERATED_PROBE"
          grep -Fq 'guaranteed menu path not found' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute corrected debugger probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/page5-menu-debugger-contract-probe-v2.log

      - name: Build probe status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-menu-debugger-contract-probe-v2.log && cp /tmp/page5-menu-debugger-contract-probe-v2.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          pause = report.get('pause', {}) if report else {}
          inspected = pause.get('inspected', {}) if pause else {}
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-menu-debugger-contract-read-only-probe-v2',
              'scriptReady': report.get('scriptReady') if report else None,
              'pauseCaptured': report.get('pauseCaptured') if report else None,
              'pauseReason': pause.get('reason') if pause else None,
              'breakpoint': report.get('breakpoint') if report else None,
              'inspectedLabels': sorted(inspected.keys()),
              'runtimePropertyCount': ((inspected.get('runtime') or {}).get('result') or {}).get('propertyCount'),
              'scenePropertyCount': ((inspected.get('current-scene') or {}).get('result') or {}).get('propertyCount'),
              'canvasPropertyCount': ((inspected.get('runtime-canvas') or {}).get('result') or {}).get('propertyCount'),
              'controllerPropertyCount': ((inspected.get('controller') or {}).get('result') or {}).get('propertyCount'),
              'constructorPropertyCount': ((inspected.get('menu-constructor') or {}).get('result') or {}).get('propertyCount'),
              'mainFrameValid': report.get('mainFrameValid') if report else None,
              'pageErrorCount': len(report.get('pageErrors', [])) if report else None,
              'blockedOrderCount': len(report.get('blockedOrders', [])) if report else None,
              'debuggerErrorCount': len(report.get('debuggerErrors', [])) if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'page5-menu-debugger-contract-probe-v2',
              'readOnlyProbe': True,
              'pageScriptModified': False,
              'candidateTested': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_MENU_DEBUGGER_CONTRACT_PROBE_V2_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-menu-debugger-contract-probe-v2
          path: page5-menu-debugger-contract-probe-v2
          retention-days: 30
          if-no-files-found: warn

      - name: Publish probe status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_MENU_DEBUGGER_CONTRACT_PROBE_V2_STATUS.json docs/PAGE5_MENU_DEBUGGER_CONTRACT_PROBE_V2_STATUS.json
          git add docs/PAGE5_MENU_DEBUGGER_CONTRACT_PROBE_V2_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected page five menu debugger probe"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce debugger capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_MENU_DEBUGGER_CONTRACT_PROBE_V2_STATUS.json >/dev/null
