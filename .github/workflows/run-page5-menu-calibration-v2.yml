name: Run corrected page five menu calibration

on:
  push:
    branches:
      - diagnostics/page5-menu-calibration-v2-20260805
    paths:
      - docs/diagnostics/run_page5_menu_calibration_v2.mjs
      - .github/workflows/run-page5-menu-calibration-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-menu-calibration-v2-20260805
  cancel-in-progress: true

jobs:
  calibrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OUTPUT_DIR: page5-menu-calibration-v2
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js
      CURRENT_SECOND_SIZE: 11590534
      CURRENT_SECOND_SHA256: ba8103ab7ef8ee8327df6d1d73daba8aca3a4c90d2370e30ab93001fce289112

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-menu-calibration-v2-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify corrected calibration boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check docs/diagnostics/run_page5_menu_calibration_v2.mjs
          test -s "$CURRENT_FIRST_PATH"
          grep -Fq '@version      1.1.4' "$CURRENT_FIRST_PATH"
          test "$(stat -c%s "$CURRENT_SECOND_PATH")" = "$CURRENT_SECOND_SIZE"
          test "$(sha256sum "$CURRENT_SECOND_PATH" | awk '{print $1}')" = "$CURRENT_SECOND_SHA256"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Capture corrected page-five menu
        id: calibration_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node docs/diagnostics/run_page5_menu_calibration_v2.mjs 2>&1 | tee /tmp/page5-menu-calibration-v2.log

      - name: Build corrected status
        if: always()
        shell: bash
        env:
          CALIBRATION_OUTCOME: ${{ steps.calibration_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-menu-calibration-v2.log && cp /tmp/page5-menu-calibration-v2.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ["OUTPUT_DIR"])
          report_path = output / "report.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else None
          capture_ok = bool(report) and bool(report.get("captureOk")) and os.environ.get("CALIBRATION_OUTCOME") == "success"
          status = {
              "schemaVersion": 2,
              "generatedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "state": "completed",
              "workflowOutcome": os.environ.get("CALIBRATION_OUTCOME", "unknown"),
              "captureOk": capture_ok,
              "menuVisualValidated": False,
              "ok": False,
              "mode": "page5-menu-calibration-v2-client-equivalent-navigation",
              "menuTap": report.get("menuTap") if report else {"x": 351, "y": 741},
              "mainFrameValidBefore": report.get("mainFrameValidBefore") if report else False,
              "mainFrameValidAfter": report.get("mainFrameValidAfter") if report else False,
              "screenshotChanged": report.get("screenshotChanged") if report else None,
              "blockedNavigationCount": len((report.get("navigationGuard") or {}).get("blocked") or []) if report else 0,
              "menuWindow": report.get("menuWindow") if report else None,
              "reportAvailable": bool(report),
              "artifactName": "page5-menu-calibration-v2",
              "apkBuilt": False,
              "productionDefaultChanged": False,
              "runtimeFilesChanged": False,
              "androidClientChanged": False,
              "authorizationOutcomeModified": False,
              "paymentCompleted": False,
          }
          Path("/tmp/PAGE5_MENU_CALIBRATION_V2_STATUS.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-menu-calibration-v2
          path: page5-menu-calibration-v2
          retention-days: 30
          if-no-files-found: warn

      - name: Publish corrected status to branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_MENU_CALIBRATION_V2_STATUS.json docs/PAGE5_MENU_CALIBRATION_V2_STATUS.json
          git add docs/PAGE5_MENU_CALIBRATION_V2_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record corrected page five menu calibration status"
            git push origin HEAD:diagnostics/page5-menu-calibration-v2-20260805
          fi

      - name: Enforce corrected capture gate
        if: always()
        shell: bash
        run: |
          jq -e '.captureOk == true and .mainFrameValidBefore == true and .mainFrameValidAfter == true and .menuVisualValidated == false and .apkBuilt == false' /tmp/PAGE5_MENU_CALIBRATION_V2_STATUS.json >/dev/null
