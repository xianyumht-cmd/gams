name: Export page5 implementation source

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - .github/workflows/export-page5-implementation-source.yml
      - scripts/page5_implementation_source_export.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-implementation-source-export-20260806
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      IMPLEMENTATION_REF: fix/page5-missing-constructor-mobile-bridge-20260806
      WORKTREE: /tmp/gams-page5-source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - name: Prepare implementation source archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$IMPLEMENTATION_REF:refs/remotes/origin/$IMPLEMENTATION_REF"
          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" "origin/$IMPLEMENTATION_REF"
          test -s "$WORKTREE/game-engine/release/game-1.0.5.js"
          test -s "$WORKTREE/v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java"
          test -s "$WORKTREE/v2/runtime/src/index.js"
          git -C "$WORKTREE" rev-parse HEAD > /tmp/IMPLEMENTATION_COMMIT.txt
          sha256sum "$WORKTREE/game-engine/release/game-1.0.5.js" > /tmp/GAME_ENGINE_SHA256.txt
          tar -C "$WORKTREE" -czf /tmp/page5-implementation-source.tar.gz \
            game-engine/release/game-1.0.5.js \
            v2/android/client \
            v2/android/settings.gradle.kts \
            v2/runtime/src/index.js \
            scripts
          tar -rf /tmp/page5-implementation-source.tar /dev/null 2>/dev/null || true
          test -s /tmp/page5-implementation-source.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: page5-implementation-source
          path: |
            /tmp/page5-implementation-source.tar.gz
            /tmp/IMPLEMENTATION_COMMIT.txt
            /tmp/GAME_ENGINE_SHA256.txt
          retention-days: 7
          if-no-files-found: error

      - name: Publish export status
        shell: bash
        run: |
          set -euo pipefail
          implementation_commit="$(cat /tmp/IMPLEMENTATION_COMMIT.txt)"
          runtime_sha="$(awk '{print $1}' /tmp/GAME_ENGINE_SHA256.txt)"
          python3 - <<PY
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          status = {
            'schemaVersion': 1,
            'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
            'runId': int(os.environ['GITHUB_RUN_ID']),
            'state': 'completed',
            'ok': True,
            'implementationRef': os.environ['IMPLEMENTATION_REF'],
            'implementationCommit': '$implementation_commit',
            'runtimeSha256': '$runtime_sha',
            'artifactName': 'page5-implementation-source',
          }
          Path('docs/PAGE5_IMPLEMENTATION_SOURCE_EXPORT_STATUS.json').write_text(json.dumps(status, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          git add docs/PAGE5_IMPLEMENTATION_SOURCE_EXPORT_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page5 implementation source export"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi
