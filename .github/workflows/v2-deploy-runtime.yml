name: Deploy GG production runtime service

on:
  push:
    branches:
      - main
    paths:
      - v2/runtime/src/**
      - v2/runtime/wrangler.template.jsonc
      - v2/runtime/release/**
      - scripts/v2-lifecycle-smoke.mjs
      - .github/workflows/v2-deploy-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      ADMIN_LOGIN_SECRET: ${{ secrets.LICENSE_ADMIN_PASSWORD }}
      LICENSE_ENDPOINT: https://gams-license-api.2320006072.workers.dev
      RUNTIME_ENDPOINT: https://gams-runtime-v2.2320006072.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TOKEN_SIGNING_SECRET ADMIN_LOGIN_SECRET; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          test "${#TOKEN_SIGNING_SECRET}" -ge 32
          node --check scripts/v2-lifecycle-smoke.mjs

      - name: Patch runtime token verification only
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("v2/runtime/src/index.js")
          text = path.read_text(encoding="utf-8")
          old = '    const expected = await hmac(payloadPart, env.ADMIN_PASSWORD || "");'
          new = '    const expected = await hmac(payloadPart, env.TOKEN_SIGNING_SECRET || "");'
          if text.count(old) != 1:
              raise SystemExit("runtime token verification source did not match the stable contract")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY
          node --check v2/runtime/src/index.js
          grep -Fq 'env.TOKEN_SIGNING_SECRET' v2/runtime/src/index.js

      - name: Locate shared license D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          database_id="$(printf '%s' "$response" | jq -r '.result[] | select(.name=="gams-license-db") | (.uuid // .id)' | head -n1)"
          test -n "$database_id" && test "$database_id" != "null"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Generate Wrangler configuration
        id: config
        working-directory: v2/runtime
        shell: bash
        run: |
          set -euo pipefail
          sed "s/__D1_DATABASE_ID__/${{ steps.d1.outputs.database_id }}/g" \
            wrangler.template.jsonc > wrangler.generated.jsonc

      - name: Configure runtime token verification secret
        id: secret
        working-directory: v2/runtime
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN_SIGNING_SECRET" \
            | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.generated.jsonc

      - name: Deploy production Runtime Worker
        id: runtime_deploy
        working-directory: v2/runtime
        run: npx --yes wrangler@4 deploy --config wrangler.generated.jsonc

      - name: Wait for both production services
        id: services
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            license_status="$(curl -sS -o /tmp/license-health.json -w '%{http_code}' "$LICENSE_ENDPOINT/health" || true)"
            runtime_status="$(curl -sS -o /tmp/runtime-health.json -w '%{http_code}' "$RUNTIME_ENDPOINT/health" || true)"
            if [[ "$license_status" == "200" && "$runtime_status" == "200" ]] \
              && jq -e '.ok == true and .version == 2 and .signedProtocol == true' /tmp/license-health.json >/dev/null \
              && jq -e '.ok == true and .service == "gams-runtime-v2" and .encryptedRuntime == true' /tmp/runtime-health.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/license-health.json 2>/dev/null || true
          cat /tmp/runtime-health.json 2>/dev/null || true
          exit 1

      - name: Run signed production lifecycle acceptance
        id: lifecycle
        run: node scripts/v2-lifecycle-smoke.mjs

      - name: Record production hotfix status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          SECRET_OUTCOME: ${{ steps.secret.outcome }}
          RUNTIME_DEPLOY_OUTCOME: ${{ steps.runtime_deploy.outcome }}
          SERVICES_OUTCOME: ${{ steps.services.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gams-status
          overall=false
          if [[ "$INPUTS_OUTCOME" == "success" \
             && "$PATCH_OUTCOME" == "success" \
             && "$SECRET_OUTCOME" == "success" \
             && "$RUNTIME_DEPLOY_OUTCOME" == "success" \
             && "$SERVICES_OUTCOME" == "success" \
             && "$LIFECYCLE_OUTCOME" == "success" ]]; then
            overall=true
          fi

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg inputs "$INPUTS_OUTCOME" \
            --arg patch "$PATCH_OUTCOME" \
            --arg secret "$SECRET_OUTCOME" \
            --arg runtimeDeploy "$RUNTIME_DEPLOY_OUTCOME" \
            --arg services "$SERVICES_OUTCOME" \
            --arg lifecycle "$LIFECYCLE_OUTCOME" \
            --argjson ok "$overall" \
            '{schemaVersion:1,generatedAt:$generatedAt,triggerCommit:$commit,ok:$ok,steps:{inputs:$inputs,runtimeSourcePatch:$patch,runtimeTokenSecret:$secret,runtimeDeploy:$runtimeDeploy,bothServicesHealthy:$services,signedLifecycleAcceptance:$lifecycle},runtimeAdminPasswordOverwritten:false,cloudflareSecurityRulesChanged:false,secretsExposed:false}' \
            > /tmp/gams-status/report.json

          path="docs/PRODUCTION_MINIMAL_HOTFIX_STATUS.json"
          content="$(base64 -w0 /tmp/gams-status/report.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record production minimal hotfix status' \
              -f content="$content" \
              -f sha="$existing_sha" \
              -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record production minimal hotfix status' \
              -f content="$content" \
              -f branch=main >/dev/null
          fi

      - name: Require complete production acceptance
        if: always()
        shell: bash
        run: |
          test "${{ steps.inputs.outcome }}" = "success"
          test "${{ steps.patch.outcome }}" = "success"
          test "${{ steps.secret.outcome }}" = "success"
          test "${{ steps.runtime_deploy.outcome }}" = "success"
          test "${{ steps.services.outcome }}" = "success"
          test "${{ steps.lifecycle.outcome }}" = "success"
