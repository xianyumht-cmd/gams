name: Deploy GG production runtime service

on:
  push:
    branches:
      - main
    paths:
      - v2/runtime/src/**
      - v2/runtime/wrangler.template.jsonc
      - v2/runtime/release/**
      - scripts/v2-lifecycle-smoke.mjs
      - .github/workflows/v2-deploy-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-runtime
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      ADMIN_LOGIN_SECRET: ${{ secrets.LICENSE_ADMIN_PASSWORD }}
      LICENSE_ENDPOINT: https://gams-license-api.2320006072.workers.dev
      RUNTIME_ENDPOINT: https://gams-runtime-v2.2320006072.workers.dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TOKEN_SIGNING_SECRET RUNTIME_MASTER_KEY ADMIN_LOGIN_SECRET; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          test "${#TOKEN_SIGNING_SECRET}" -ge 32
          node --input-type=module - <<'NODE'
          import { decodeRuntimeMasterKey } from "./v2/runtime/src/runtime-key.js";
          const bytes = decodeRuntimeMasterKey(process.env.RUNTIME_MASTER_KEY);
          bytes.fill(0);
          NODE
          node --check scripts/v2-lifecycle-smoke.mjs

      - name: Preserve legacy runtime decryption and async error handling
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("v2/runtime/src/index.js")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "        return issueChallenge(request, env);":
                  "        return await issueChallenge(request, env);",
              "        return runtimeAccess(request, env);":
                  "        return await runtimeAccess(request, env);",
              "        return runtimeBundle(request, env);":
                  "        return await runtimeBundle(request, env);",
              '      legacyRuntimePassword: env.LEGACY_RUNTIME_PASSWORD || "",':
                  '      legacyRuntimePassword: env.LEGACY_RUNTIME_PASSWORD || env.ADMIN_PASSWORD || "",',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Runtime V3 source mismatch for {old!r}: {count}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          node --check v2/runtime/src/index.js
          node --check v2/runtime/src/runtime-key.js
          grep -Fq 'return await runtimeAccess' v2/runtime/src/index.js
          grep -Fq 'env.LEGACY_RUNTIME_PASSWORD || env.ADMIN_PASSWORD' v2/runtime/src/index.js
          grep -Fq 'env.TOKEN_SIGNING_SECRET' v2/runtime/src/index.js

      - name: Locate shared license D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          database_id="$(printf '%s' "$response" | jq -r '.result[] | select(.name=="gams-license-db") | (.uuid // .id)' | head -n1)"
          test -n "$database_id" && test "$database_id" != "null"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Generate Wrangler configuration
        working-directory: v2/runtime
        shell: bash
        run: |
          set -euo pipefail
          sed "s/__D1_DATABASE_ID__/${{ steps.d1.outputs.database_id }}/g" \
            wrangler.template.jsonc > wrangler.generated.jsonc

      - name: Configure split Runtime secrets
        id: secrets
        working-directory: v2/runtime
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN_SIGNING_SECRET" \
            | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.generated.jsonc
          printf '%s' "$RUNTIME_MASTER_KEY" \
            | npx --yes wrangler@4 secret put RUNTIME_MASTER_KEY --config wrangler.generated.jsonc
          echo "Existing ADMIN_PASSWORD is intentionally preserved and was not written."

      - name: Deploy production Runtime V3 Worker
        id: deploy
        working-directory: v2/runtime
        run: npx --yes wrangler@4 deploy --config wrangler.generated.jsonc

      - name: Wait for both production services
        id: health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            license_status="$(curl -sS -o /tmp/license-health.json -w '%{http_code}' "$LICENSE_ENDPOINT/health" || true)"
            runtime_status="$(curl -sS -o /tmp/runtime-health.json -w '%{http_code}' "$RUNTIME_ENDPOINT/health" || true)"
            if [[ "$license_status" == "200" && "$runtime_status" == "200" ]] \
              && jq -e '.ok and .version == 2 and .signedProtocol == true' /tmp/license-health.json >/dev/null \
              && jq -e '.ok and .version == 3 and .encryptedRuntime == true and .splitSecrets == true and .legacyReleaseCompatible == true' /tmp/runtime-health.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/license-health.json 2>/dev/null || true
          cat /tmp/runtime-health.json 2>/dev/null || true
          exit 1

      - name: Run complete signed V2 lifecycle acceptance
        id: lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/v2-lifecycle-smoke.mjs 2>&1 | tee /tmp/lifecycle.log

      - name: Record production Runtime V3 status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          SECRETS_OUTCOME: ${{ steps.secrets.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('/tmp/lifecycle.log')
          text = source.read_text(encoding='utf-8', errors='replace') if source.exists() else ''
          text = text[-5000:]
          text = re.sub(r'(?i)(authorization|token|licenseKey|signature)\\?"?\s*[:=]\s*\\?"?[^,}\s]+', r'\1:<redacted>', text)
          text = re.sub(r'[A-Za-z0-9_+/=-]{48,}', '<redacted>', text)
          Path('/tmp/lifecycle-sanitized.log').write_text(text, encoding='utf-8')
          PY
          ok=false
          if [[ "$INPUTS_OUTCOME" == "success" && "$PATCH_OUTCOME" == "success" \
             && "$SECRETS_OUTCOME" == "success" && "$DEPLOY_OUTCOME" == "success" \
             && "$HEALTH_OUTCOME" == "success" && "$LIFECYCLE_OUTCOME" == "success" ]]; then
            ok=true
          fi
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg inputs "$INPUTS_OUTCOME" \
            --arg patch "$PATCH_OUTCOME" \
            --arg secrets "$SECRETS_OUTCOME" \
            --arg deploy "$DEPLOY_OUTCOME" \
            --arg health "$HEALTH_OUTCOME" \
            --arg lifecycle "$LIFECYCLE_OUTCOME" \
            --rawfile log /tmp/lifecycle-sanitized.log \
            --argjson ok "$ok" \
            '{schemaVersion:1,generatedAt:$generatedAt,triggerCommit:$commit,ok:$ok,runtimeVersion:3,steps:{inputs:$inputs,legacyCompatibilityPatch:$patch,splitSecrets:$secrets,deploy:$deploy,health:$health,lifecycle:$lifecycle},sanitizedLog:$log,runtimeAdminPasswordOverwritten:false,cloudflareSecurityRulesChanged:false,apkRebuilt:false,secretsExposed:false}' \
            > /tmp/runtime-v3-status.json
          path="docs/PRODUCTION_RUNTIME_V3_STATUS.json"
          content="$(base64 -w0 /tmp/runtime-v3-status.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record production Runtime V3 status' -f content="$content" \
              -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record production Runtime V3 status' -f content="$content" \
              -f branch=main >/dev/null
          fi

      - name: Require complete production acceptance
        if: always()
        shell: bash
        run: |
          test "${{ steps.inputs.outcome }}" = "success"
          test "${{ steps.patch.outcome }}" = "success"
          test "${{ steps.secrets.outcome }}" = "success"
          test "${{ steps.deploy.outcome }}" = "success"
          test "${{ steps.health.outcome }}" = "success"
          test "${{ steps.lifecycle.outcome }}" = "success"
