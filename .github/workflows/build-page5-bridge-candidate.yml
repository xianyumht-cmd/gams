name: Build isolated page five bridge candidate

on:
  push:
    branches:
      - fix/page5-missing-constructor-mobile-bridge-20260806
    paths:
      - scripts/build_page5_bridge_candidate.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-bridge-candidate-20260806
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      IMPLEMENTATION_BRANCH: fix/page5-missing-constructor-mobile-bridge-20260806
      BROWSER_STATUS_REF: diagnostics/page5-guard-full-entry-20260805
      CANDIDATE_BRANCH: candidate-page5-bridge-20260806
      CANDIDATE_RUNTIME_DIR: candidate-runtime-page5-bridge/release
      CANDIDATE_RUNTIME_VERSION: 2.0.9-page5-bridge-c1
      CANDIDATE_APP_VERSION: 24
      APK_VERSION_NAME: 2.0.13-page5-bridge
      APK_VERSION_CODE: 24
      FIRST_FILE: remote-script/src/noname.js
      SECOND_FILE: game-engine/release/game-1.0.5.js
      SECOND_SIZE: 11590615
      SECOND_SHA256: 9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca
      RUNTIME_WORKER_HOST: gams-runtime-v2.2320006072.workers.dev
      RUNTIME_CUSTOM_HOST: runtime.xn--8pv109c.top
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify browser gate and implementation baseline
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TOKEN_SIGNING_SECRET RUNTIME_MASTER_KEY GG_RELEASE_KEYSTORE_BASE64 GG_RELEASE_KEYSTORE_PASSWORD; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          test "${#TOKEN_SIGNING_SECRET}" -ge 32
          git fetch origin "$BROWSER_STATUS_REF:refs/remotes/origin/$BROWSER_STATUS_REF"
          git show "origin/$BROWSER_STATUS_REF:docs/PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json" > /tmp/PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json
          jq -e '
            .ok == true and
            .fivePage.pass == true and
            .repeatReentry.pass == true and
            .persistedRuntimeSha256 == "9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca" and
            .productionDefaultChanged == false and
            .androidClientChanged == false and
            .apkBuilt == false
          ' /tmp/PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json >/dev/null

          python3 -m py_compile scripts/apply_page5_bridge_candidate_channel.py v2/runtime/tools/build_release.py
          node --check "$FIRST_FILE"
          node --check "$SECOND_FILE"
          test "$(stat -c%s "$SECOND_FILE")" = "$SECOND_SIZE"
          test "$(sha256sum "$SECOND_FILE" | awk '{print $1}')" = "$SECOND_SHA256"
          grep -Fq 'versionCode = 16' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.3-stable"' v2/android/client/build.gradle.kts
          grep -Fq 'PROTOCOL_APP_VERSION = 12' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          sha256sum v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java > /tmp/main-activity.sha256
          sha256sum v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeNames.java > /tmp/runtime-names.sha256
          {
            echo "first_size=$(stat -c%s "$FIRST_FILE")"
            echo "first_sha=$(sha256sum "$FIRST_FILE" | awk '{print $1}')"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish isolated runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          git fetch origin "$IMPLEMENTATION_BRANCH" --quiet
          git fetch origin "$CANDIDATE_BRANCH" --quiet || true
          rm -rf /tmp/gams-page5-bridge
          if git show-ref --verify --quiet "refs/remotes/origin/${CANDIDATE_BRANCH}"; then
            git worktree add /tmp/gams-page5-bridge "origin/${CANDIDATE_BRANCH}"
            cd /tmp/gams-page5-bridge
            git checkout -B "$CANDIDATE_BRANCH" "origin/${CANDIDATE_BRANCH}"
            git reset --hard "origin/${IMPLEMENTATION_BRANCH}"
          else
            git worktree add -b "$CANDIDATE_BRANCH" /tmp/gams-page5-bridge "origin/${IMPLEMENTATION_BRANCH}"
            cd /tmp/gams-page5-bridge
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test -s "$FIRST_FILE"
          test "$(stat -c%s "$FIRST_FILE")" = "${{ steps.verify.outputs.first_size }}"
          test "$(sha256sum "$FIRST_FILE" | awk '{print $1}')" = "${{ steps.verify.outputs.first_sha }}"
          test -s "$SECOND_FILE"
          test "$(stat -c%s "$SECOND_FILE")" = "$SECOND_SIZE"
          test "$(sha256sum "$SECOND_FILE" | awk '{print $1}')" = "$SECOND_SHA256"
          rm -rf "$CANDIDATE_RUNTIME_DIR"
          mkdir -p "$CANDIDATE_RUNTIME_DIR"

          export RUNTIME_SIGNING_PASSWORD="$(python3 - <<'PY'
          import hashlib, hmac, os
          print(hmac.new(
              os.environ['GG_RELEASE_KEYSTORE_PASSWORD'].encode(),
              b'gams-runtime-release-signing-v1',
              hashlib.sha256,
          ).hexdigest())
          PY
          )"
          trap 'rm -f /tmp/page5-bridge-private.pem /tmp/page5-bridge.sig /tmp/v2-runtime-canonical.txt /tmp/v2-runtime-unsigned.json' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in remote-script/keys/private.pem.enc \
            -out /tmp/page5-bridge-private.pem \
            -pass env:RUNTIME_SIGNING_PASSWORD
          unset RUNTIME_SIGNING_PASSWORD

          python3 v2/runtime/tools/build_release.py \
            "$FIRST_FILE" \
            "$SECOND_FILE" \
            "$CANDIDATE_RUNTIME_VERSION" \
            "$RUNTIME_MASTER_KEY" \
            "$CANDIDATE_RUNTIME_DIR"
          openssl dgst -sha256 -sign /tmp/page5-bridge-private.pem \
            -out /tmp/page5-bridge.sig /tmp/v2-runtime-canonical.txt
          openssl dgst -sha256 -verify remote-script/keys/public.pem \
            -signature /tmp/page5-bridge.sig /tmp/v2-runtime-canonical.txt

          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          release = Path(os.environ['CANDIDATE_RUNTIME_DIR'])
          manifest = json.loads(Path('/tmp/v2-runtime-unsigned.json').read_text())
          manifest['signatureAlgorithm'] = 'SHA256withECDSA'
          manifest['signature'] = base64.b64encode(Path('/tmp/page5-bridge.sig').read_bytes()).decode()
          (release / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          bundle = (release / manifest['file']).read_bytes()
          assert len(bundle) == manifest['size']
          assert hashlib.sha256(bundle).hexdigest() == manifest['sha256']
          assert manifest['gameSize'] == int(os.environ['SECOND_SIZE'])
          assert manifest['gameSha256'] == os.environ['SECOND_SHA256']

          text = os.environ['RUNTIME_MASTER_KEY'].strip()
          if re.fullmatch(r'[0-9a-fA-F]{64}', text):
              master = bytes.fromhex(text)
          else:
              normalized = text.replace('-', '+').replace('_', '/')
              normalized += '=' * ((4 - len(normalized) % 4) % 4)
              master = base64.b64decode(normalized)
          content_key = AESGCM(master).decrypt(
              base64.b64decode(manifest['keyIv']),
              base64.b64decode(manifest['keyCipher']),
              f"gg-v2-key|{manifest['versionName']}".encode(),
          )
          plain = AESGCM(content_key).decrypt(
              base64.b64decode(manifest['iv']),
              bundle,
              f"gg-v2-runtime|{manifest['versionName']}".encode(),
          )
          with zipfile.ZipFile(io.BytesIO(plain)) as archive:
              assert archive.namelist() == ['noname.js', 'game.js']
              assert archive.testzip() is None
              first = archive.read('noname.js')
              second = archive.read('game.js')
          expected_first = Path(os.environ['FIRST_FILE']).read_bytes()
          for old in (
              b'https://gams-script-edge.2320006072.workers.dev/engine/stable.js',
              b'https://preview-chat-1b176371-f9ab-4760-b15c-b9d70ed59d23.space-z.ai/game.js',
          ):
              expected_first = expected_first.replace(old, b'https://ggv2.local/runtime/game.js')
          expected_second = Path(os.environ['SECOND_FILE']).read_bytes()
          assert first == expected_first
          assert second == expected_second
          assert hashlib.sha256(first).hexdigest() == manifest['nonameSha256']
          assert hashlib.sha256(second).hexdigest() == os.environ['SECOND_SHA256']
          PY

          git add "$CANDIDATE_RUNTIME_DIR"
          git add -f "$CANDIDATE_RUNTIME_DIR/bundle-${CANDIDATE_RUNTIME_VERSION}.bin"
          git commit -m 'Build isolated page five bridge runtime'
          git push --force-with-lease origin "HEAD:${CANDIDATE_BRANCH}"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          raw_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${CANDIDATE_BRANCH}/${CANDIDATE_RUNTIME_DIR}"
          version=''
          for attempt in $(seq 1 30); do
            version="$(curl -fsS "${raw_base}/manifest.json?attempt=${attempt}" | jq -r '.versionName' 2>/dev/null || true)"
            if [[ "$version" == "$CANDIDATE_RUNTIME_VERSION" ]]; then break; fi
            sleep 3
          done
          test "$version" = "$CANDIDATE_RUNTIME_VERSION"
          published_file="$(curl -fsS "${raw_base}/manifest.json?final=1" | jq -r '.file')"
          curl -fsS "${raw_base}/${published_file}?final=1" -o /tmp/published-page5-bridge.bin
          expected_bundle_sha="$(jq -r '.sha256' "$CANDIDATE_RUNTIME_DIR/manifest.json")"
          test "$(sha256sum /tmp/published-page5-bridge.bin | awk '{print $1}')" = "$expected_bundle_sha"

      - name: Add isolated default-preserving channel
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git pull --rebase origin "$IMPLEMENTATION_BRANCH"
          python3 scripts/apply_page5_bridge_candidate_channel.py
          python3 scripts/apply_page5_bridge_candidate_channel.py
          node --check v2/runtime/src/index.js
          grep -Fq 'const PAGE5_BRIDGE_APP_VERSION = 24;' v2/runtime/src/index.js
          grep -Fq '2.0.9-page5-bridge-c1' v2/runtime/src/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/runtime/src/index.js
          if ! git diff --cached --quiet; then git commit -m 'Add isolated page five bridge runtime channel'; fi
          git push origin "HEAD:${IMPLEMENTATION_BRANCH}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy runtime worker with isolated channel
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          database_id="$(printf '%s' "$response" | jq -r '.result[] | select(.name=="gams-license-db") | (.uuid // .id)' | head -n1)"
          test -n "$database_id" && test "$database_id" != null
          sed "s/__D1_DATABASE_ID__/${database_id}/g" v2/runtime/wrangler.template.jsonc > v2/runtime/wrangler.page5-bridge.generated.jsonc
          cd v2/runtime
          printf '%s' "$TOKEN_SIGNING_SECRET" | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.page5-bridge.generated.jsonc
          printf '%s' "$RUNTIME_MASTER_KEY" | npx --yes wrangler@4 secret put RUNTIME_MASTER_KEY --config wrangler.page5-bridge.generated.jsonc
          npx --yes wrangler@4 deploy --config wrangler.page5-bridge.generated.jsonc

      - name: Verify isolated and default channels
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          candidate_ok=false
          default_ok=false
          for attempt in $(seq 1 24); do
            candidate_body="$(curl -fsS --connect-timeout 5 --max-time 15 "https://${RUNTIME_WORKER_HOST}/health?candidate=24&attempt=${attempt}" 2>/dev/null || true)"
            default_body="$(curl -fsS --connect-timeout 5 --max-time 15 "https://${RUNTIME_WORKER_HOST}/health?attempt=${attempt}" 2>/dev/null || true)"
            if printf '%s' "$candidate_body" | jq -e '.ok == true and .page5BridgeAppVersion == 24 and .page5BridgeRuntimeVersion == "2.0.9-page5-bridge-c1"' >/dev/null 2>&1; then candidate_ok=true; fi
            if printf '%s' "$default_body" | jq -e '.ok == true and .encryptedRuntime == true and .page5BridgeRuntimeVersion == null' >/dev/null 2>&1; then default_ok=true; fi
            if [[ "$candidate_ok" == true && "$default_ok" == true ]]; then break; fi
            sleep 5
          done
          [[ "$candidate_ok" == true && "$default_ok" == true ]]
          custom_code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/custom-page5-bridge.json -w '%{http_code}' "https://${RUNTIME_CUSTOM_HOST}/health?candidate=24" || true)"
          printf '%s' "$custom_code" > /tmp/custom-page5-bridge-code.txt

      - name: Patch candidate identifiers only
        id: client_patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manager = Path('v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java')
          text = manager.read_text(encoding='utf-8')
          if text.count('PROTOCOL_APP_VERSION = 12') != 1:
              raise SystemExit('protocol baseline mismatch')
          manager.write_text(text.replace('PROTOCOL_APP_VERSION = 12', 'PROTOCOL_APP_VERSION = 24', 1), encoding='utf-8')

          gradle = Path('v2/android/client/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          if text.count('versionCode = 16') != 1 or text.count('versionName = "2.0.3-stable"') != 1:
              raise SystemExit('APK baseline mismatch')
          text = text.replace('versionCode = 16', 'versionCode = 24', 1)
          text = text.replace('versionName = "2.0.3-stable"', 'versionName = "2.0.13-page5-bridge"', 1)
          gradle.write_text(text, encoding='utf-8')
          PY
          sha256sum -c /tmp/main-activity.sha256
          sha256sum -c /tmp/runtime-names.sha256
          grep -Fq 'PROTOCOL_APP_VERSION = 24' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          grep -Fq 'versionCode = 24' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.13-page5-bridge"' v2/android/client/build.gradle.kts

      - name: Build sign and verify candidate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p v2/android :client:clean :client:lintRelease :client:assembleRelease
          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$unsigned"

          trap 'rm -f /tmp/gg-release.jks' EXIT
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/gg-release.jks
          test -s /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool-page5-bridge.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool-page5-bridge.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"

          mkdir -p /tmp/page5-bridge-artifact
          signed="/tmp/page5-bridge-artifact/GG-${APK_VERSION_NAME}-code${APK_VERSION_CODE}.apk"
          "$apksigner" sign \
            --ks /tmp/gg-release.jks --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false --out "$signed" "$unsigned"
          "$apksigner" verify --verbose --print-certs "$signed" > /tmp/apk-page5-bridge-verify.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apk-page5-bridge-verify.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apk-page5-bridge-verify.txt
          "$aapt" dump badging "$signed" > /tmp/apk-page5-bridge-badging.txt
          grep -Fq "package: name='com.jinli.quickweb' versionCode='24' versionName='2.0.13-page5-bridge'" /tmp/apk-page5-bridge-badging.txt
          sha256sum "$signed" | tee /tmp/page5-bridge-artifact/SHA256SUMS.txt
          jq -n \
            --arg versionName "$APK_VERSION_NAME" \
            --argjson versionCode "$APK_VERSION_CODE" \
            --arg runtimeVersion "$CANDIDATE_RUNTIME_VERSION" \
            --arg firstSha256 "${{ steps.verify.outputs.first_sha }}" \
            --arg secondSha256 "$SECOND_SHA256" \
            --arg sourceCommit "${{ steps.runtime.outputs.source_sha }}" \
            '{schemaVersion:1,kind:"page5-bridge-isolated-candidate",versionName:$versionName,versionCode:$versionCode,runtimeVersion:$runtimeVersion,firstFileSha256:$firstSha256,secondFileSha256:$secondSha256,sourceCommit:$sourceCommit,isolation:{androidMainActivityChanged:false,clientNetworkHostsChanged:false,productionDefaultChannelChanged:false}}' \
            > /tmp/page5-bridge-artifact/CANDIDATE_INFO.json

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: GG-2.0.13-page5-bridge-code24
          path: /tmp/page5-bridge-artifact/**
          retention-days: 30
          if-no-files-found: error

      - name: Record isolated candidate status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.verify.outcome }}" == success \
             && "${{ steps.runtime.outcome }}" == success \
             && "${{ steps.source.outcome }}" == success \
             && "${{ steps.deploy.outcome }}" == success \
             && "${{ steps.probe.outcome }}" == success \
             && "${{ steps.client_patch.outcome }}" == success \
             && "${{ steps.apk.outcome }}" == success \
             && "${{ steps.artifact.outcome }}" == success ]]; then
            ok=true
          fi
          apk_sha=''
          if [[ -f /tmp/page5-bridge-artifact/SHA256SUMS.txt ]]; then apk_sha="$(awk '{print $1}' /tmp/page5-bridge-artifact/SHA256SUMS.txt | head -n1)"; fi
          custom_code="$(cat /tmp/custom-page5-bridge-code.txt 2>/dev/null || true)"
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson ok "$ok" \
            --arg apkVersionName "$APK_VERSION_NAME" \
            --argjson apkVersionCode "$APK_VERSION_CODE" \
            --arg apkSha256 "$apk_sha" \
            --arg runtimeVersion "$CANDIDATE_RUNTIME_VERSION" \
            --arg runtimeBranch "$CANDIDATE_BRANCH" \
            --arg implementationBranch "$IMPLEMENTATION_BRANCH" \
            --arg firstSha256 "${{ steps.verify.outputs.first_sha }}" \
            --arg secondSha256 "$SECOND_SHA256" \
            --arg customDomainHttpCode "$custom_code" \
            --arg verify "${{ steps.verify.outcome }}" \
            --arg runtime "${{ steps.runtime.outcome }}" \
            --arg source "${{ steps.source.outcome }}" \
            --arg deploy "${{ steps.deploy.outcome }}" \
            --arg probe "${{ steps.probe.outcome }}" \
            --arg clientPatch "${{ steps.client_patch.outcome }}" \
            --arg apk "${{ steps.apk.outcome }}" \
            --arg artifact "${{ steps.artifact.outcome }}" \
            '{schemaVersion:1,generatedAt:$generatedAt,runId:$runId,ok:$ok,apk:{versionName:$apkVersionName,versionCode:$apkVersionCode,sha256:$apkSha256},runtime:{version:$runtimeVersion,branch:$runtimeBranch},implementationBranch:$implementationBranch,files:{firstSha256:$firstSha256,secondSha256:$secondSha256},probe:{worker:true,customDomainHttpCode:$customDomainHttpCode},browserGate:{persistedFivePage:true,persistedRepeatReentry:true},isolation:{androidMainActivityChanged:false,clientNetworkHostsChanged:false,productionDefaultChannelChanged:false},steps:{verify:$verify,runtime:$runtime,source:$source,deploy:$deploy,probe:$probe,clientPatch:$clientPatch,apk:$apk,artifact:$artifact},secretsExposed:false}' \
            > /tmp/PAGE5_BRIDGE_CANDIDATE_STATUS.json

          git fetch origin "$IMPLEMENTATION_BRANCH" --quiet
          git reset --hard "origin/${IMPLEMENTATION_BRANCH}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs
          cp /tmp/PAGE5_BRIDGE_CANDIDATE_STATUS.json docs/PAGE5_BRIDGE_CANDIDATE_STATUS.json
          git add docs/PAGE5_BRIDGE_CANDIDATE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record isolated page five bridge candidate'
            git push origin "HEAD:${IMPLEMENTATION_BRANCH}"
          fi
          [[ "$ok" == true ]]
