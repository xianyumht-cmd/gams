name: Diagnose Android release keystore

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-android-keystore.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build release input
        id: build
        continue-on-error: true
        working-directory: v2/android
        run: gradle --no-daemon :client:clean :client:assembleRelease

      - name: Decode keystore
        id: decode
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GG_RELEASE_KEYSTORE_BASE64:-}"
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/gg-release.jks
          test -s /tmp/gg-release.jks
          file /tmp/gg-release.jks > /tmp/keystore-file.txt
          stat -c '%s' /tmp/gg-release.jks > /tmp/keystore-size.txt

      - name: Inspect alias and certificate
        id: inspect
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          keytool -list -v \
            -keystore /tmp/gg-release.jks \
            -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" \
            -alias gg-release > /tmp/keytool.txt 2>&1
          grep -Fq 'Alias name: gg-release' /tmp/keytool.txt

      - name: Attempt APK signing
        id: sign
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$unsigned" && test -s "$unsigned"
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner"
          "$apksigner" sign \
            --ks /tmp/gg-release.jks \
            --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out /tmp/diagnostic-signed.apk \
            "$unsigned" > /tmp/apksigner-sign.txt 2>&1
          test -s /tmp/diagnostic-signed.apk
          "$apksigner" verify --verbose --print-certs /tmp/diagnostic-signed.apk \
            > /tmp/apksigner-verify.txt 2>&1

      - name: Record sanitized keystore diagnosis
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          DECODE_OUTCOME: ${{ steps.decode.outcome }}
          INSPECT_OUTCOME: ${{ steps.inspect.outcome }}
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          names = ['keystore-file', 'keytool', 'apksigner-sign', 'apksigner-verify']
          output = []
          for name in names:
              path = Path('/tmp/' + name + '.txt')
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8', errors='replace')[-5000:]
              text = re.sub(r'(?i)(password|storepass|keypass)\s*[:=]\s*\S+', r'\1:<redacted>', text)
              text = re.sub(r'[A-Za-z0-9_+/=-]{80,}', '<redacted>', text)
              output.append(f'===== {name} =====\n{text}')
          Path('/tmp/keystore-diagnosis.log').write_text('\n'.join(output), encoding='utf-8')
          PY
          ok=false
          if [[ "$BUILD_OUTCOME" == "success" && "$DECODE_OUTCOME" == "success" \
             && "$INSPECT_OUTCOME" == "success" && "$SIGN_OUTCOME" == "success" ]]; then ok=true; fi
          size="$(cat /tmp/keystore-size.txt 2>/dev/null || printf '0')"
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg build "$BUILD_OUTCOME" \
            --arg decode "$DECODE_OUTCOME" \
            --arg inspect "$INSPECT_OUTCOME" \
            --arg sign "$SIGN_OUTCOME" \
            --argjson keystoreBytes "$size" \
            --rawfile log /tmp/keystore-diagnosis.log \
            --argjson ok "$ok" \
            '{schemaVersion:1,generatedAt:$generatedAt,triggerCommit:$commit,ok:$ok,keystoreBytes:$keystoreBytes,steps:{build:$build,decode:$decode,inspectAlias:$inspect,signAndVerify:$sign},sanitizedLog:$log,secretsExposed:false}' \
            > /tmp/keystore-status.json
          path="docs/ANDROID_KEYSTORE_DIAGNOSIS.json"
          content="$(base64 -w0 /tmp/keystore-status.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record Android keystore diagnosis' -f content="$content" \
              -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record Android keystore diagnosis' -f content="$content" \
              -f branch=main >/dev/null
          fi

      - name: Require working keystore
        if: always()
        run: |
          test "${{ steps.build.outcome }}" = "success"
          test "${{ steps.decode.outcome }}" = "success"
          test "${{ steps.inspect.outcome }}" = "success"
          test "${{ steps.sign.outcome }}" = "success"
