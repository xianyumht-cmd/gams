name: Apply verified APK signing correction

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-android-keystore.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct and retrigger Runtime rotation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/rotate-runtime-release-and-build-client.yml')
          text = path.read_text(encoding='utf-8')
          changes = [
              ('--v1-signing-enabled true', '--v1-signing-enabled false'),
              ("          grep -Fq 'Verified using v1 scheme (JAR signing): true' /tmp/apk-verify.txt\n", ''),
              ("sed -n 's/^Signer #1 certificate SHA-256 digest: //p'", "sed -n 's/^.*certificate SHA-256 digest: //p'"),
          ]
          for old, new in changes:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Rotation workflow mismatch for {old!r}: {count}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/diagnose-android-keystore.yml
          rm -f .github/workflows/patch-rotation-apk-signing.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A .github/workflows
          git commit -m "Accept verified v2 v3 APK signing"
          git pull --rebase origin main
          git push origin HEAD:main
