name: Probe page five uncaught purchase exception

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/prepare_page5_purchase_uncaught_exception_scope_probe.py
      - scripts/page5_purchase_uncaught_exception.trigger
      - .github/workflows/probe-page5-purchase-uncaught-exception.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-purchase-uncaught-exception-20260806
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      IMPLEMENTATION_REF: fix/page5-missing-constructor-mobile-bridge-20260806
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: /tmp/persisted-game-1.0.5.js
      GENERATED_PROBE: scripts/run_page5_purchase_uncaught_exception.generated.mjs
      OUTPUT_DIR: page5-purchase-uncaught-exception

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read persisted implementation files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$IMPLEMENTATION_REF:refs/remotes/origin/$IMPLEMENTATION_REF"
          git show "origin/$IMPLEMENTATION_REF:game-engine/release/game-1.0.5.js" > "$CURRENT_SECOND_PATH"
          git show "origin/$IMPLEMENTATION_REF:scripts/prepare_persisted_repeat_reentry_matrix.py" > scripts/prepare_persisted_repeat_reentry_matrix.py
          test "$(sha256sum "$CURRENT_SECOND_PATH" | awk '{print $1}')" = "9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca"

      - name: Prepare uncaught exception probe
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/prepare_five_page_missing_constructor_matrix.py \
            scripts/prepare_page5_repeat_reentry_matrix.py \
            scripts/prepare_persisted_repeat_reentry_matrix.py \
            scripts/prepare_page5_purchase_action_probe.py \
            scripts/prepare_page5_purchase_exception_scope_probe.py \
            scripts/prepare_page5_purchase_uncaught_exception_scope_probe.py
          python3 scripts/prepare_page5_purchase_uncaught_exception_scope_probe.py --output "$GENERATED_PROBE"
          node --check "$GENERATED_PROBE"
          grep -Fq 'state: "uncaught"' "$GENERATED_PROBE"
          grep -Fq 'tpUndefined' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute uncaught exception probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/page5-purchase-uncaught-exception.log

      - name: Build compact status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-purchase-uncaught-exception.log && cp /tmp/page5-purchase-uncaught-exception.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          p = Path(os.environ['OUTPUT_DIR']) / 'report.json'
          report = json.loads(p.read_text(encoding='utf-8')) if p.exists() else None
          cases = (report or {}).get('cases') or []
          case = cases[0] if cases else {}
          attempts = ((case.get('purchaseProbe') or {}).get('attempts') or [])
          attempt = attempts[0] if attempts else {}
          trace = attempt.get('exceptionTrace') or None
          description = (((trace or {}).get('data') or {}).get('description') or '')
          script = (trace or {}).get('script') or None
          target = 'userRealName' in description and 'TypeError' in description
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': bool(report) and bool(trace) and target and bool(script),
              'mode': 'page5-purchase-uncaught-exception-scope',
              'targetExceptionCaptured': target,
              'description': description,
              'evaluations': (trace or {}).get('evaluations') or {},
              'callFrames': (trace or {}).get('callFrames') or [],
              'script': script,
              'pageErrors': attempt.get('pageErrors') or case.get('pageErrors') or [],
              'blockedOrderCount': len(attempt.get('blockedOrders') or []),
              'productDetailObserved': bool((report or {}).get('productDetailObserved')),
              'purchaseActionReached': bool((report or {}).get('purchaseActionReached')),
              'realOrderRequestsAllowed': False,
              'paymentCompleted': False,
              'authorizationOutcomeModified': False,
              'productionDefaultChanged': False,
              'androidClientChanged': False,
              'apkBuilt': False,
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_PURCHASE_UNCAUGHT_EXCEPTION_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps({
              'ok': status['ok'],
              'targetExceptionCaptured': target,
              'description': description[:300],
              'evaluationNames': sorted(status['evaluations'].keys()),
              'scriptLocation': ({k: script.get(k) for k in ('lineNumber','columnNumber','absoluteIndex')} if script else None),
              'blockedOrderCount': status['blockedOrderCount'],
          }, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-purchase-uncaught-exception
          path: |
            page5-purchase-uncaught-exception
            /tmp/PAGE5_PURCHASE_UNCAUGHT_EXCEPTION_STATUS.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/prepare_persisted_repeat_reentry_matrix.py "$GENERATED_PROBE"
          mkdir -p docs
          cp /tmp/PAGE5_PURCHASE_UNCAUGHT_EXCEPTION_STATUS.json docs/PAGE5_PURCHASE_UNCAUGHT_EXCEPTION_STATUS.json
          git add docs/PAGE5_PURCHASE_UNCAUGHT_EXCEPTION_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record uncaught final purchase exception scope"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce target exception gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_PURCHASE_UNCAUGHT_EXCEPTION_STATUS.json >/dev/null
