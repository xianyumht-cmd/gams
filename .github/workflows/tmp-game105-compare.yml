name: Temporary game 1.0.5 fixed comparison

on:
  push:
    branches:
      - tmp/game-105-fixed-diff-20260904
    paths:
      - .github/workflows/tmp-game105-compare.yml

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/game-105-fixed-diff-20260904
      - name: Diagnose signatures
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json, difflib

          result = {}
          parts = [Path(f'.tmp/fixed40.part{i}').read_text().strip() for i in range(1, 6)]
          joined = ''.join(parts)
          result['part_lengths'] = [len(x) for x in parts]
          result['joined_length'] = len(joined)
          result['joined_sha256'] = hashlib.sha256(joined.encode()).hexdigest()
          try:
              raw = base64.b64decode(joined, validate=True)
              result['decoded_length'] = len(raw)
              fixed_sigs = [raw[i:i+5] for i in range(0, len(raw), 5)]
              result['fixed_sig_count'] = len(fixed_sigs)
          except Exception as e:
              result['decode_error'] = repr(e)
              fixed_sigs = []

          data = Path('game-engine/release/game-1.0.5.js').read_bytes()
          chunks = []
          start = 0
          h = 0
          for i, b in enumerate(data):
              h = ((h * 257) + b + 1) & ((1 << 64) - 1)
              size = i + 1 - start
              if size >= 2048 and ((h & 4095) == 0 or size >= 8192):
                  part = data[start:i+1]
                  chunks.append((start, i+1, hashlib.sha256(part).digest()[:5]))
                  start = i + 1
                  h = 0
          if start < len(data):
              part = data[start:]
              chunks.append((start, len(data), hashlib.sha256(part).digest()[:5]))
          result['baseline_size'] = len(data)
          result['baseline_sha256'] = hashlib.sha256(data).hexdigest()
          result['baseline_chunks'] = len(chunks)

          if fixed_sigs and all(len(x) == 5 for x in fixed_sigs):
              ops = difflib.SequenceMatcher(a=[c[2] for c in chunks], b=fixed_sigs, autojunk=False).get_opcodes()
              result['change_opcodes'] = [[tag,i1,i2,j1,j2] for tag,i1,i2,j1,j2 in ops if tag != 'equal']
              result['opcode_count'] = len(ops)

          Path('.tmp/compare-diagnostic.json').write_text(json.dumps(result,separators=(',',':')),encoding='utf-8')
          print(result)
      - name: Commit diagnostic
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/compare-diagnostic.json
          git commit -m "chore: record temporary fixed comparison diagnostic"
          git push origin HEAD:tmp/game-105-fixed-diff-20260904
