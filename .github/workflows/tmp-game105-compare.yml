name: Temporary game 1.0.5 fixed comparison

on:
  push:
    branches:
      - tmp/game-105-fixed-diff-20260904
    paths:
      - .github/workflows/tmp-game105-compare.yml

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/game-105-fixed-diff-20260904
          fetch-depth: 0
      - name: Probe historical baselines
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json, difflib, subprocess

          joined = ''.join(Path(f'.tmp/fixed40.part{i}').read_text().strip() for i in range(1, 6))
          assert len(joined) == 14780
          assert hashlib.sha256(joined.encode()).hexdigest() == 'e3d40ab7dffcd812e2089720f851c386265c50f21ed77de0959a110ad363820e'
          raw = base64.b64decode(joined, validate=True)
          fixed = [raw[i:i+5] for i in range(0, len(raw), 5)]
          assert len(fixed) == 2217 and all(len(x) == 5 for x in fixed)

          def chunk_sigs(data):
              out=[]; start=0; h=0
              for i,b in enumerate(data):
                  h=((h*257)+b+1)&((1<<64)-1)
                  size=i+1-start
                  if size>=2048 and ((h&4095)==0 or size>=8192):
                      part=data[start:i+1]
                      out.append(hashlib.sha256(part).digest()[:5])
                      start=i+1; h=0
              if start<len(data):
                  out.append(hashlib.sha256(data[start:]).digest()[:5])
              return out

          path='game-engine/release/game-1.0.5.js'
          commits=subprocess.check_output(['git','rev-list','--all','--',path],text=True).splitlines()
          rows=[]
          for commit in commits:
              try:
                  data=subprocess.check_output(['git','show',f'{commit}:{path}'])
              except subprocess.CalledProcessError:
                  continue
              sigs=chunk_sigs(data)
              matcher=difflib.SequenceMatcher(a=sigs,b=fixed,autojunk=False)
              blocks=matcher.get_matching_blocks()
              matched=sum(b.size for b in blocks)
              rows.append({
                  'commit':commit,
                  'size':len(data),
                  'sha256':hashlib.sha256(data).hexdigest(),
                  'chunks':len(sigs),
                  'matched_chunks':matched,
                  'ratio':matcher.ratio(),
                  'change_opcodes':sum(1 for op in matcher.get_opcodes() if op[0]!='equal'),
              })
          rows.sort(key=lambda r:(r['matched_chunks'],r['ratio']),reverse=True)
          result={'candidate_count':len(rows),'top':rows[:20]}
          Path('.tmp/history-probe.json').write_text(json.dumps(result,separators=(',',':')),encoding='utf-8')
          print(result)
      - name: Commit history probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .tmp/history-probe.json
          git commit -m "chore: record temporary historical engine probe"
          git push origin HEAD:tmp/game-105-fixed-diff-20260904
