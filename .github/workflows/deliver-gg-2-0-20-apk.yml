name: Deliver GG 2.0.22 APK

on:
  workflow_run:
    workflows:
      - Build two Android APKs
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: deliver-gg-2-0-22-apk
  cancel-in-progress: false

jobs:
  deliver:
    if: github.event.workflow_run.head_branch == 'fix/page5-missing-constructor-mobile-bridge-20260806'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout v2 implementation
        uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          path: source
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build sign and verify v2 APK
        id: build
        env:
          GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
          GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
        run: bash scripts/run-gg-2.0.22-build.sh

      - name: Upload verified client APK
        id: upload
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.22-mobile-sheet-action-fix-code102
          path: artifact/**
          retention-days: 30
          if-no-files-found: error

      - name: Record delivery status
        if: always()
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_URL: ${{ github.event.workflow_run.html_url }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          DELIVERY_RUN_ID: ${{ github.run_id }}
          DELIVERY_ATTEMPT: ${{ github.run_attempt }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          set -euo pipefail
          apk_sha=''
          if [[ -f artifact/SHA256SUMS.txt ]]; then
            apk_sha="$(awk '{print $1}' artifact/SHA256SUMS.txt | head -n1)"
          fi
          ok=false
          if [[ "$BUILD_OUTCOME" == 'success' && "$UPLOAD_OUTCOME" == 'success' ]]; then
            ok=true
          fi
          export OK="$ok" APK_SHA="$apk_sha"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          artifact_id = os.environ.get('ARTIFACT_ID', '')
          ok = os.environ.get('OK') == 'true'
          payload = {
              'schemaVersion': 4,
              'generatedAt': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'state': 'completed' if ok else 'failed',
              'ok': ok,
              'sourceRunId': int(os.environ['SOURCE_RUN_ID']),
              'sourceRunUrl': os.environ.get('SOURCE_RUN_URL', ''),
              'sourceConclusion': os.environ.get('SOURCE_CONCLUSION', ''),
              'deliveryRunId': int(os.environ['DELIVERY_RUN_ID']),
              'deliveryRunAttempt': int(os.environ['DELIVERY_ATTEMPT']),
              'buildOutcome': os.environ.get('BUILD_OUTCOME', ''),
              'uploadOutcome': os.environ.get('UPLOAD_OUTCOME', ''),
              'artifactId': int(artifact_id) if artifact_id else None,
              'artifactUrl': os.environ.get('ARTIFACT_URL', ''),
              'apk': {
                  'fileName': 'GG-2.0.22-mobile-sheet-action-fix-code102.apk',
                  'package': 'com.jinli.quickweb',
                  'versionName': '2.0.22-mobile-sheet-action-fix',
                  'versionCode': 102,
                  'sha256': os.environ.get('APK_SHA', ''),
              },
              'changes': {
                  'panelStructure': 'mobile-bottom-sheet-v4',
                  'floatingControl': 'mobile-squircle-v4',
                  'repeatActionTransport': 'synchronous-jsonp-and-virtual-xhr-v4',
              },
              'sourceBranch': 'fix/page5-missing-constructor-mobile-bridge-20260806',
              'secretsExposed': False,
          }
          with open('/tmp/GG_2_0_22_DELIVERY_STATUS.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY

          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p docs
          cp /tmp/GG_2_0_22_DELIVERY_STATUS.json docs/GG_2_0_22_DELIVERY_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/GG_2_0_22_DELIVERY_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record GG 2.0.22 APK delivery result'
            git push origin HEAD:main
          fi
          [[ "$ok" == true ]]
