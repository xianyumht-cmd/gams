name: Probe page five input registrations

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_input_registration_probe.mjs
      - .github/workflows/run-page5-input-registration-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-input-registration-probe-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      OUTPUT_DIR: page5-input-registration-probe

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate registration probe
        shell: bash
        run: node --check scripts/run_page5_input_registration_probe.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute registration probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_page5_input_registration_probe.mjs 2>&1 | tee /tmp/page5-input-registration-probe.log

      - name: Build probe status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-input-registration-probe.log && cp /tmp/page5-input-registration-probe.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          inventories = report.get('listenerInventories', []) if report else []
          listeners = []
          for inventory in inventories:
              for listener in inventory.get('listeners', []):
                  listeners.append({
                      'target': inventory.get('label'),
                      'type': listener.get('type'),
                      'scriptId': listener.get('scriptId'),
                      'lineNumber': listener.get('lineNumber'),
                      'columnNumber': listener.get('columnNumber'),
                      'handler': listener.get('handler'),
                  })
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-input-registration-read-only-probe',
              'inventoryCounts': {item.get('label'): len(item.get('listeners', [])) for item in inventories},
              'listenerTypeCounts': report.get('listenerTypeCounts') if report else None,
              'registrationCount': len((report.get('registrationAfter') or {}).get('registrations', [])) if report else None,
              'registrationTypeCounts': report.get('registrationTypeCounts') if report else None,
              'menuEventTypes': [item.get('type') for item in report.get('menuEvents', [])] if report else None,
              'listeners': listeners,
              'propertyHandlersBefore': report.get('propertyHandlersBefore') if report else None,
              'menuScreenshotChanged': report.get('menuScreenshotChanged') if report else None,
              'mainFrameValid': report.get('mainFrameValid') if report else None,
              'pageErrorCount': len(report.get('pageErrors', [])) if report else None,
              'blockedOrderCount': len(report.get('blockedOrders', [])) if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'page5-input-registration-probe',
              'readOnlyProbe': True,
              'candidateTested': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_INPUT_REGISTRATION_PROBE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-input-registration-probe
          path: page5-input-registration-probe
          retention-days: 30
          if-no-files-found: warn

      - name: Publish probe status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_INPUT_REGISTRATION_PROBE_STATUS.json docs/PAGE5_INPUT_REGISTRATION_PROBE_STATUS.json
          git add docs/PAGE5_INPUT_REGISTRATION_PROBE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five input registrations"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce registration capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_INPUT_REGISTRATION_PROBE_STATUS.json >/dev/null
