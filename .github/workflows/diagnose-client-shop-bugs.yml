name: Diagnose client and shop bugs

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/diagnose-client-shop-bugs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inspect Android navigation and shop sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gams-diagnosis
          {
            echo '===== FILE TREE: remote-script ====='
            find remote-script -maxdepth 4 -type f | sort
            echo
            echo '===== FILE TREE: Android client ====='
            find v2/android/client/src/main/java -type f | sort
            echo
            echo '===== MAINACTIVITY NAVIGATION ====='
            grep -n -C 12 -E 'setSupportMultipleWindows|setJavaScriptCanOpenWindowsAutomatically|shouldOverrideUrlLoading|onCreateWindow|ACTION_VIEW|window.open' \
              v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java || true
            echo
            echo '===== SHOP / LOGIN / PURCHASE MATCHES ====='
            grep -RInE --include='*.js' --include='*.mjs' --include='*.ts' --include='*.json' \
              '商城|购买|领取|橙光|登录|login|buy|purchase|order|window\.open|location\.(href|assign|replace)|target.?=.?("|\x27)_blank' \
              remote-script scripts game-engine 2>/dev/null | head -n 4000 || true
            echo
            echo '===== NON-RELEASE REMOTE SCRIPT FILES ====='
            find remote-script -type f ! -path '*/release/*' -maxdepth 5 -print -exec sh -c 'echo "--- $1"; wc -c "$1"; head -n 40 "$1" 2>/dev/null || true' _ {} \;
          } > /tmp/gams-diagnosis/report.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          text = Path('/tmp/gams-diagnosis/report.txt').read_text(encoding='utf-8', errors='replace')
          Path('/tmp/gams-diagnosis/report.json').write_text(json.dumps({
              'schemaVersion': 1,
              'ok': True,
              'report': text[-180000:],
              'secretsExposed': False,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Publish diagnosis report
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          path='docs/CLIENT_SHOP_BUG_DIAGNOSIS.json'
          content="$(base64 -w0 /tmp/gams-diagnosis/report.json)"
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record client and shop bug diagnosis' \
              -f content="$content" -f sha="$existing" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record client and shop bug diagnosis' \
              -f content="$content" -f branch=main >/dev/null
          fi

