name: Relay JS runtime stability APK

on:
  workflow_run:
    workflows:
      - Build isolated page five bridge candidate
    types:
      - completed

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.id == 31041269145 &&
      github.event.workflow_run.run_attempt >= 2 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Dispatch signed 2.0.14 stability build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-js-runtime-stability-apk.yml --repo "$GITHUB_REPOSITORY" --ref main
