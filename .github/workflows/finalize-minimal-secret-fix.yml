name: Finalize minimal License Runtime secret repair

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-minimal-secret-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: finalize-minimal-secret-fix
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.LICENSE_ADMIN_PASSWORD }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      LICENSE_ENDPOINT: https://gams-license-api.2320006072.workers.dev
      RUNTIME_ENDPOINT: https://gams-runtime-v2.2320006072.workers.dev
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate inputs
        id: inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_LOGIN_SECRET TOKEN_SIGNING_SECRET RUNTIME_MASTER_KEY; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          test "${#TOKEN_SIGNING_SECRET}" -ge 32
          node --input-type=module - <<'NODE'
          import { decodeRuntimeMasterKey } from "./v2/runtime/src/runtime-key.js";
          const bytes = decodeRuntimeMasterKey(process.env.RUNTIME_MASTER_KEY);
          bytes.fill(0);
          NODE
          node --check scripts/v2-lifecycle-smoke.mjs

      - name: Patch both Workers exactly
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          license_path = Path("license-api/src/index.js")
          license = license_path.read_text(encoding="utf-8")
          license_functions = [
              "adminLogin",
              "adminCreateLicenses",
              "adminListLicenses",
              "adminLicenseAction",
              "issueChallenge",
              "activate",
              "check",
              "selfUnbind",
          ]
          for function in license_functions:
              old = f"        return {function}(request, env);"
              new = f"        return await {function}(request, env);"
              count = license.count(old)
              if count != 1:
                  raise SystemExit(f"License source mismatch for {function}: {count}")
              license = license.replace(old, new)
          license_path.write_text(license, encoding="utf-8")

          runtime_path = Path("v2/runtime/src/index.js")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime_replacements = {
              "        return issueChallenge(request, env);":
                  "        return await issueChallenge(request, env);",
              "        return runtimeAccess(request, env);":
                  "        return await runtimeAccess(request, env);",
              "        return runtimeBundle(request, env);":
                  "        return await runtimeBundle(request, env);",
              '      legacyRuntimePassword: env.LEGACY_RUNTIME_PASSWORD || "",':
                  '      legacyRuntimePassword: env.ADMIN_PASSWORD || env.LEGACY_RUNTIME_PASSWORD || "",',
          }
          for old, new in runtime_replacements.items():
              count = runtime.count(old)
              if count != 1:
                  raise SystemExit(f"Runtime source mismatch for {old!r}: {count}")
              runtime = runtime.replace(old, new)
          runtime_path.write_text(runtime, encoding="utf-8")
          PY
          node --check license-api/src/index.js
          node --check v2/runtime/src/index.js
          node --check v2/runtime/src/runtime-key.js
          test "$(grep -c 'return await .*request, env' license-api/src/index.js)" = "8"
          grep -Fq 'return await runtimeAccess' v2/runtime/src/index.js
          grep -Fq 'env.ADMIN_PASSWORD || env.LEGACY_RUNTIME_PASSWORD' v2/runtime/src/index.js

      - name: Locate shared D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          database_id="$(printf '%s' "$response" | jq -r '.result[] | select(.name=="gams-license-db") | (.uuid // .id)' | head -n1)"
          test -n "$database_id" && test "$database_id" != "null"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Generate Worker configurations
        shell: bash
        run: |
          set -euo pipefail
          sed "s/__D1_DATABASE_ID__/${{ steps.d1.outputs.database_id }}/g" \
            license-api/wrangler.template.jsonc > license-api/wrangler.generated.jsonc
          sed "s/__D1_DATABASE_ID__/${{ steps.d1.outputs.database_id }}/g" \
            v2/runtime/wrangler.template.jsonc > v2/runtime/wrangler.generated.jsonc

      - name: Configure License secrets
        id: license_secrets
        working-directory: license-api
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_LOGIN_SECRET" \
            | npx --yes wrangler@4 secret put ADMIN_LOGIN_SECRET --config wrangler.generated.jsonc
          printf '%s' "$TOKEN_SIGNING_SECRET" \
            | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.generated.jsonc

      - name: Configure Runtime split secrets
        id: runtime_secrets
        working-directory: v2/runtime
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TOKEN_SIGNING_SECRET" \
            | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.generated.jsonc
          printf '%s' "$RUNTIME_MASTER_KEY" \
            | npx --yes wrangler@4 secret put RUNTIME_MASTER_KEY --config wrangler.generated.jsonc
          echo "Existing ADMIN_PASSWORD and LEGACY_RUNTIME_PASSWORD were not changed or deleted."

      - name: Apply existing D1 migrations
        working-directory: license-api
        run: npx --yes wrangler@4 d1 migrations apply gams-license-db --remote --config wrangler.generated.jsonc

      - name: Deploy patched License Worker
        id: license_deploy
        working-directory: license-api
        run: npx --yes wrangler@4 deploy --config wrangler.generated.jsonc

      - name: Deploy patched Runtime V3 Worker
        id: runtime_deploy
        working-directory: v2/runtime
        run: npx --yes wrangler@4 deploy --config wrangler.generated.jsonc

      - name: Wait for both services
        id: health
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 36); do
            license_status="$(curl -sS -o /tmp/license-health.json -w '%{http_code}' "$LICENSE_ENDPOINT/health" || true)"
            runtime_status="$(curl -sS -o /tmp/runtime-health.json -w '%{http_code}' "$RUNTIME_ENDPOINT/health" || true)"
            if [[ "$license_status" == "200" && "$runtime_status" == "200" ]] \
              && jq -e '.ok and .version == 2 and .signedProtocol == true' /tmp/license-health.json >/dev/null \
              && jq -e '.ok and .version == 3 and .splitSecrets == true and .legacyReleaseCompatible == true' /tmp/runtime-health.json >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          cat /tmp/license-health.json 2>/dev/null || true
          cat /tmp/runtime-health.json 2>/dev/null || true
          exit 1

      - name: Run complete signed V2 lifecycle
        id: lifecycle
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/v2-lifecycle-smoke.mjs 2>&1 | tee /tmp/lifecycle.log

      - name: Make canonical Runtime workflow source-native
        id: canonical
        if: steps.lifecycle.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          path = Path(".github/workflows/v2-deploy-runtime.yml")
          text = path.read_text(encoding="utf-8")
          pattern = re.compile(
              r"      - name: Preserve legacy runtime decryption and async error handling\n"
              r".*?"
              r"(?=      - name: Locate shared license D1 database\n)",
              re.S,
          )
          replacement = (
              "      - name: Validate Runtime V3 source compatibility\n"
              "        id: patch\n"
              "        shell: bash\n"
              "        run: |\n"
              "          set -euo pipefail\n"
              "          node --check v2/runtime/src/index.js\n"
              "          node --check v2/runtime/src/runtime-key.js\n"
              "          grep -Fq 'return await runtimeAccess' v2/runtime/src/index.js\n"
              "          grep -Fq 'env.ADMIN_PASSWORD || env.LEGACY_RUNTIME_PASSWORD' v2/runtime/src/index.js\n"
              "          grep -Fq 'env.TOKEN_SIGNING_SECRET' v2/runtime/src/index.js\n\n"
          )
          updated, count = pattern.subn(replacement, text)
          if count != 1:
              raise SystemExit(f"Canonical Runtime workflow block mismatch: {count}")
          path.write_text(updated, encoding="utf-8")
          PY

      - name: Persist verified source fixes
        id: persist
        if: steps.lifecycle.outcome == 'success' && steps.canonical.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add license-api/src/index.js v2/runtime/src/index.js .github/workflows/v2-deploy-runtime.yml
          git commit -m "Finalize minimal License Runtime secret repair"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Record final repair status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          INPUTS_OUTCOME: ${{ steps.inputs.outcome }}
          PATCH_OUTCOME: ${{ steps.patch.outcome }}
          LICENSE_SECRETS_OUTCOME: ${{ steps.license_secrets.outcome }}
          RUNTIME_SECRETS_OUTCOME: ${{ steps.runtime_secrets.outcome }}
          LICENSE_DEPLOY_OUTCOME: ${{ steps.license_deploy.outcome }}
          RUNTIME_DEPLOY_OUTCOME: ${{ steps.runtime_deploy.outcome }}
          HEALTH_OUTCOME: ${{ steps.health.outcome }}
          LIFECYCLE_OUTCOME: ${{ steps.lifecycle.outcome }}
          CANONICAL_OUTCOME: ${{ steps.canonical.outcome }}
          PERSIST_OUTCOME: ${{ steps.persist.outcome }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          source = Path('/tmp/lifecycle.log')
          text = source.read_text(encoding='utf-8', errors='replace') if source.exists() else ''
          text = text[-5000:]
          text = re.sub(r'(?i)(authorization|token|licenseKey|signature)\\?"?\s*[:=]\s*\\?"?[^,}\s]+', r'\1:<redacted>', text)
          text = re.sub(r'[A-Za-z0-9_+/=-]{48,}', '<redacted>', text)
          Path('/tmp/lifecycle-sanitized.log').write_text(text, encoding='utf-8')
          PY
          ok=false
          if [[ "$INPUTS_OUTCOME" == "success" && "$PATCH_OUTCOME" == "success" \
             && "$LICENSE_SECRETS_OUTCOME" == "success" && "$RUNTIME_SECRETS_OUTCOME" == "success" \
             && "$LICENSE_DEPLOY_OUTCOME" == "success" && "$RUNTIME_DEPLOY_OUTCOME" == "success" \
             && "$HEALTH_OUTCOME" == "success" && "$LIFECYCLE_OUTCOME" == "success" \
             && "$CANONICAL_OUTCOME" == "success" && "$PERSIST_OUTCOME" == "success" ]]; then
            ok=true
          fi
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg commit "$GITHUB_SHA" \
            --arg inputs "$INPUTS_OUTCOME" \
            --arg patch "$PATCH_OUTCOME" \
            --arg licenseSecrets "$LICENSE_SECRETS_OUTCOME" \
            --arg runtimeSecrets "$RUNTIME_SECRETS_OUTCOME" \
            --arg licenseDeploy "$LICENSE_DEPLOY_OUTCOME" \
            --arg runtimeDeploy "$RUNTIME_DEPLOY_OUTCOME" \
            --arg health "$HEALTH_OUTCOME" \
            --arg lifecycle "$LIFECYCLE_OUTCOME" \
            --arg canonical "$CANONICAL_OUTCOME" \
            --arg persist "$PERSIST_OUTCOME" \
            --rawfile log /tmp/lifecycle-sanitized.log \
            --argjson ok "$ok" \
            '{schemaVersion:1,generatedAt:$generatedAt,triggerCommit:$commit,ok:$ok,steps:{inputs:$inputs,sourcePatch:$patch,licenseSecrets:$licenseSecrets,runtimeSecrets:$runtimeSecrets,licenseDeploy:$licenseDeploy,runtimeDeploy:$runtimeDeploy,bothServicesHealthy:$health,signedLifecycleAcceptance:$lifecycle,canonicalWorkflowUpdated:$canonical,sourcePersisted:$persist},sanitizedLog:$log,secretsDeleted:false,runtimeAdminPasswordOverwritten:false,cloudflareSecurityRulesChanged:false,apkRebuilt:false,secretsExposed:false}' \
            > /tmp/final-repair-status.json
          path="docs/FINAL_MINIMAL_SECRET_REPAIR_STATUS.json"
          content="$(base64 -w0 /tmp/final-repair-status.json)"
          existing_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          if [[ -n "$existing_sha" ]]; then
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record final minimal secret repair status' -f content="$content" \
              -f sha="$existing_sha" -f branch=main >/dev/null
          else
            gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" \
              -f message='Record final minimal secret repair status' -f content="$content" \
              -f branch=main >/dev/null
          fi

      - name: Require complete final repair
        if: always()
        shell: bash
        run: |
          test "${{ steps.inputs.outcome }}" = "success"
          test "${{ steps.patch.outcome }}" = "success"
          test "${{ steps.license_secrets.outcome }}" = "success"
          test "${{ steps.runtime_secrets.outcome }}" = "success"
          test "${{ steps.license_deploy.outcome }}" = "success"
          test "${{ steps.runtime_deploy.outcome }}" = "success"
          test "${{ steps.health.outcome }}" = "success"
          test "${{ steps.lifecycle.outcome }}" = "success"
          test "${{ steps.canonical.outcome }}" = "success"
          test "${{ steps.persist.outcome }}" = "success"
