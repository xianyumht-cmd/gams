name: Compare page five current menu contract

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/compare_page5_official_menu_contract.mjs
      - .github/workflows/compare-page5-official-menu-contract.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-official-menu-contract-compare-20260805
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OUTPUT_DIR: page5-official-menu-contract-compare
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate comparison inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CURRENT_SECOND_PATH"
          node --check scripts/compare_page5_official_menu_contract.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Capture and compare bounded menu contract
        id: compare_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/compare_page5_official_menu_contract.mjs 2>&1 | tee /tmp/page5-official-menu-contract-compare.log

      - name: Build comparison status
        if: always()
        shell: bash
        env:
          COMPARE_OUTCOME: ${{ steps.compare_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-official-menu-contract-compare.log && cp /tmp/page5-official-menu-contract-compare.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output_dir = Path(os.environ['OUTPUT_DIR'])
          report_path = output_dir / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          official = report.get('official', {}) if report else {}
          current = report.get('current', {}) if report else {}
          comparison = report.get('comparison', {}) if report else {}
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('COMPARE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('COMPARE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-official-menu-contract-bounded-compare',
              'capture': report.get('capture') if report else None,
              'official': {
                  'size': official.get('size'),
                  'sha256': official.get('sha256'),
                  'counts': official.get('counts'),
                  'patternCounts': official.get('patternCounts'),
              } if report else None,
              'current': {
                  'size': current.get('size'),
                  'sha256': current.get('sha256'),
                  'counts': current.get('counts'),
                  'patternCounts': current.get('patternCounts'),
              } if report else None,
              'comparison': comparison,
              'boundedContextsAvailable': bool(report),
              'fullOfficialBodyCommitted': False,
              'artifactName': 'page5-official-menu-contract-compare',
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_OFFICIAL_MENU_CONTRACT_COMPARE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-official-menu-contract-compare
          path: page5-official-menu-contract-compare
          retention-days: 30
          if-no-files-found: warn

      - name: Publish branch comparison status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_OFFICIAL_MENU_CONTRACT_COMPARE_STATUS.json docs/PAGE5_OFFICIAL_MENU_CONTRACT_COMPARE_STATUS.json
          git add docs/PAGE5_OFFICIAL_MENU_CONTRACT_COMPARE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five current menu contract comparison"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce comparison capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_OFFICIAL_MENU_CONTRACT_COMPARE_STATUS.json >/dev/null
