name: Publish GG V2 encrypted runtime

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: New V2 runtime version, for example 2.0.3
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-production-runtime
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      RELEASE_SIGNING_PASSWORD: ${{ secrets.RELEASE_SIGNING_PASSWORD || secrets.LICENSE_ADMIN_PASSWORD }}
      VERSION_NAME: ${{ inputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate release secrets and version
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNTIME_MASTER_KEY:-}" || { echo "RUNTIME_MASTER_KEY is missing"; exit 1; }
          test -n "${RELEASE_SIGNING_PASSWORD:-}" || { echo "RELEASE_SIGNING_PASSWORD is missing"; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]
          node --input-type=module - <<'NODE'
          import { decodeRuntimeMasterKey } from "./v2/runtime/src/runtime-key.js";
          const bytes = decodeRuntimeMasterKey(process.env.RUNTIME_MASTER_KEY);
          bytes.fill(0);
          NODE
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          new = os.environ["VERSION_NAME"]
          old = json.loads(Path("v2/runtime/release/manifest.json").read_text())["versionName"]
          def key(value):
              numbers = [int(item) for item in re.findall(r"\d+", value)[:3]]
              return tuple(numbers + [0] * (3 - len(numbers)))
          if key(new) <= key(old):
              raise SystemExit(f"new V2 runtime {new} must be higher than {old}")
          print("publishing", new, "over", old)
          PY

      - name: Locate signed source releases
        shell: bash
        run: |
          set -euo pipefail
          script_file="$(jq -r '.file' remote-script/release/manifest.json)"
          game_file="$(jq -r '.file' game-engine/release/manifest.json)"
          test -s "remote-script/release/${script_file}"
          test -s "game-engine/release/${game_file}"
          printf '%s\n' "$script_file" > /tmp/v2-script-file
          printf '%s\n' "$game_file" > /tmp/v2-game-file

      - name: Build encrypted runtime release
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          script_file="$(cat /tmp/v2-script-file)"
          game_file="$(cat /tmp/v2-game-file)"
          python3 v2/runtime/tools/build_release.py \
            "remote-script/release/${script_file}" \
            "game-engine/release/${game_file}" \
            "$VERSION_NAME" \
            "$RUNTIME_MASTER_KEY" \
            v2/runtime/release

      - name: Sign and verify encrypted release
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f /tmp/v2-private.pem /tmp/v2-runtime.sig /tmp/v2-runtime-canonical.txt /tmp/v2-runtime-unsigned.json' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in remote-script/keys/private.pem.enc \
            -out /tmp/v2-private.pem \
            -pass env:RELEASE_SIGNING_PASSWORD
          openssl dgst -sha256 -sign /tmp/v2-private.pem \
            -out /tmp/v2-runtime.sig /tmp/v2-runtime-canonical.txt
          openssl dgst -sha256 -verify remote-script/keys/public.pem \
            -signature /tmp/v2-runtime.sig /tmp/v2-runtime-canonical.txt
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("/tmp/v2-runtime-unsigned.json").read_text())
          manifest["signatureAlgorithm"] = "SHA256withECDSA"
          manifest["signature"] = base64.b64encode(Path("/tmp/v2-runtime.sig").read_bytes()).decode()
          release = Path("v2/runtime/release")
          (release / "manifest.json").write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          bundle = (release / manifest["file"]).read_bytes()
          assert len(bundle) == manifest["size"]
          assert hashlib.sha256(bundle).hexdigest() == manifest["sha256"]
          forbidden = [b"webpackChunk_lodash_modules", b"SAL_getUserData", b"createBuyOrder", b"get_goods_list"]
          assert all(marker not in bundle for marker in forbidden)
          print("encrypted V2 release verified:", manifest["versionName"], len(bundle))
          PY
          node --input-type=module - <<'NODE'
          import { readFileSync } from "node:fs";
          import { decryptRuntimeContentKey } from "./v2/runtime/src/runtime-key.js";
          const manifest = JSON.parse(readFileSync("v2/runtime/release/manifest.json", "utf8"));
          const key = await decryptRuntimeContentKey(manifest, {
            runtimeMasterKey: process.env.RUNTIME_MASTER_KEY,
          });
          if (key.byteLength !== 32) throw new Error("generated release key validation failed");
          key.fill(0);
          NODE

      - name: Commit release to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add v2/runtime/release/manifest.json
          git add -f "v2/runtime/release/bundle-${VERSION_NAME}.bin"
          git commit -m "Publish encrypted V2 runtime ${VERSION_NAME}"
          git pull --rebase origin main
          git push origin HEAD:main
