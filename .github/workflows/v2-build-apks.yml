name: Hold after corrected production release trigger

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/v2-build-apks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Corrected production release was triggered by this workflow update.'
