name: Trigger corrected white-screen and repeat-action release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v2-build-apks.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch verification correction
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/patch-release-verification.yml/dispatches" \
            -f ref=main
