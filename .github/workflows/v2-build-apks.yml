name: Build GG 2.0.3 formal client release

on:
  push:
    branches:
      - main
    paths:
      - v2/android/client/**
      - v2/android/build.gradle.kts
      - v2/android/settings.gradle.kts
      - v2/android/gradle.properties
      - .github/workflows/v2-build-apks.yml
  pull_request:
    branches:
      - main
    paths:
      - v2/android/client/**
      - v2/android/build.gradle.kts
      - v2/android/settings.gradle.kts
      - v2/android/gradle.properties
      - .github/workflows/v2-build-apks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-client:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build formal GG 2.0.3 client
        working-directory: v2/android
        run: gradle --no-daemon :client:clean :client:lintRelease :client:assembleRelease

      - name: Verify unsigned release input
        shell: bash
        run: |
          set -euo pipefail
          client="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -n "$client" && test -s "$client"

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x | sort -V | tail -n1)"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x | sort -V | tail -n1)"
          test -x "$aapt" && test -x "$apksigner"

          badging="$($aapt dump badging "$client")"
          printf '%s\n' "$badging" | grep -Fq "package: name='com.jinli.quickweb' versionCode='12' versionName='2.0.3'"
          printf '%s\n' "$badging" | grep -Fq "application-label:'GG'"

          if "$apksigner" verify "$client" >/tmp/gg-client-signature.txt 2>&1; then
            echo 'Formal build input must remain unsigned before production signing.'
            exit 1
          fi

          rm -rf /tmp/gg-2.0.3-release
          mkdir -p /tmp/gg-2.0.3-release
          cp "$client" /tmp/gg-2.0.3-release/GG-2.0.3-code12-固定签名前.apk
          sha256sum /tmp/gg-2.0.3-release/*.apk > /tmp/gg-2.0.3-release/SHA256SUMS.txt
          cat > /tmp/gg-2.0.3-release/RELEASE-INFO.txt <<'EOF'
          GG 2.0.3 formal client signing input
          versionCode: 12
          packageName: com.jinli.quickweb
          productionCertificateSHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.3-formal-client-release-input
          path: /tmp/gg-2.0.3-release/**
          retention-days: 90
          if-no-files-found: error
