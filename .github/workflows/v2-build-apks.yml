name: Build formal GG client and manager APKs

on:
  push:
    branches:
      - main
    paths:
      - v2/android/client/**
      - v2/android/manager/**
      - v2/android/build.gradle.kts
      - v2/android/settings.gradle.kts
      - v2/android/gradle.properties
      - .github/workflows/v2-build-apks.yml
  pull_request:
    branches:
      - main
    paths:
      - v2/android/client/**
      - v2/android/manager/**
      - v2/android/build.gradle.kts
      - v2/android/settings.gradle.kts
      - v2/android/gradle.properties
      - .github/workflows/v2-build-apks.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify release version contracts
        shell: bash
        run: |
          set -euo pipefail
          client='v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java'
          grep -Fq 'versionCode = 15' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.6"' v2/android/client/build.gradle.kts
          grep -Fq 'versionCode = 2' v2/android/manager/build.gradle.kts
          grep -Fq 'versionName = "2.0.1"' v2/android/manager/build.gradle.kts
          grep -Fq 'setSupportMultipleWindows(false)' "$client"
          ! grep -Fq 'boolean onCreateWindow' "$client"
          ! grep -Fq 'new WebView(MainActivity.this)' "$client"
          grep -Fq 'ensureControlScriptInjected(view, url)' "$client"
          grep -Fq 'view.loadUrl(target)' "$client"
          grep -Fq 'ResilientApiTransport.get' v2/android/manager/src/main/java/com/jinli/ggsecure/manager/AdminApiManager.java

      - name: Build and lint both release APKs
        working-directory: v2/android
        run: >-
          gradle --no-daemon
          :client:clean :client:lintRelease :client:assembleRelease
          :manager:clean :manager:lintRelease :manager:assembleRelease

      - name: Sign and verify formal APKs
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GG_RELEASE_KEYSTORE_BASE64:-}"
          test -n "${GG_RELEASE_KEYSTORE_PASSWORD:-}"
          trap 'rm -f /tmp/gg-release.jks' EXIT
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks \
            -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"
          mkdir -p /tmp/gg-formal

          sign_one() {
            local input="$1" output="$2"
            "$apksigner" sign --ks /tmp/gg-release.jks --ks-key-alias gg-release \
              --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --v4-signing-enabled false --out "$output" "$input"
            "$apksigner" verify --min-sdk-version 24 "$output"
          }

          client="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          manager="$(find v2/android/manager/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          sign_one "$client" /tmp/gg-formal/GG-2.0.6-code15.apk
          sign_one "$manager" /tmp/gg-formal/GG-Manager-2.0.1-code2.apk

          "$aapt" dump badging /tmp/gg-formal/GG-2.0.6-code15.apk | grep -Fq "package: name='com.jinli.quickweb' versionCode='15' versionName='2.0.6'"
          "$aapt" dump badging /tmp/gg-formal/GG-Manager-2.0.1-code2.apk | grep -Fq "package: name='com.jinli.ggsecure.manager' versionCode='2' versionName='2.0.1'"
          sha256sum /tmp/gg-formal/*.apk > /tmp/gg-formal/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: GG-formal-client-and-manager
          path: /tmp/gg-formal/**
          retention-days: 30
          if-no-files-found: error
