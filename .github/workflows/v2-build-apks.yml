name: Trigger robust GG client and manager release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/v2-build-apks.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch robust release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-client-manager-connectivity-fix-v3.yml/dispatches" \
            -f ref=main
          echo 'Robust GG client and manager release dispatched.'
