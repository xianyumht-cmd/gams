name: GG 2.0.14 APK

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

concurrency:
  group: gg-2-0-14-apk-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout controller
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Record running state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs
          printf '{\n  "state": "running",\n  "ok": false,\n  "runId": %s,\n  "runAttempt": %s\n}\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > docs/GG_2_0_14_APK_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/GG_2_0_14_APK_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record GG 2.0.14 APK build start'
            git push origin HEAD:main
          fi

      - name: Checkout implementation
        uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          path: source
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build and sign APK
        id: build
        env:
          GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
          GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
        run: bash scripts/build-js-runtime-stability-apk-final.sh

      - name: Upload APK
        id: upload
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.14-page5-stability-code25
          path: artifact/**
          retention-days: 30
          if-no-files-found: error

      - name: Record final state
        if: always()
        shell: bash
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          UPLOAD_RESULT: ${{ steps.upload.outcome }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        run: |
          set -euo pipefail
          ok=false
          apk_sha=''
          if [[ "$BUILD_RESULT" == 'success' && "$UPLOAD_RESULT" == 'success' ]]; then
            ok=true
          fi
          if [[ -f artifact/SHA256SUMS.txt ]]; then
            apk_sha="$(awk '{print $1}' artifact/SHA256SUMS.txt | head -n1)"
          fi
          export OK="$ok" APK_SHA="$apk_sha"
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          artifact_id = os.environ.get('ARTIFACT_ID', '')
          payload = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),
              'state': 'completed' if os.environ['OK'] == 'true' else 'failed',
              'ok': os.environ['OK'] == 'true',
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'runAttempt': int(os.environ['GITHUB_RUN_ATTEMPT']),
              'buildOutcome': os.environ.get('BUILD_RESULT', ''),
              'uploadOutcome': os.environ.get('UPLOAD_RESULT', ''),
              'artifactId': int(artifact_id) if artifact_id else None,
              'apk': {
                  'fileName': 'GG-2.0.14-page5-stability-code25.apk',
                  'package': 'com.jinli.quickweb',
                  'versionName': '2.0.14-page5-stability',
                  'versionCode': 25,
                  'sha256': os.environ.get('APK_SHA', ''),
              },
          }
          with open('/tmp/GG_2_0_14_APK_STATUS.json', 'w', encoding='utf-8') as f:
              json.dump(payload, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          git fetch origin main --quiet
          git reset --hard origin/main
          mkdir -p docs
          cp /tmp/GG_2_0_14_APK_STATUS.json docs/GG_2_0_14_APK_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/GG_2_0_14_APK_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record GG 2.0.14 APK build result'
            git push origin HEAD:main
          fi
          [[ "$ok" == true ]]
