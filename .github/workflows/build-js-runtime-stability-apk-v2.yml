name: GG 2.0.14 Stability APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout build controller
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Checkout implementation source
        uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          path: source
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build, sign and verify APK
        env:
          GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
          GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
        run: bash scripts/build-js-runtime-stability-apk-final.sh

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: GG-2.0.14-page5-stability-code25
          path: artifact/**
          retention-days: 30
          if-no-files-found: error
