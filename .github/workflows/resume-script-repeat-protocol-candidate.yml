name: Resume script repeat protocol candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/resume-script-repeat-protocol-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: script-repeat-protocol-resume-20260804
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CANDIDATE_RUNTIME_VERSION: 2.0.5-script-repeat-c1
      CANDIDATE_APP_VERSION: 19
      APK_VERSION_NAME: 2.0.9-script-candidate
      APK_VERSION_CODE: 19
      RUNTIME_CUSTOM_HOST: runtime.xn--8pv109c.top
      RUNTIME_WORKER_HOST: gams-runtime-v2.2320006072.workers.dev
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify deployed channel source and stable client baseline
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GG_RELEASE_KEYSTORE_BASE64:-}"
          test -n "${GG_RELEASE_KEYSTORE_PASSWORD:-}"
          python3 -m py_compile scripts/apply_candidate_runtime_channel.py
          node --check v2/runtime/src/index.js
          grep -Fq 'const CANDIDATE_APP_VERSION = 19;' v2/runtime/src/index.js
          grep -Fq 'const CANDIDATE_RUNTIME_VERSION = "2.0.5-script-repeat-c1";' v2/runtime/src/index.js
          grep -Fq 'releaseBaseForAppVersion(appVersion)' v2/runtime/src/index.js
          grep -Fq 'releaseForRequestedVersion(requestedVersion)' v2/runtime/src/index.js
          grep -Fq 'candidate-script-repeat-20260804/candidate-runtime/release/' v2/runtime/src/index.js
          grep -Fq 'versionCode = 16' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.3-stable"' v2/android/client/build.gradle.kts
          grep -Fq 'PROTOCOL_APP_VERSION = 12' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          main_activity='v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java'
          sha256sum "$main_activity" | awk '{print $1}' > /tmp/main-activity-before.sha256
          grep -Fq 'setSupportMultipleWindows(false)' "$main_activity"
          ! grep -Fq 'boolean onCreateWindow' "$main_activity"
          ! grep -Fq 'new WebView(MainActivity.this)' "$main_activity"

      - name: Verify production Worker candidate and default channels
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          candidate_ok=false
          default_ok=false
          candidate_code=000
          default_code=000
          for attempt in $(seq 1 12); do
            candidate_code="$(curl -sS --connect-timeout 4 --max-time 8 -o /tmp/candidate-body -w '%{http_code}' "https://${RUNTIME_WORKER_HOST}/health?candidate=1&attempt=${attempt}" 2>/tmp/candidate-error || true)"
            default_code="$(curl -sS --connect-timeout 4 --max-time 8 -o /tmp/default-body -w '%{http_code}' "https://${RUNTIME_WORKER_HOST}/health?attempt=${attempt}" 2>/tmp/default-error || true)"
            candidate_text="$(cat /tmp/candidate-body 2>/dev/null || true)"
            default_text="$(cat /tmp/default-body 2>/dev/null || true)"
            if [[ "$candidate_code" == 200 ]] && printf '%s' "$candidate_text" | jq -e --arg version "$CANDIDATE_RUNTIME_VERSION" --argjson app "$CANDIDATE_APP_VERSION" '.ok == true and .candidateChannel == true and .candidateAppVersion == $app and .candidateRuntimeVersion == $version' >/dev/null 2>&1; then candidate_ok=true; fi
            if [[ "$default_code" == 200 ]] && printf '%s' "$default_text" | jq -e '.ok == true and .encryptedRuntime == true and .candidateChannel == true and .candidateRuntimeVersion == null' >/dev/null 2>&1; then default_ok=true; fi
            if [[ "$candidate_ok" == true && "$default_ok" == true ]]; then break; fi
            sleep 3
          done

          custom_code="$(curl -sS --connect-timeout 4 --max-time 8 -o /tmp/custom-body -w '%{http_code}' "https://${RUNTIME_CUSTOM_HOST}/health?candidate=1" 2>/tmp/custom-error || true)"
          custom_text="$(cat /tmp/custom-body 2>/dev/null || true)"
          custom_ok=false
          if [[ "$custom_code" == 200 ]] && printf '%s' "$custom_text" | jq -e --arg version "$CANDIDATE_RUNTIME_VERSION" '.ok == true and .candidateRuntimeVersion == $version' >/dev/null 2>&1; then custom_ok=true; fi

          jq -n --argjson candidateOk "$candidate_ok" --arg candidateCode "$candidate_code" --arg candidateBody "$(tr '\r\n' '  ' </tmp/candidate-body 2>/dev/null | head -c 700 || true)" --arg candidateError "$(tr '\r\n' '  ' </tmp/candidate-error 2>/dev/null | head -c 300 || true)" --argjson defaultOk "$default_ok" --arg defaultCode "$default_code" --arg defaultBody "$(tr '\r\n' '  ' </tmp/default-body 2>/dev/null | head -c 700 || true)" --arg defaultError "$(tr '\r\n' '  ' </tmp/default-error 2>/dev/null | head -c 300 || true)" --argjson customOk "$custom_ok" --arg customCode "$custom_code" --arg customBody "$(tr '\r\n' '  ' </tmp/custom-body 2>/dev/null | head -c 700 || true)" --arg customError "$(tr '\r\n' '  ' </tmp/custom-error 2>/dev/null | head -c 300 || true)" '{candidateWorker:{ok:$candidateOk,httpCode:$candidateCode,body:$candidateBody,error:$candidateError},defaultWorker:{ok:$defaultOk,httpCode:$defaultCode,body:$defaultBody,error:$defaultError},customDomainObservation:{ok:$customOk,httpCode:$customCode,body:$customBody,error:$customError,gating:false}}' > /tmp/probe.json
          test "$candidate_ok" = true
          test "$default_ok" = true

      - name: Patch candidate-only client protocol version
        id: client_patch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_candidate_runtime_channel.py client
          grep -Fq 'PROTOCOL_APP_VERSION = 19' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          grep -Fq '版本：2.0.9-script-candidate' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          grep -Fq 'versionCode = 19' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.9-script-candidate"' v2/android/client/build.gradle.kts
          main_activity='v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java'
          sha256sum "$main_activity" | awk '{print $1}' > /tmp/main-activity-after.sha256
          cmp /tmp/main-activity-before.sha256 /tmp/main-activity-after.sha256
          git diff --exit-code -- "$main_activity"
          git diff --exit-code -- v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeNames.java
          git diff --exit-code -- v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeTransport.java

      - name: Build sign and verify candidate APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p v2/android :client:clean :client:lintRelease :client:assembleRelease
          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$unsigned"

          trap 'rm -f /tmp/gg-release.jks' EXIT
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/gg-release.jks
          test -s /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"

          mkdir -p /tmp/script-repeat-protocol-resume
          signed="/tmp/script-repeat-protocol-resume/GG-${APK_VERSION_NAME}-code${APK_VERSION_CODE}.apk"
          "$apksigner" sign --ks /tmp/gg-release.jks --ks-key-alias gg-release --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true --v4-signing-enabled false --out "$signed" "$unsigned"
          "$apksigner" verify --verbose --print-certs "$signed" > /tmp/apk-verify.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apk-verify.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apk-verify.txt
          "$aapt" dump badging "$signed" > /tmp/apk-badging.txt
          grep -Fq "package: name='com.jinli.quickweb' versionCode='${APK_VERSION_CODE}' versionName='${APK_VERSION_NAME}'" /tmp/apk-badging.txt
          sha256sum "$signed" | tee /tmp/script-repeat-protocol-resume/SHA256SUMS.txt
          jq -n --arg versionName "$APK_VERSION_NAME" --argjson versionCode "$APK_VERSION_CODE" --argjson appVersion "$CANDIDATE_APP_VERSION" --arg runtimeVersion "$CANDIDATE_RUNTIME_VERSION" --arg runtimeSha256 'b232ae9e25b3c4d1b4684f8d74967e07f62d48de227a9ccd901cee355052e3f5' '{schemaVersion:1,kind:"isolated-script-candidate-production-runtime-channel",versionName:$versionName,versionCode:$versionCode,protocolAppVersion:$appVersion,runtimeVersion:$runtimeVersion,runtimeSha256:$runtimeSha256,isolation:{androidMainActivityChanged:false,scriptChangedFromPreviousCandidate:false,gameChanged:false,defaultRuntimeChannelChanged:false,clientNetworkHostsChanged:false}}' > /tmp/script-repeat-protocol-resume/CANDIDATE_INFO.json

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: GG-2.0.9-script-repeat-protocol-resume
          path: /tmp/script-repeat-protocol-resume/**
          retention-days: 30
          if-no-files-found: error

      - name: Record resumed candidate result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.verify.outcome }}" == success && "${{ steps.probe.outcome }}" == success && "${{ steps.client_patch.outcome }}" == success && "${{ steps.apk.outcome }}" == success && "${{ steps.artifact.outcome }}" == success ]]; then ok=true; fi
          apk_sha=''
          if [[ -s /tmp/script-repeat-protocol-resume/SHA256SUMS.txt ]]; then apk_sha="$(awk '{print $1}' /tmp/script-repeat-protocol-resume/SHA256SUMS.txt | head -n1)"; fi
          test -s /tmp/probe.json || echo '{"candidateWorker":{"ok":false},"defaultWorker":{"ok":false},"customDomainObservation":{"ok":false,"gating":false}}' > /tmp/probe.json
          jq -n --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --argjson runId "$GITHUB_RUN_ID" --argjson ok "$ok" --arg versionName "$APK_VERSION_NAME" --argjson versionCode "$APK_VERSION_CODE" --arg apkSha256 "$apk_sha" --argjson protocolAppVersion "$CANDIDATE_APP_VERSION" --arg runtimeVersion "$CANDIDATE_RUNTIME_VERSION" --slurpfile probe /tmp/probe.json --arg verify "${{ steps.verify.outcome }}" --arg probeStep "${{ steps.probe.outcome }}" --arg clientPatch "${{ steps.client_patch.outcome }}" --arg apk "${{ steps.apk.outcome }}" --arg artifact "${{ steps.artifact.outcome }}" '{schemaVersion:1,generatedAt:$generatedAt,runId:$runId,ok:$ok,apk:{versionName:$versionName,versionCode:$versionCode,sha256:$apkSha256,protocolAppVersion:$protocolAppVersion},runtime:{candidateVersion:$runtimeVersion,probe:$probe[0]},isolation:{androidMainActivityChanged:false,scriptChangedFromPreviousCandidate:false,gameChanged:false,defaultRuntimeChannelChanged:false,clientNetworkHostsChanged:false},steps:{verify:$verify,probe:$probeStep,clientPatch:$clientPatch,apk:$apk,artifact:$artifact},secretsExposed:false}' > /tmp/status.json
          content="$(base64 -w0 /tmp/status.json)"
          path='docs/SCRIPT_REPEAT_PROTOCOL_RESUME_STATUS.json'
          old_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='Record resumed script repeat protocol candidate' -f content="$content" -f branch=main)
          [[ -z "$old_sha" ]] || args+=(-f sha="$old_sha")
          gh api "${args[@]}" >/dev/null

      - name: Require complete candidate
        if: always()
        shell: bash
        run: |
          test "${{ steps.verify.outcome }}" = success
          test "${{ steps.probe.outcome }}" = success
          test "${{ steps.client_patch.outcome }}" = success
          test "${{ steps.apk.outcome }}" = success
          test "${{ steps.artifact.outcome }}" = success
