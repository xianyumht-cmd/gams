name: Apply latest GAMS game engine JS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-latest-gams-js.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply verified byte patch
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import hashlib
          import json
          from pathlib import Path

          path = Path("game-engine/release/game-1.0.5.js")
          expected_old_git = "38e3036d7a86ba84144a4a67daada10bbd49265d"
          expected_new_git = "b1ba0648819c131406ef7d7b8f6f3750c5d6b4f7"
          expected_new_sha256 = "61903eb697e82ae09f03a8ae87bd8808b6063191a224057fcb5e75813573e7a8"
          expected_new_size = 11590600
          ops = json.loads(r'''[{"start":1199426,"end":1199426,"old_b64":"","new_b64":"JiZ0cA=="},{"start":1199536,"end":1199536,"old_b64":"","new_b64":"JiZ0cA=="},{"start":1211654,"end":1211654,"old_b64":"","new_b64":"JiZ0cA=="},{"start":1211752,"end":1211752,"old_b64":"","new_b64":"JiZ0cA=="},{"start":1215583,"end":1215689,"old_b64":"U0ZbJ3JlJysnYWwnKydfbicrJ2FtJysnZSddLHVzZXJSZWFsQWdlOlNGWydyZScrJ2FsJysnX2EnKydnZSddLHVzZXJJc1Zpc2l0b3I6U0ZbJ2lzJysnX3YnKydpcycrJ2l0Jysnb3InXQ==","new_b64":"KFNGJiZTRlsncmUnKydhbCcrJ19uJysnYW0nKydlJ10pLHVzZXJSZWFsQWdlOihTRiYmU0ZbJ3JlJysnYWwnKydfYScrJ2dlJ10pLHVzZXJJc1Zpc2l0b3I6KFNGJiZTRlsnaXMnKydfdicrJ2lzJysnaXQnKydvciddKQ=="},{"start":1612390,"end":1612390,"old_b64":"","new_b64":"JiZ0cA=="},{"start":1612470,"end":1612470,"old_b64":"","new_b64":"JiZ0cA=="},{"start":1927483,"end":1927483,"old_b64":"","new_b64":"JiZ0cA=="},{"start":1927557,"end":1927557,"old_b64":"","new_b64":"JiZ0cA=="},{"start":3717098,"end":3717098,"old_b64":"","new_b64":"JiZ0cA=="},{"start":3717174,"end":3717174,"old_b64":"","new_b64":"JiZ0cA=="},{"start":4043412,"end":4043412,"old_b64":"","new_b64":"JiZ0cA=="},{"start":4043489,"end":4043489,"old_b64":"","new_b64":"JiZ0cA=="}]''')

          data = bytearray(path.read_bytes())

          def git_blob_sha(buf):
              return hashlib.sha1(b"blob " + str(len(buf)).encode() + b"\0" + bytes(buf)).hexdigest()

          current_git = git_blob_sha(data)
          if current_git != expected_old_git:
              raise SystemExit(f"Refusing to patch unexpected source blob: {current_git}")

          for op in sorted(ops, key=lambda x: x["start"], reverse=True):
              start, end = op["start"], op["end"]
              old = base64.b64decode(op["old_b64"])
              new = base64.b64decode(op["new_b64"])
              if bytes(data[start:end]) != old:
                  raise SystemExit(f"Source check failed at {start}:{end}")
              data[start:end] = new

          result = bytes(data)
          result_git = git_blob_sha(result)
          result_sha256 = hashlib.sha256(result).hexdigest()
          if len(result) != expected_new_size:
              raise SystemExit(f"Unexpected size: {len(result)}")
          if result_git != expected_new_git:
              raise SystemExit(f"Unexpected Git blob SHA: {result_git}")
          if result_sha256 != expected_new_sha256:
              raise SystemExit(f"Unexpected SHA-256: {result_sha256}")

          path.write_bytes(result)
          print("Verified latest JS:", len(result), result_sha256, result_git)
          PY

      - name: Commit replacement and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/apply-latest-gams-js.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: update game engine release to latest JS"
          git push origin HEAD:main
