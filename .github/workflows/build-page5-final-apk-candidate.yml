name: Build isolated final APK candidate

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/page5_final_apk_candidate.trigger
      - .github/workflows/build-page5-final-apk-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-final-apk-candidate-20260806
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      IMPLEMENTATION_REF: fix/page5-missing-constructor-mobile-bridge-20260806
      IMPLEMENTATION_COMMIT: a1de079f395642fe2f2c081492f286239538812c
      EXPECTED_RUNTIME_SHA256: 57765fbb8d9a0529ed1463623f1bed9c05052e76396a6aaa89fdd2ecc673bc72
      WORKTREE: /tmp/gams-page5-final-apk
      OUTPUT_DIR: /tmp/gg-page5-final-candidate
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - name: Publish running marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'running',
              'ok': False,
              'mode': 'isolated-final-apk-candidate-build',
              'implementationRef': os.environ['IMPLEMENTATION_REF'],
              'implementationCommit': os.environ['IMPLEMENTATION_COMMIT'],
              'runtimeSha256': os.environ['EXPECTED_RUNTIME_SHA256'],
              'browserValidationRunId': 31051809043,
              'finalInteractionRunId': 31050480987,
              'productionDefaultChanged': False,
              'implementationMerged': False,
              'apkPublished': False,
              'paymentCompleted': False,
          }
          Path('/tmp/PAGE5_FINAL_APK_CANDIDATE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          mkdir -p docs
          cp /tmp/PAGE5_FINAL_APK_CANDIDATE_STATUS.json docs/PAGE5_FINAL_APK_CANDIDATE_STATUS.json
          git add docs/PAGE5_FINAL_APK_CANDIDATE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Mark final APK candidate build running"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Verify completed browser gates
        shell: bash
        run: |
          set -euo pipefail
          jq -e \
            '.ok == true
             and .state == "completed"
             and .implementationRef == env.IMPLEMENTATION_REF
             and .runtimeSha256 == env.EXPECTED_RUNTIME_SHA256
             and .fivePage.pass == true
             and .repeatReentry.pass == true
             and .finalInteraction.pass == true
             and .finalInteraction.pageErrors == []
             and .finalInteraction.blockedOrderCount == 0' \
            docs/FINAL_PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json >/dev/null
          jq -e \
            '.ok == true
             and .runtimeSha256 == env.EXPECTED_RUNTIME_SHA256
             and .pageErrors == []
             and .blockedOrderCount == 0
             and .purchaseActionReached == true
             and .purchaseResultObserved == true' \
            docs/PAGE5_PURCHASE_ACTION_PROBE_V3_STATUS.json >/dev/null

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare isolated implementation worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$IMPLEMENTATION_REF:refs/remotes/origin/$IMPLEMENTATION_REF"
          test "$(git rev-parse "origin/$IMPLEMENTATION_REF")" = "$IMPLEMENTATION_COMMIT"
          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" "origin/$IMPLEMENTATION_REF"
          test "$(git -C "$WORKTREE" rev-parse HEAD)" = "$IMPLEMENTATION_COMMIT"
          test "$(sha256sum "$WORKTREE/game-engine/release/game-1.0.5.js" | awk '{print $1}')" = "$EXPECTED_RUNTIME_SHA256"
          node --check "$WORKTREE/game-engine/release/game-1.0.5.js"
          test "$(grep -Fo "if(typeof tp==='undefined'||tp==null)return;" "$WORKTREE/game-engine/release/game-1.0.5.js" | wc -l)" -eq 1

      - name: Verify Android release contracts
        shell: bash
        run: |
          set -euo pipefail
          client="$WORKTREE/v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java"
          license_manager="$WORKTREE/v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java"
          manager="$WORKTREE/v2/android/manager/src/main/java/com/jinli/ggsecure/manager/MainActivity.java"

          grep -Fq 'versionCode = 16' "$WORKTREE/v2/android/client/build.gradle.kts"
          grep -Fq 'versionName = "2.0.3-stable"' "$WORKTREE/v2/android/client/build.gradle.kts"
          grep -Fq 'PROTOCOL_APP_VERSION = 12' "$license_manager"
          grep -Fq 'setSupportMultipleWindows(false)' "$client"
          ! grep -Fq 'boolean onCreateWindow' "$client"
          ! grep -Fq 'new WebView(MainActivity.this)' "$client"

          grep -Fq 'versionCode = 4' "$WORKTREE/v2/android/manager/build.gradle.kts"
          grep -Fq 'versionName = "2.0.3"' "$WORKTREE/v2/android/manager/build.gradle.kts"
          grep -Fq '/v1/admin/dashboard' "$manager"
          grep -Fq '/v1/admin/devices' "$manager"
          grep -Fq '/v1/admin/audit' "$manager"
          grep -Fq '/v1/admin/runtime' "$manager"
          grep -Fq 'ResilientApiTransport.get' "$WORKTREE/v2/android/manager/src/main/java/com/jinli/ggsecure/manager/AdminApiManager.java"

      - name: Build and lint candidate APKs
        working-directory: /tmp/gams-page5-final-apk/v2/android
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon \
            :client:clean :client:lintRelease :client:assembleRelease \
            :manager:clean :manager:lintRelease :manager:assembleRelease

      - name: Sign and verify candidate APKs
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GG_RELEASE_KEYSTORE_BASE64:-}"
          test -n "${GG_RELEASE_KEYSTORE_PASSWORD:-}"
          trap 'rm -f /tmp/gg-release.jks' EXIT
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks \
            -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"
          mkdir -p "$OUTPUT_DIR"

          sign_one() {
            local input="$1" output="$2"
            "$apksigner" sign --ks /tmp/gg-release.jks --ks-key-alias gg-release \
              --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
              --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
              --v4-signing-enabled false --out "$output" "$input"
            "$apksigner" verify --verbose --print-certs --min-sdk-version 24 "$output" > "$output.apksigner.txt"
            grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' "$output.apksigner.txt"
            grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' "$output.apksigner.txt"
          }

          client="$(find "$WORKTREE/v2/android/client/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -n1)"
          manager="$(find "$WORKTREE/v2/android/manager/build/outputs/apk/release" -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$client" && test -s "$manager"

          client_out="$OUTPUT_DIR/GG-2.0.3-stable-code16-page5-candidate.apk"
          manager_out="$OUTPUT_DIR/GG-Manager-2.0.3-code4-page5-candidate.apk"
          sign_one "$client" "$client_out"
          sign_one "$manager" "$manager_out"

          "$aapt" dump badging "$client_out" > "$OUTPUT_DIR/client-badging.txt"
          "$aapt" dump badging "$manager_out" > "$OUTPUT_DIR/manager-badging.txt"
          grep -Fq "package: name='com.jinli.quickweb' versionCode='16' versionName='2.0.3-stable'" "$OUTPUT_DIR/client-badging.txt"
          grep -Fq "package: name='com.jinli.ggsecure.manager' versionCode='4' versionName='2.0.3'" "$OUTPUT_DIR/manager-badging.txt"
          sha256sum "$OUTPUT_DIR"/*.apk > "$OUTPUT_DIR/SHA256SUMS.txt"
          stat -c '%n %s' "$OUTPUT_DIR"/*.apk > "$OUTPUT_DIR/SIZES.txt"
          cp /tmp/keytool.txt "$OUTPUT_DIR/signing-certificate.txt"

      - name: Build completed candidate status
        if: always()
        shell: bash
        env:
          SIGN_OUTCOME: ${{ steps.sign.outcome }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          apks = []
          for path in sorted(output.glob('*.apk')):
              data = path.read_bytes()
              apks.append({
                  'name': path.name,
                  'size': len(data),
                  'sha256': hashlib.sha256(data).hexdigest(),
              })
          expected_names = {
              'GG-2.0.3-stable-code16-page5-candidate.apk',
              'GG-Manager-2.0.3-code4-page5-candidate.apk',
          }
          ok = (
              os.environ.get('SIGN_OUTCOME') == 'success'
              and {item['name'] for item in apks} == expected_names
              and all(item['size'] > 100000 for item in apks)
          )
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('SIGN_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'isolated-final-apk-candidate-build',
              'implementationRef': os.environ['IMPLEMENTATION_REF'],
              'implementationCommit': os.environ['IMPLEMENTATION_COMMIT'],
              'runtimeSha256': os.environ['EXPECTED_RUNTIME_SHA256'],
              'browserValidationRunId': 31051809043,
              'finalInteractionRunId': 31050480987,
              'signingCertificateSha256': os.environ['CERT_SHA256'],
              'apks': apks,
              'artifactName': 'GG-page5-final-runtime-candidate',
              'productionDefaultChanged': False,
              'implementationMerged': False,
              'apkPublished': False,
              'paymentCompleted': False,
              'realOrderRequestsAllowed': False,
              'diagnosticBranch': os.environ.get('GITHUB_REF_NAME', ''),
              'diagnosticCommit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_FINAL_APK_CANDIDATE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GG-page5-final-runtime-candidate
          path: |
            /tmp/gg-page5-final-candidate
            /tmp/PAGE5_FINAL_APK_CANDIDATE_STATUS.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish completed candidate status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          mkdir -p docs
          cp /tmp/PAGE5_FINAL_APK_CANDIDATE_STATUS.json docs/PAGE5_FINAL_APK_CANDIDATE_STATUS.json
          git add docs/PAGE5_FINAL_APK_CANDIDATE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record final APK candidate build"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce candidate build gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_FINAL_APK_CANDIDATE_STATUS.json >/dev/null
