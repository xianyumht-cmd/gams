name: Probe page five menu callback source breakpoint v2

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - .github/workflows/run-page5-menu-callback-breakpoint-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-menu-callback-breakpoint-probe-v2-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: page5-menu-callback-breakpoint-probe-v2
      GENERATED_PROBE: scripts/run_page5_menu_callback_breakpoint_probe_v2.generated.mjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Prepare source-located callback probe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          source = Path('scripts/run_page5_menu_callback_breakpoint_probe.mjs').read_text(encoding='utf-8')
          source = source.replace(
              'const outputDir = process.env.OUTPUT_DIR || "page5-menu-callback-breakpoint-probe";',
              'const outputDir = process.env.OUTPUT_DIR || "page5-menu-callback-breakpoint-probe-v2";',
              1,
          )
          old = '''            try {
                        const set = await cdp.send("Debugger.setBreakpointOnFunctionCall", { objectId: item.objectId });
                        callbackBreakpoints.push({ label: item.label, eventName, breakpointId: set.breakpointId, remote: item.remote, internalProperties: item.internalProperties });
                      } catch (error) {
                        debuggerErrors.push(`setBreakpointOnFunctionCall ${item.label}: ${String(error).slice(0, 500)}`);
                      }'''
          new = '''            try {
                        const locationProperty = item.internalProperties.find((property) => property.name === "[[FunctionLocation]]");
                        const location = locationProperty?.value?.rawValue;
                        if (!location || !location.scriptId) continue;
                        const set = await cdp.send("Debugger.setBreakpoint", {
                          location: {
                            scriptId: location.scriptId,
                            lineNumber: location.lineNumber,
                            columnNumber: location.columnNumber,
                          },
                        });
                        callbackBreakpoints.push({
                          label: item.label,
                          eventName,
                          breakpointId: set.breakpointId,
                          requestedLocation: location,
                          actualLocation: set.actualLocation,
                          script: scriptMap.get(location.scriptId) || null,
                          remote: item.remote,
                          internalProperties: item.internalProperties,
                        });
                      } catch (error) {
                        debuggerErrors.push(`set source callback breakpoint ${item.label}: ${String(error).slice(0, 500)}`);
                      }'''
          count = source.count(old)
          if count != 1:
              raise SystemExit(f'callback breakpoint block mismatch: {count}')
          source = source.replace(old, new, 1)
          source = source.replace(
              'mode: "page5-menu-callback-breakpoint-read-only-probe",',
              'mode: "page5-menu-callback-source-breakpoint-read-only-probe-v2",',
              1,
          )
          output = Path('scripts/run_page5_menu_callback_breakpoint_probe_v2.generated.mjs')
          output.write_text(source, encoding='utf-8')
          print(output)
          PY
          node --check "$GENERATED_PROBE"
          grep -Fq '[[FunctionLocation]]' "$GENERATED_PROBE"
          grep -Fq 'requestedLocation' "$GENERATED_PROBE"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute source-located callback probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node "$GENERATED_PROBE" 2>&1 | tee /tmp/page5-menu-callback-breakpoint-probe-v2.log

      - name: Build probe status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-menu-callback-breakpoint-probe-v2.log && cp /tmp/page5-menu-callback-breakpoint-probe-v2.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          callback_pause = report.get('callbackPause', {}) if report else {}
          frame = (callback_pause.get('frames') or [None])[0] if callback_pause else None
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-menu-callback-source-breakpoint-read-only-probe-v2',
              'canvasPauseCaptured': report.get('canvasPauseCaptured') if report else None,
              'callbackPauseCaptured': report.get('callbackPauseCaptured') if report else None,
              'selectedNodeIndex': report.get('selectedNodeIndex') if report else None,
              'callbackBreakpoints': report.get('callbackBreakpoints') if report else None,
              'matchedCallbacks': callback_pause.get('matchedCallbacks') if callback_pause else None,
              'callbackTopFrame': {
                  'functionName': frame.get('functionName') if frame else None,
                  'url': frame.get('url') if frame else None,
                  'location': frame.get('location') if frame else None,
              },
              'menuScreenshotChanged': report.get('menuScreenshotChanged') if report else None,
              'mainFrameValid': report.get('mainFrameValid') if report else None,
              'pageErrorCount': len(report.get('pageErrors', [])) if report else None,
              'blockedOrderCount': len(report.get('blockedOrders', [])) if report else None,
              'debuggerErrorCount': len(report.get('debuggerErrors', [])) if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'page5-menu-callback-breakpoint-probe-v2',
              'readOnlyProbe': True,
              'pageScriptModified': False,
              'candidateTested': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_MENU_CALLBACK_BREAKPOINT_PROBE_V2_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-menu-callback-breakpoint-probe-v2
          path: page5-menu-callback-breakpoint-probe-v2
          retention-days: 30
          if-no-files-found: warn

      - name: Publish probe status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_MENU_CALLBACK_BREAKPOINT_PROBE_V2_STATUS.json docs/PAGE5_MENU_CALLBACK_BREAKPOINT_PROBE_V2_STATUS.json
          git add docs/PAGE5_MENU_CALLBACK_BREAKPOINT_PROBE_V2_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five menu callback source breakpoint"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce source callback capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_MENU_CALLBACK_BREAKPOINT_PROBE_V2_STATUS.json >/dev/null
