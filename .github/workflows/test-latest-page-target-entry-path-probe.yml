name: Test latest page target entry paths

on:
  push:
    branches:
      - diagnostics/latest-page-lifecycle-trace-20260804
    paths:
      - scripts/run_latest_page_target_entry_path_probe.mjs
      - .github/workflows/test-latest-page-target-entry-path-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-page-target-entry-path-probe-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OUTPUT_DIR: latest-page-target-entry-path-probe
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/latest-page-lifecycle-trace-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CURRENT_FIRST_PATH"
          test -s "$CURRENT_SECOND_PATH"
          grep -Fq '@version      1.1.4' "$CURRENT_FIRST_PATH"
          node --check scripts/run_latest_page_target_entry_path_probe.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute read-only target entry probes
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_latest_page_target_entry_path_probe.mjs 2>&1 | tee /tmp/latest-page-target-entry-path-probe.log

      - name: Build probe status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/latest-page-target-entry-path-probe.log && cp /tmp/latest-page-target-entry-path-probe.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output_dir = Path(os.environ['OUTPUT_DIR'])
          report_path = output_dir / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'current-runtime-target-entry-path-probe',
              'summary': report.get('summary') if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'latest-page-target-entry-path-probe',
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/LATEST_PAGE_TARGET_ENTRY_PATH_PROBE_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-page-target-entry-path-probe
          path: latest-page-target-entry-path-probe
          retention-days: 30
          if-no-files-found: warn

      - name: Publish branch probe status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/LATEST_PAGE_TARGET_ENTRY_PATH_PROBE_STATUS.json docs/LATEST_PAGE_TARGET_ENTRY_PATH_PROBE_STATUS.json
          git add docs/LATEST_PAGE_TARGET_ENTRY_PATH_PROBE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record latest page target entry path probe"
            git push origin HEAD:diagnostics/latest-page-lifecycle-trace-20260804
          fi

      - name: Enforce diagnostic gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/LATEST_PAGE_TARGET_ENTRY_PATH_PROBE_STATUS.json >/dev/null
