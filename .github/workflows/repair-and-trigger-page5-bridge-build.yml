name: Repair and trigger isolated compatibility build

on:
  push:
    branches:
      - fix/page5-missing-constructor-mobile-bridge-20260806
    paths:
      - scripts/repair_page5_bridge_workflow.trigger

permissions:
  contents: write
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - name: Synchronize candidate build metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.github/workflows/build-page5-bridge-candidate.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '      SECOND_SIZE: 11590615': '      SECOND_SIZE: 11590659',
              '      SECOND_SHA256: 9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca': '      SECOND_SHA256: 57765fbb8d9a0529ed1463623f1bed9c05052e76396a6aaa89fdd2ecc673bc72',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count not in (0, 1):
                  raise SystemExit(f'unexpected replacement count for {old!r}: {count}')
              if count == 1:
                  text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          trigger = Path('scripts/build_page5_bridge_candidate.trigger')
          trigger.write_text(
              f"trigger={os.environ['GITHUB_RUN_ID']}\nreason=metadata-sync\n",
              encoding='utf-8',
          )
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/build-page5-bridge-candidate.yml scripts/build_page5_bridge_candidate.trigger
          if git diff --cached --quiet; then
            echo 'No synchronization change required.'
          else
            git commit -m 'Synchronize isolated compatibility build metadata'
            git push origin HEAD:fix/page5-missing-constructor-mobile-bridge-20260806
          fi
