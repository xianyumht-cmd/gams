name: Prepare synchronized compatibility build workflow

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-and-trigger-page5-bridge-build.yml
      - scripts/repair_page5_bridge_workflow.trigger

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - name: Prepare synchronized workflow file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/build-page5-bridge-candidate.yml')
          text = path.read_text(encoding='utf-8')
          replacements = {
              '      SECOND_SIZE: 11590615': '      SECOND_SIZE: 11590659',
              '      SECOND_SHA256: 9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca': '      SECOND_SHA256: 57765fbb8d9a0529ed1463623f1bed9c05052e76396a6aaa89fdd2ecc673bc72',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count not in (0, 1):
                  raise SystemExit(f'unexpected replacement count for {old!r}: {count}')
              if count == 1:
                  text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          Path('/tmp/synchronized-workflow').mkdir(parents=True, exist_ok=True)
          Path('/tmp/synchronized-workflow/build-page5-bridge-candidate.yml').write_text(text, encoding='utf-8')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: synchronized-compatibility-build-workflow
          path: /tmp/synchronized-workflow/build-page5-bridge-candidate.yml
          retention-days: 7
          if-no-files-found: error
