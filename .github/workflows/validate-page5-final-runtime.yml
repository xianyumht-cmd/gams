name: Validate final page five runtime candidate

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/prepare_persisted_page5_final_action_probe.py
      - scripts/final_page5_runtime_validation.trigger
      - .github/workflows/validate-page5-final-runtime.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-page5-runtime-validation-20260806
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    env:
      IMPLEMENTATION_REF: fix/page5-missing-constructor-mobile-bridge-20260806
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: /tmp/final-game-1.0.5.js
      EXPECTED_RUNTIME_SHA256: 57765fbb8d9a0529ed1463623f1bed9c05052e76396a6aaa89fdd2ecc673bc72
      FIVE_OUTPUT: final-five-page-matrix
      REPEAT_OUTPUT: final-repeat-reentry-matrix
      FIVE_GENERATED: scripts/run_final_five_page_matrix.generated.mjs
      REPEAT_GENERATED: scripts/run_final_repeat_reentry_matrix.generated.mjs

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Read and verify implementation candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$IMPLEMENTATION_REF:refs/remotes/origin/$IMPLEMENTATION_REF"
          git show "origin/$IMPLEMENTATION_REF:game-engine/release/game-1.0.5.js" > "$CURRENT_SECOND_PATH"
          git show "origin/$IMPLEMENTATION_REF:scripts/prepare_persisted_five_page_matrix.py" > scripts/prepare_persisted_five_page_matrix.py
          git show "origin/$IMPLEMENTATION_REF:scripts/prepare_persisted_repeat_reentry_matrix.py" > scripts/prepare_persisted_repeat_reentry_matrix.py
          test "$(sha256sum "$CURRENT_SECOND_PATH" | awk '{print $1}')" = "$EXPECTED_RUNTIME_SHA256"
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ['CURRENT_SECOND_PATH']).read_text(encoding='utf-8')
          guard = "if(typeof tp==='undefined'||tp==null)return;"
          if text.count(guard) != 1:
              raise SystemExit(f"final guard count mismatch: {text.count(guard)}")
          PY
          node --check "$CURRENT_SECOND_PATH"
          jq -e '.ok == true and .runtimeSha256 == env.EXPECTED_RUNTIME_SHA256 and .pageErrors == [] and .blockedOrderCount == 0' \
            docs/PAGE5_PURCHASE_ACTION_PROBE_V3_STATUS.json >/dev/null

      - name: Prepare final browser matrices
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/prepare_five_page_missing_constructor_matrix.py \
            scripts/prepare_page5_repeat_reentry_matrix.py \
            scripts/prepare_persisted_five_page_matrix.py \
            scripts/prepare_persisted_repeat_reentry_matrix.py
          python3 scripts/prepare_persisted_five_page_matrix.py --output "$FIVE_GENERATED"
          python3 scripts/prepare_persisted_repeat_reentry_matrix.py --output "$REPEAT_GENERATED"
          node --check "$FIVE_GENERATED"
          node --check "$REPEAT_GENERATED"
          grep -Fq 'persisted-runtime-five-page-matrix' "$FIVE_GENERATED"
          grep -Fq 'candidateMarkerCount === 5' "$FIVE_GENERATED"
          grep -Fq 'persisted-runtime-page5-first-second-reentry-third-repeat-matrix' "$REPEAT_GENERATED"
          grep -Fq 'openTargetListCount === 3' "$REPEAT_GENERATED"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute five-page gate
        id: five_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          OUTPUT_DIR="$FIVE_OUTPUT" node "$FIVE_GENERATED" 2>&1 | tee /tmp/final-five-page-matrix.log

      - name: Execute repeat and reentry gate
        id: repeat_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          OUTPUT_DIR="$REPEAT_OUTPUT" node "$REPEAT_GENERATED" 2>&1 | tee /tmp/final-repeat-reentry-matrix.log

      - name: Build final validation status
        if: always()
        shell: bash
        env:
          FIVE_OUTCOME: ${{ steps.five_run.outcome }}
          REPEAT_OUTCOME: ${{ steps.repeat_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$FIVE_OUTPUT" "$REPEAT_OUTPUT"
          test -f /tmp/final-five-page-matrix.log && cp /tmp/final-five-page-matrix.log "$FIVE_OUTPUT/workflow.log" || true
          test -f /tmp/final-repeat-reentry-matrix.log && cp /tmp/final-repeat-reentry-matrix.log "$REPEAT_OUTPUT/workflow.log" || true
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              p = Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else None

          five = load(Path(os.environ['FIVE_OUTPUT']) / 'report.json')
          repeat = load(Path(os.environ['REPEAT_OUTPUT']) / 'report.json')
          interaction = load('docs/PAGE5_PURCHASE_ACTION_PROBE_V3_STATUS.json')
          runtime_path = Path(os.environ['CURRENT_SECOND_PATH'])
          runtime = runtime_path.read_bytes() if runtime_path.exists() else b''
          runtime_sha = hashlib.sha256(runtime).hexdigest() if runtime else None
          guard_count = runtime.decode('utf-8').count("if(typeof tp==='undefined'||tp==null)return;") if runtime else 0
          interaction_ok = (
              bool(interaction)
              and interaction.get('ok') is True
              and interaction.get('runtimeSha256') == os.environ['EXPECTED_RUNTIME_SHA256']
              and not (interaction.get('pageErrors') or [])
              and int(interaction.get('blockedOrderCount') or 0) == 0
          )
          ok = (
              bool(five) and bool(five.get('pass')) and os.environ.get('FIVE_OUTCOME') == 'success'
              and bool(repeat) and bool(repeat.get('pass')) and os.environ.get('REPEAT_OUTCOME') == 'success'
              and interaction_ok
              and runtime_sha == os.environ['EXPECTED_RUNTIME_SHA256']
              and guard_count == 1
          )
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': {
                  'fivePage': os.environ.get('FIVE_OUTCOME', 'unknown'),
                  'repeatReentry': os.environ.get('REPEAT_OUTCOME', 'unknown'),
                  'finalInteraction': 'verified-status' if interaction_ok else 'failed-status',
              },
              'ok': ok,
              'mode': 'final-persisted-runtime-browser-validation',
              'implementationRef': os.environ['IMPLEMENTATION_REF'],
              'runtimeSha256': runtime_sha,
              'resultGuardCount': guard_count,
              'fivePage': {
                  'pass': bool((five or {}).get('pass')),
                  'summary': (five or {}).get('summary') or {},
              },
              'repeatReentry': {
                  'pass': bool((repeat or {}).get('pass')),
                  'summary': (repeat or {}).get('summary') or {},
                  'returnCssPoint': (repeat or {}).get('returnCssPoint'),
              },
              'finalInteraction': {
                  'pass': interaction_ok,
                  'runId': (interaction or {}).get('runId'),
                  'actionReached': bool((interaction or {}).get('purchaseActionReached')),
                  'resultObserved': bool((interaction or {}).get('purchaseResultObserved')),
                  'pageErrors': (interaction or {}).get('pageErrors') or [],
                  'blockedOrderCount': int((interaction or {}).get('blockedOrderCount') or 0),
              },
              'realOrderRequestsAllowed': False,
              'paymentCompleted': False,
              'authorizationOutcomeModified': False,
              'productionDefaultChanged': False,
              'androidClientChanged': False,
              'apkBuilt': False,
              'diagnosticBranch': os.environ.get('GITHUB_REF_NAME', ''),
              'diagnosticCommit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/FINAL_PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-persisted-runtime-browser-validation
          path: |
            final-five-page-matrix
            final-repeat-reentry-matrix
            /tmp/FINAL_PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish final validation status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            scripts/prepare_persisted_five_page_matrix.py \
            scripts/prepare_persisted_repeat_reentry_matrix.py \
            "$FIVE_GENERATED" \
            "$REPEAT_GENERATED"
          git pull --rebase origin diagnostics/page5-guard-full-entry-20260805
          mkdir -p docs
          cp /tmp/FINAL_PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json docs/FINAL_PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json
          git add docs/FINAL_PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record final persisted runtime browser validation"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce final validation gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/FINAL_PERSISTED_RUNTIME_BROWSER_VALIDATION_STATUS.json >/dev/null
