name: Validate persisted page five bridge

on:
  push:
    branches:
      - fix/page5-missing-constructor-mobile-bridge-20260806
    paths:
      - scripts/validate_persisted_page5_bridge.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: validate-persisted-page5-bridge-20260806
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js
      FIVE_OUTPUT: persisted-five-page-matrix
      REPEAT_OUTPUT: persisted-repeat-reentry-matrix
      FIVE_GENERATED: scripts/run_persisted_five_page_matrix.generated.mjs
      REPEAT_GENERATED: scripts/run_persisted_repeat_reentry_matrix.generated.mjs
      DIAGNOSTIC_REF: diagnostics/page5-guard-full-entry-20260805

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore validated browser harnesses
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$DIAGNOSTIC_REF:refs/remotes/origin/$DIAGNOSTIC_REF"
          git show "origin/$DIAGNOSTIC_REF:scripts/run_page5_guard_full_entry_matrix.mjs" > scripts/run_page5_guard_full_entry_matrix.mjs
          git show "origin/$DIAGNOSTIC_REF:scripts/prepare_five_page_missing_constructor_matrix.py" > scripts/prepare_five_page_missing_constructor_matrix.py
          git show "origin/$DIAGNOSTIC_REF:scripts/prepare_page5_repeat_reentry_matrix.py" > scripts/prepare_page5_repeat_reentry_matrix.py
          test -s scripts/run_page5_guard_full_entry_matrix.mjs
          test -s scripts/prepare_five_page_missing_constructor_matrix.py
          test -s scripts/prepare_page5_repeat_reentry_matrix.py

      - name: Prepare persisted runtime matrices
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            scripts/prepare_five_page_missing_constructor_matrix.py \
            scripts/prepare_page5_repeat_reentry_matrix.py \
            scripts/prepare_persisted_five_page_matrix.py \
            scripts/prepare_persisted_repeat_reentry_matrix.py
          OUTPUT_DIR="$FIVE_OUTPUT" python3 scripts/prepare_persisted_five_page_matrix.py --output "$FIVE_GENERATED"
          OUTPUT_DIR="$REPEAT_OUTPUT" python3 scripts/prepare_persisted_repeat_reentry_matrix.py --output "$REPEAT_GENERATED"
          node --check "$FIVE_GENERATED"
          node --check "$REPEAT_GENERATED"
          grep -Fq 'persisted-runtime-five-page-matrix' "$FIVE_GENERATED"
          grep -Fq 'candidateMarkerCount === 5' "$FIVE_GENERATED"
          grep -Fq 'persisted-runtime-page5-first-second-reentry-third-repeat-matrix' "$REPEAT_GENERATED"
          grep -Fq 'openTargetListCount === 3' "$REPEAT_GENERATED"
          sha256sum "$CURRENT_SECOND_PATH"
          test "$(sha256sum "$CURRENT_SECOND_PATH" | awk '{print $1}')" = "9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca"

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute persisted five-page matrix
        id: five_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          OUTPUT_DIR="$FIVE_OUTPUT" node "$FIVE_GENERATED" 2>&1 | tee /tmp/persisted-five-page-matrix.log

      - name: Execute persisted repeat and reentry matrix
        id: repeat_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          OUTPUT_DIR="$REPEAT_OUTPUT" node "$REPEAT_GENERATED" 2>&1 | tee /tmp/persisted-repeat-reentry-matrix.log

      - name: Build persisted browser validation status
        if: always()
        shell: bash
        env:
          FIVE_OUTCOME: ${{ steps.five_run.outcome }}
          REPEAT_OUTCOME: ${{ steps.repeat_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$FIVE_OUTPUT" "$REPEAT_OUTPUT"
          test -f /tmp/persisted-five-page-matrix.log && cp /tmp/persisted-five-page-matrix.log "$FIVE_OUTPUT/workflow.log" || true
          test -f /tmp/persisted-repeat-reentry-matrix.log && cp /tmp/persisted-repeat-reentry-matrix.log "$REPEAT_OUTPUT/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              p = Path(path)
              return json.loads(p.read_text(encoding='utf-8')) if p.exists() else None

          five = load(Path(os.environ['FIVE_OUTPUT']) / 'report.json')
          repeat = load(Path(os.environ['REPEAT_OUTPUT']) / 'report.json')
          five_summary = (five or {}).get('summary') or {}
          repeat_summary = (repeat or {}).get('summary') or {}
          ok = (
              bool(five) and bool(five.get('pass')) and os.environ.get('FIVE_OUTCOME') == 'success'
              and bool(repeat) and bool(repeat.get('pass')) and os.environ.get('REPEAT_OUTCOME') == 'success'
          )
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': {
                  'fivePage': os.environ.get('FIVE_OUTCOME', 'unknown'),
                  'repeatReentry': os.environ.get('REPEAT_OUTCOME', 'unknown'),
              },
              'ok': ok,
              'mode': 'persisted-runtime-browser-validation',
              'fivePage': {
                  'pass': bool((five or {}).get('pass')),
                  'summary': five_summary,
                  'candidatePatch': (five or {}).get('candidatePatch'),
              },
              'repeatReentry': {
                  'pass': bool((repeat or {}).get('pass')),
                  'summary': repeat_summary,
                  'candidatePatch': (repeat or {}).get('candidatePatch'),
                  'returnCssPoint': (repeat or {}).get('returnCssPoint'),
              },
              'persistedRuntimeSha256': '9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca',
              'runtimeFilesChanged': True,
              'productionDefaultChanged': False,
              'androidClientChanged': False,
              'apkBuilt': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_PERSISTED_BROWSER_VALIDATION_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-persisted-browser-validation
          path: |
            persisted-five-page-matrix
            persisted-repeat-reentry-matrix
            /tmp/PAGE5_PERSISTED_BROWSER_VALIDATION_STATUS.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish persisted browser validation status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f \
            scripts/run_page5_guard_full_entry_matrix.mjs \
            scripts/prepare_five_page_missing_constructor_matrix.py \
            scripts/prepare_page5_repeat_reentry_matrix.py \
            "$FIVE_GENERATED" \
            "$REPEAT_GENERATED"
          mkdir -p docs
          cp /tmp/PAGE5_PERSISTED_BROWSER_VALIDATION_STATUS.json docs/PAGE5_PERSISTED_BROWSER_VALIDATION_STATUS.json
          git add docs/PAGE5_PERSISTED_BROWSER_VALIDATION_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record persisted page five browser validation"
            git push origin HEAD:fix/page5-missing-constructor-mobile-bridge-20260806
          fi

      - name: Enforce persisted browser validation gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_PERSISTED_BROWSER_VALIDATION_STATUS.json >/dev/null
