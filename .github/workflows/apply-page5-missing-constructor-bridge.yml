name: Apply page five missing-constructor bridge

on:
  push:
    branches:
      - fix/page5-missing-constructor-mobile-bridge-20260806
    paths:
      - scripts/apply_page5_missing_constructor_bridge.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-page5-missing-constructor-bridge-20260806
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_FILE: game-engine/release/game-1.0.5.js

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Apply exact two-site patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_page5_missing_constructor_bridge.py
          python3 scripts/apply_page5_missing_constructor_bridge.py \
            --target "$TARGET_FILE" \
            --report /tmp/PAGE5_PATCH_REPORT.json
          node --check "$TARGET_FILE"
          git diff --check
          jq -e '
            .changed == true and
            .replacementCount == 2 and
            .guardReplacementCount == 1 and
            .callbackReplacementCount == 1 and
            .beforeSha256 == "ba8103ab7ef8ee8327df6d1d73daba8aca3a4c90d2370e30ab93001fce289112" and
            .afterSha256 == "9a5f9573077eaedada060ed4aeb3ea4307222ca29d4f10fd05fdb922d52d8fca"
          ' /tmp/PAGE5_PATCH_REPORT.json >/dev/null

      - name: Build implementation status
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          patch = json.loads(Path('/tmp/PAGE5_PATCH_REPORT.json').read_text(encoding='utf-8'))
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'ok': True,
              'mode': 'page5-missing-constructor-mobile-bridge-implementation',
              'patch': patch,
              'branchOnly': True,
              'browserEvidence': {
                  'fivePageMatrixStatus': 'passed on diagnostic branch',
                  'repeatReentryStatus': 'passed on diagnostic branch',
              },
              'runtimeFilesChanged': True,
              'productionDefaultChanged': False,
              'androidClientChanged': False,
              'apkBuilt': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'sourceCommit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_IMPLEMENTATION_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: page5-missing-constructor-bridge-patch
          path: |
            /tmp/PAGE5_PATCH_REPORT.json
            /tmp/PAGE5_IMPLEMENTATION_STATUS.json
          retention-days: 30

      - name: Commit branch-only implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_IMPLEMENTATION_STATUS.json docs/PAGE5_IMPLEMENTATION_STATUS.json
          git add "$TARGET_FILE" docs/PAGE5_IMPLEMENTATION_STATUS.json
          git diff --cached --check
          git commit -m "Fix page five mobile list entry compatibility"
          git push origin HEAD:fix/page5-missing-constructor-mobile-bridge-20260806

      - name: Enforce implementation gate
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_IMPLEMENTATION_STATUS.json >/dev/null
