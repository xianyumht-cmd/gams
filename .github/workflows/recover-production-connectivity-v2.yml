name: Recover production connectivity v2

on:
  push:
    branches: [main]
    paths:
      - ops/recover-production-connectivity.trigger
  workflow_dispatch:

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      LICENSE_HOST: license.xn--8pv109c.top
      RUNTIME_HOST: runtime.xn--8pv109c.top
      ZONE_NAME: xn--8pv109c.top
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attach domains, verify, and record
        shell: bash
        run: |
          set +e
          mkdir -p docs /tmp/gams-connectivity
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/domains"

          attach() {
            host="$1"; service="$2"; file="/tmp/gams-connectivity/${service}.json"
            code="$(curl -sS --connect-timeout 10 --max-time 30 --retry 2 --retry-all-errors \
              -o "$file" -w '%{http_code}' -X PUT \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H 'Content-Type: application/json' \
              --data "$(jq -nc --arg hostname "$host" --arg service "$service" --arg zone "$ZONE_NAME" '{hostname:$hostname,service:$service,zone_name:$zone}')" \
              "$api")"
            printf '%s' "$code" > "/tmp/gams-connectivity/${service}.http"
            jq -e '.success == true' "$file" >/dev/null 2>&1
          }

          license_attach=false
          runtime_attach=false
          attach "$LICENSE_HOST" gams-license-api && license_attach=true
          attach "$RUNTIME_HOST" gams-runtime-v2 && runtime_attach=true

          license_health=false
          runtime_health=false
          license_http=000
          runtime_http=000
          license_addr=""
          runtime_addr=""

          for attempt in $(seq 1 36); do
            license_addr="$(getent ahostsv4 "$LICENSE_HOST" 2>/dev/null | awk '{print $1}' | sort -u | paste -sd, -)"
            runtime_addr="$(getent ahostsv4 "$RUNTIME_HOST" 2>/dev/null | awk '{print $1}' | sort -u | paste -sd, -)"
            license_http="$(curl -sS --connect-timeout 8 --max-time 12 -o /tmp/gams-connectivity/license-health.json -w '%{http_code}' "https://${LICENSE_HOST}/health")"
            runtime_http="$(curl -sS --connect-timeout 8 --max-time 12 -o /tmp/gams-connectivity/runtime-health.json -w '%{http_code}' "https://${RUNTIME_HOST}/health")"
            if [[ "$license_http" == 200 ]] && jq -e '.ok == true and .service == "gams-license-api"' /tmp/gams-connectivity/license-health.json >/dev/null 2>&1; then license_health=true; fi
            if [[ "$runtime_http" == 200 ]] && jq -e '.ok == true and .service == "gams-runtime-v2"' /tmp/gams-connectivity/runtime-health.json >/dev/null 2>&1; then runtime_health=true; fi
            [[ "$license_health" == true && "$runtime_health" == true ]] && break
            sleep 5
          done

          compact_attach() {
            service="$1"; file="/tmp/gams-connectivity/${service}.json"; http="$(cat /tmp/gams-connectivity/${service}.http 2>/dev/null)"
            if [[ -s "$file" ]]; then
              jq -c --arg http "${http:-000}" '{httpStatus:$http,success:(.success // false),errors:[(.errors // [])[]|{code,message}],result:(if .success then {hostname:.result.hostname,service:.result.service,zone_name:.result.zone_name} else null end)}' "$file"
            else
              jq -nc --arg http "${http:-000}" '{httpStatus:$http,success:false,errors:[{code:"no_response",message:"No Cloudflare response"}],result:null}'
            fi
          }

          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg triggerCommit "$GITHUB_SHA" \
            --argjson licenseAttach "$(compact_attach gams-license-api)" \
            --argjson runtimeAttach "$(compact_attach gams-runtime-v2)" \
            --arg licenseHttp "$license_http" \
            --arg runtimeHttp "$runtime_http" \
            --arg licenseAddr "$license_addr" \
            --arg runtimeAddr "$runtime_addr" \
            --argjson licenseHealth "$license_health" \
            --argjson runtimeHealth "$runtime_health" \
            '{schemaVersion:2,generatedAt:$generatedAt,triggerCommit:$triggerCommit,operation:"attach-existing-workers-to-custom-domains",license:{attach:$licenseAttach,check:{host:"license.xn--8pv109c.top",addresses:($licenseAddr|split(",")|map(select(length>0))),httpStatus:$licenseHttp,healthOk:$licenseHealth}},runtime:{attach:$runtimeAttach,check:{host:"runtime.xn--8pv109c.top",addresses:($runtimeAddr|split(",")|map(select(length>0))),httpStatus:$runtimeHttp,healthOk:$runtimeHealth}},secretsExposed:false}' \
            > docs/PRODUCTION_CONNECTIVITY_RECOVERY.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PRODUCTION_CONNECTIVITY_RECOVERY.json
          git commit -m "Record production connectivity recovery" || true
          git pull --rebase origin main
          git push origin HEAD:main

          [[ "$license_attach" == true && "$runtime_attach" == true && "$license_health" == true && "$runtime_health" == true ]]
