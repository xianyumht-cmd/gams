name: Test latest page lifecycle request trace

on:
  push:
    branches:
      - diagnostics/latest-page-lifecycle-trace-20260804
    paths:
      - scripts/run_latest_page_lifecycle_request_trace.mjs
      - .github/workflows/test-latest-page-lifecycle-request-trace.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-page-lifecycle-request-trace-20260804
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      OUTPUT_DIR: latest-page-lifecycle-request-trace
      CURRENT_FIRST_PATH: remote-script/src/noname.js
      CURRENT_SECOND_PATH: game-engine/release/game-1.0.5.js

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/latest-page-lifecycle-trace-20260804
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate diagnostic inputs
        shell: bash
        run: |
          set -euo pipefail
          test -s "$CURRENT_FIRST_PATH"
          test -s "$CURRENT_SECOND_PATH"
          grep -Fq '@version      1.1.4' "$CURRENT_FIRST_PATH"
          node --check scripts/run_latest_page_lifecycle_request_trace.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute baseline and diagnostics matrix
        id: trace_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_latest_page_lifecycle_request_trace.mjs 2>&1 | tee /tmp/latest-page-lifecycle-request-trace.log

      - name: Build status
        if: always()
        shell: bash
        env:
          TRACE_OUTCOME: ${{ steps.trace_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/latest-page-lifecycle-request-trace.log && cp /tmp/latest-page-lifecycle-request-trace.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output_dir = Path(os.environ["OUTPUT_DIR"])
          report_path = output_dir / "report.json"
          report = json.loads(report_path.read_text(encoding="utf-8")) if report_path.exists() else None
          summary = report.get("summary") if report else None
          ok = bool(report) and bool(report.get("pass")) and os.environ.get("TRACE_OUTCOME") == "success"
          status = {
              "schemaVersion": 1,
              "generatedAt": datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z"),
              "runId": int(os.environ["GITHUB_RUN_ID"]),
              "state": "completed",
              "workflowOutcome": os.environ.get("TRACE_OUTCOME", "unknown"),
              "ok": ok,
              "mode": "current-baseline-vs-diagnostics-only-lifecycle-request-trace",
              "summary": summary,
              "reportAvailable": bool(report),
              "artifactName": "latest-page-lifecycle-request-trace",
              "apkBuilt": False,
              "productionDefaultChanged": False,
              "authorizationOutcomeModified": False,
              "branch": os.environ.get("GITHUB_REF_NAME", ""),
              "commit": os.environ.get("GITHUB_SHA", ""),
          }
          Path("/tmp/LATEST_PAGE_LIFECYCLE_REQUEST_TRACE_STATUS.json").write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latest-page-lifecycle-request-trace
          path: latest-page-lifecycle-request-trace
          retention-days: 30
          if-no-files-found: warn

      - name: Publish branch status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/LATEST_PAGE_LIFECYCLE_REQUEST_TRACE_STATUS.json docs/LATEST_PAGE_LIFECYCLE_REQUEST_TRACE_STATUS.json
          git add docs/LATEST_PAGE_LIFECYCLE_REQUEST_TRACE_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record latest page lifecycle request trace status"
            git push origin HEAD:diagnostics/latest-page-lifecycle-trace-20260804
          fi

      - name: Enforce diagnostic gate
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/LATEST_PAGE_LIFECYCLE_REQUEST_TRACE_STATUS.json >/dev/null
