name: Probe page five side button callbacks

on:
  push:
    branches:
      - diagnostics/page5-guard-full-entry-20260805
    paths:
      - scripts/run_page5_side_button_callback_inventory.mjs
      - .github/workflows/run-page5-canvas-element-list-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: page5-side-button-callback-inventory-20260805
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OUTPUT_DIR: page5-side-button-callback-inventory

    steps:
      - uses: actions/checkout@v4
        with:
          ref: diagnostics/page5-guard-full-entry-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate callback inventory probe
        shell: bash
        run: node --check scripts/run_page5_side_button_callback_inventory.mjs

      - name: Install Chromium
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.52.0
          npx playwright install --with-deps chromium

      - name: Execute callback inventory probe
        id: probe_run
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node scripts/run_page5_side_button_callback_inventory.mjs 2>&1 | tee /tmp/page5-side-button-callback-inventory.log

      - name: Build callback inventory status
        if: always()
        shell: bash
        env:
          PROBE_OUTCOME: ${{ steps.probe_run.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$OUTPUT_DIR"
          test -f /tmp/page5-side-button-callback-inventory.log && cp /tmp/page5-side-button-callback-inventory.log "$OUTPUT_DIR/workflow.log" || true
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          output = Path(os.environ['OUTPUT_DIR'])
          report_path = output / 'report.json'
          report = json.loads(report_path.read_text(encoding='utf-8')) if report_path.exists() else None
          inventory = report.get('inventory', []) if report else []
          click_counts = {
              str(item.get('index')): len(item.get('events', {}).get('mouse click', []))
              for item in inventory if isinstance(item, dict)
          }
          ok = bool(report) and bool(report.get('pass')) and os.environ.get('PROBE_OUTCOME') == 'success'
          status = {
              'schemaVersion': 1,
              'generatedAt': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z'),
              'runId': int(os.environ['GITHUB_RUN_ID']),
              'state': 'completed',
              'workflowOutcome': os.environ.get('PROBE_OUTCOME', 'unknown'),
              'ok': ok,
              'mode': 'page5-side-button-callback-inventory-read-only',
              'pauseCaptured': report.get('pauseCaptured') if report else None,
              'inventoryCount': len(inventory),
              'clickCounts': click_counts,
              'screenshotChanged': report.get('screenshotChanged') if report else None,
              'mainFrameValid': report.get('mainFrameValid') if report else None,
              'pageErrorCount': len(report.get('pageErrors', [])) if report else None,
              'blockedOrderCount': len(report.get('blockedOrders', [])) if report else None,
              'debuggerErrorCount': len(report.get('debuggerErrors', [])) if report else None,
              'reportAvailable': bool(report),
              'artifactName': 'page5-side-button-callback-inventory',
              'readOnlyProbe': True,
              'pageScriptModified': False,
              'candidateTested': False,
              'repeatSequenceTested': False,
              'apkBuilt': False,
              'productionDefaultChanged': False,
              'runtimeFilesChanged': False,
              'androidClientChanged': False,
              'authorizationOutcomeModified': False,
              'paymentCompleted': False,
              'branch': os.environ.get('GITHUB_REF_NAME', ''),
              'commit': os.environ.get('GITHUB_SHA', ''),
          }
          Path('/tmp/PAGE5_SIDE_BUTTON_CALLBACK_INVENTORY_STATUS.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(status, ensure_ascii=False, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page5-side-button-callback-inventory
          path: page5-side-button-callback-inventory
          retention-days: 30
          if-no-files-found: warn

      - name: Publish callback inventory status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p docs
          cp /tmp/PAGE5_SIDE_BUTTON_CALLBACK_INVENTORY_STATUS.json docs/PAGE5_SIDE_BUTTON_CALLBACK_INVENTORY_STATUS.json
          git add docs/PAGE5_SIDE_BUTTON_CALLBACK_INVENTORY_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m "Record page five side button callback inventory"
            git push origin HEAD:diagnostics/page5-guard-full-entry-20260805
          fi

      - name: Enforce callback inventory capture
        if: always()
        shell: bash
        run: jq -e '.ok == true' /tmp/PAGE5_SIDE_BUTTON_CALLBACK_INVENTORY_STATUS.json >/dev/null
