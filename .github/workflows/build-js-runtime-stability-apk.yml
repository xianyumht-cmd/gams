name: Build JS runtime stability APK

on:
  workflow_run:
    workflows:
      - Build isolated page five bridge candidate
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: js-runtime-stability-apk-20260807
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event.workflow_run.id == 31041269145 &&
      github.event.workflow_run.run_attempt >= 2 &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMPLEMENTATION_BRANCH: fix/page5-missing-constructor-mobile-bridge-20260806
      APK_VERSION_NAME: 2.0.14-page5-stability
      APK_VERSION_CODE: 25
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify deployed stability repair
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GG_RELEASE_KEYSTORE_BASE64:-}"
          test -n "${GG_RELEASE_KEYSTORE_PASSWORD:-}"
          test -s v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeStabilityPatch.java
          grep -Fq 'RuntimeStabilityPatch.patchNoname(noname)' v2/android/client/src/main/java/com/jinli/ggsecure/RuntimePayload.java
          grep -Fq 'RuntimeStabilityPatch.patchGame(game)' v2/android/client/src/main/java/com/jinli/ggsecure/RuntimePayload.java
          grep -Fq 'Symbol.for("gg.runtime.storage-hook.v2")' v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeStabilityPatch.java
          grep -Fq 'Symbol.for("gg.runtime.xhr-open.v2")' v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeStabilityPatch.java
          grep -Fq 'Symbol.for("gg.runtime.jsonp-create-element.v2")' v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeStabilityPatch.java
          grep -Fq '__gg_engine_load_started_at__' v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeStabilityPatch.java
          grep -Fq 'versionCode = 16' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.3-stable"' v2/android/client/build.gradle.kts
          grep -Fq 'PROTOCOL_APP_VERSION = 12' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java

      - name: Patch candidate identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          manager = Path('v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java')
          text = manager.read_text(encoding='utf-8')
          if text.count('PROTOCOL_APP_VERSION = 12') != 1:
              raise SystemExit('protocol baseline mismatch')
          manager.write_text(text.replace('PROTOCOL_APP_VERSION = 12', 'PROTOCOL_APP_VERSION = 24', 1), encoding='utf-8')

          gradle = Path('v2/android/client/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          if text.count('versionCode = 16') != 1 or text.count('versionName = "2.0.3-stable"') != 1:
              raise SystemExit('APK baseline mismatch')
          text = text.replace('versionCode = 16', 'versionCode = 25', 1)
          text = text.replace('versionName = "2.0.3-stable"', 'versionName = "2.0.14-page5-stability"', 1)
          gradle.write_text(text, encoding='utf-8')
          PY

      - name: Build sign and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p v2/android :client:clean :client:lintRelease :client:assembleRelease
          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$unsigned"

          trap 'rm -f /tmp/gg-release.jks' EXIT
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/gg-release.jks
          test -s /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool-stability.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool-stability.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"

          mkdir -p /tmp/js-runtime-stability-artifact
          signed="/tmp/js-runtime-stability-artifact/GG-${APK_VERSION_NAME}-code${APK_VERSION_CODE}.apk"
          "$apksigner" sign \
            --ks /tmp/gg-release.jks --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false --out "$signed" "$unsigned"
          "$apksigner" verify --verbose --print-certs "$signed" > /tmp/apk-stability-verify.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apk-stability-verify.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apk-stability-verify.txt
          "$aapt" dump badging "$signed" > /tmp/apk-stability-badging.txt
          grep -Fq "package: name='com.jinli.quickweb' versionCode='25' versionName='2.0.14-page5-stability'" /tmp/apk-stability-badging.txt
          sha256sum "$signed" | tee /tmp/js-runtime-stability-artifact/SHA256SUMS.txt
          jq -n \
            --arg versionName "$APK_VERSION_NAME" \
            --argjson versionCode "$APK_VERSION_CODE" \
            --arg sourceCommit "$(git rev-parse HEAD)" \
            '{schemaVersion:1,kind:"js-runtime-stability-candidate",versionName:$versionName,versionCode:$versionCode,sourceCommit:$sourceCommit,repair:{signedRuntimeVerifiedBeforePatch:true,prototypePollutionRemoved:true,reentryHooksIdempotent:true,resourceExhaustionGuardRemoved:true,staleLoadingRecovery:true},unrelatedLogicChanged:false}' \
            > /tmp/js-runtime-stability-artifact/CANDIDATE_INFO.json

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: GG-2.0.14-page5-stability-code25
          path: /tmp/js-runtime-stability-artifact/**
          retention-days: 30
          if-no-files-found: error

      - name: Record build status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.apk.outcome }}" == success && "${{ steps.artifact.outcome }}" == success ]]; then ok=true; fi
          apk_sha=''
          if [[ -f /tmp/js-runtime-stability-artifact/SHA256SUMS.txt ]]; then apk_sha="$(awk '{print $1}' /tmp/js-runtime-stability-artifact/SHA256SUMS.txt | head -n1)"; fi
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson ok "$ok" \
            --arg versionName "$APK_VERSION_NAME" \
            --argjson versionCode "$APK_VERSION_CODE" \
            --arg sha256 "$apk_sha" \
            '{schemaVersion:1,generatedAt:$generatedAt,runId:$runId,ok:$ok,apk:{versionName:$versionName,versionCode:$versionCode,sha256:$sha256},repairScope:"runtime-stability-only",secretsExposed:false}' \
            > /tmp/JS_RUNTIME_STABILITY_APK_STATUS.json
          git fetch origin "$IMPLEMENTATION_BRANCH" --quiet
          git reset --hard "origin/${IMPLEMENTATION_BRANCH}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs
          cp /tmp/JS_RUNTIME_STABILITY_APK_STATUS.json docs/JS_RUNTIME_STABILITY_APK_STATUS.json
          git add docs/JS_RUNTIME_STABILITY_APK_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record JS runtime stability APK build'
            git push origin "HEAD:${IMPLEMENTATION_BRANCH}"
          fi
          [[ "$ok" == true ]]
