name: Dispatch GG 2.0.6 browser regression release

on:
  push:
    branches:
      - main
    paths:
      - ops/trigger-2.0.6-browser-regression.txt

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch registered release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-2.0.6-browser-regression.yml/dispatches" \
            -f ref=main
