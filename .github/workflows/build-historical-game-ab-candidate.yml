name: Build historical game baseline A/B candidate

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/build-historical-game-ab-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: historical-game-ab-candidate-20260804
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CANDIDATE_BRANCH: candidate-game-baseline-ab-20260804
      CANDIDATE_RUNTIME_DIR: candidate-runtime-game-baseline/release
      CANDIDATE_RUNTIME_VERSION: 2.0.7-game-baseline-ab-c1
      CANDIDATE_APP_VERSION: 21
      APK_VERSION_NAME: 2.0.11-game-baseline-ab
      APK_VERSION_CODE: 21
      HISTORICAL_GAME_FILE: game-engine/release/game-1.0.2.js
      HISTORICAL_GAME_SIZE: 11589175
      HISTORICAL_GAME_SHA256: 51ae52887d0c0475870e4c985edf747a14672f0908221779826934f37b73db43
      CURRENT_GAME_VERSION: 1.0.5
      CURRENT_GAME_SHA256: ba8103ab7ef8ee8327df6d1d73daba8aca3a4c90d2370e30ab93001fce289112
      RUNTIME_WORKER_HOST: gams-runtime-v2.2320006072.workers.dev
      RUNTIME_CUSTOM_HOST: runtime.xn--8pv109c.top
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
      RUNTIME_MASTER_KEY: ${{ secrets.RUNTIME_MASTER_KEY }}
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Verify single-variable baseline
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID TOKEN_SIGNING_SECRET RUNTIME_MASTER_KEY GG_RELEASE_KEYSTORE_BASE64 GG_RELEASE_KEYSTORE_PASSWORD; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          test "${#TOKEN_SIGNING_SECRET}" -ge 32
          python3 -m py_compile scripts/apply_historical_game_ab_candidate.py v2/runtime/tools/build_release.py
          node --check remote-script/src/noname.js
          grep -Fq '@version      1.1.4' remote-script/src/noname.js
          test -s "$HISTORICAL_GAME_FILE"
          test "$(stat -c%s "$HISTORICAL_GAME_FILE")" = "$HISTORICAL_GAME_SIZE"
          test "$(sha256sum "$HISTORICAL_GAME_FILE" | awk '{print $1}')" = "$HISTORICAL_GAME_SHA256"
          jq -e --arg v "$CURRENT_GAME_VERSION" --arg h "$CURRENT_GAME_SHA256" '.versionName == $v and .sha256 == $h' game-engine/release/manifest.json >/dev/null
          test "$(jq -r '.file' game-engine/release/manifest.json)" != "$(basename "$HISTORICAL_GAME_FILE")"
          grep -Fq 'versionCode = 16' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.3-stable"' v2/android/client/build.gradle.kts
          grep -Fq 'PROTOCOL_APP_VERSION = 12' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          sha256sum v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java > /tmp/main-activity.sha256
          sha256sum v2/android/client/src/main/java/com/jinli/ggsecure/RuntimeNames.java > /tmp/runtime-names.sha256

      - name: Build and publish historical game runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet cryptography
          git fetch origin main --quiet
          git fetch origin "$CANDIDATE_BRANCH" --quiet || true
          rm -rf /tmp/gams-game-ab
          if git show-ref --verify --quiet "refs/remotes/origin/${CANDIDATE_BRANCH}"; then
            git worktree add /tmp/gams-game-ab "origin/${CANDIDATE_BRANCH}"
            cd /tmp/gams-game-ab
            git checkout -B "$CANDIDATE_BRANCH" "origin/${CANDIDATE_BRANCH}"
            git reset --hard origin/main
          else
            git worktree add -b "$CANDIDATE_BRANCH" /tmp/gams-game-ab origin/main
            cd /tmp/gams-game-ab
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          test -s "$HISTORICAL_GAME_FILE"
          test "$(stat -c%s "$HISTORICAL_GAME_FILE")" = "$HISTORICAL_GAME_SIZE"
          test "$(sha256sum "$HISTORICAL_GAME_FILE" | awk '{print $1}')" = "$HISTORICAL_GAME_SHA256"
          rm -rf "$CANDIDATE_RUNTIME_DIR"
          mkdir -p "$CANDIDATE_RUNTIME_DIR"

          export RUNTIME_SIGNING_PASSWORD="$(python3 - <<'PY'
          import hashlib, hmac, os
          print(hmac.new(
              os.environ['GG_RELEASE_KEYSTORE_PASSWORD'].encode(),
              b'gams-runtime-release-signing-v1',
              hashlib.sha256,
          ).hexdigest())
          PY
          )"
          trap 'rm -f /tmp/game-ab-private.pem /tmp/game-ab.sig /tmp/v2-runtime-canonical.txt /tmp/v2-runtime-unsigned.json' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 \
            -in remote-script/keys/private.pem.enc \
            -out /tmp/game-ab-private.pem \
            -pass env:RUNTIME_SIGNING_PASSWORD
          unset RUNTIME_SIGNING_PASSWORD

          python3 v2/runtime/tools/build_release.py \
            remote-script/src/noname.js \
            "$HISTORICAL_GAME_FILE" \
            "$CANDIDATE_RUNTIME_VERSION" \
            "$RUNTIME_MASTER_KEY" \
            "$CANDIDATE_RUNTIME_DIR"
          openssl dgst -sha256 -sign /tmp/game-ab-private.pem \
            -out /tmp/game-ab.sig /tmp/v2-runtime-canonical.txt
          openssl dgst -sha256 -verify remote-script/keys/public.pem \
            -signature /tmp/game-ab.sig /tmp/v2-runtime-canonical.txt

          python3 - <<'PY'
          import base64, hashlib, io, json, os, re, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          release = Path(os.environ['CANDIDATE_RUNTIME_DIR'])
          manifest = json.loads(Path('/tmp/v2-runtime-unsigned.json').read_text())
          manifest['signatureAlgorithm'] = 'SHA256withECDSA'
          manifest['signature'] = base64.b64encode(Path('/tmp/game-ab.sig').read_bytes()).decode()
          (release / 'manifest.json').write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          bundle = (release / manifest['file']).read_bytes()
          assert len(bundle) == manifest['size']
          assert hashlib.sha256(bundle).hexdigest() == manifest['sha256']
          assert manifest['gameSize'] == int(os.environ['HISTORICAL_GAME_SIZE'])
          assert manifest['gameSha256'] == os.environ['HISTORICAL_GAME_SHA256']

          text = os.environ['RUNTIME_MASTER_KEY'].strip()
          if re.fullmatch(r'[0-9a-fA-F]{64}', text):
              master = bytes.fromhex(text)
          else:
              normalized = text.replace('-', '+').replace('_', '/')
              normalized += '=' * ((4 - len(normalized) % 4) % 4)
              master = base64.b64decode(normalized)
          content_key = AESGCM(master).decrypt(
              base64.b64decode(manifest['keyIv']),
              base64.b64decode(manifest['keyCipher']),
              f"gg-v2-key|{manifest['versionName']}".encode(),
          )
          plain = AESGCM(content_key).decrypt(
              base64.b64decode(manifest['iv']),
              bundle,
              f"gg-v2-runtime|{manifest['versionName']}".encode(),
          )
          with zipfile.ZipFile(io.BytesIO(plain)) as archive:
              assert archive.namelist() == ['noname.js', 'game.js']
              assert archive.testzip() is None
              noname = archive.read('noname.js')
              game = archive.read('game.js')
          source_noname = Path('remote-script/src/noname.js').read_bytes()
          expected_noname = source_noname
          for old in (
              b'https://gams-script-edge.2320006072.workers.dev/engine/stable.js',
              b'https://preview-chat-1b176371-f9ab-4760-b15c-b9d70ed59d23.space-z.ai/game.js',
          ):
              expected_noname = expected_noname.replace(old, b'https://ggv2.local/runtime/game.js')
          expected_game = Path(os.environ['HISTORICAL_GAME_FILE']).read_bytes()
          assert noname == expected_noname
          assert game == expected_game
          assert hashlib.sha256(noname).hexdigest() == manifest['nonameSha256']
          assert hashlib.sha256(game).hexdigest() == os.environ['HISTORICAL_GAME_SHA256']
          PY

          git add "$CANDIDATE_RUNTIME_DIR"
          git add -f "$CANDIDATE_RUNTIME_DIR/bundle-${CANDIDATE_RUNTIME_VERSION}.bin"
          git commit -m 'Build historical game baseline A/B runtime'
          git push --force-with-lease origin "HEAD:${CANDIDATE_BRANCH}"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          raw_base="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${CANDIDATE_BRANCH}/${CANDIDATE_RUNTIME_DIR}"
          version=''
          for attempt in $(seq 1 30); do
            version="$(curl -fsS "${raw_base}/manifest.json?attempt=${attempt}" | jq -r '.versionName' 2>/dev/null || true)"
            if [[ "$version" == "$CANDIDATE_RUNTIME_VERSION" ]]; then break; fi
            sleep 3
          done
          test "$version" = "$CANDIDATE_RUNTIME_VERSION"
          published_file="$(curl -fsS "${raw_base}/manifest.json?final=1" | jq -r '.file')"
          curl -fsS "${raw_base}/${published_file}?final=1" -o /tmp/published-game-ab.bin
          expected_bundle_sha="$(jq -r '.sha256' "$CANDIDATE_RUNTIME_DIR/manifest.json")"
          test "$(sha256sum /tmp/published-game-ab.bin | awk '{print $1}')" = "$expected_bundle_sha"

      - name: Add default-preserving historical channel
        id: source
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          git pull --rebase origin main
          python3 scripts/apply_historical_game_ab_candidate.py
          python3 scripts/apply_historical_game_ab_candidate.py
          node --check v2/runtime/src/index.js
          grep -Fq 'const HISTORICAL_GAME_AB_APP_VERSION = 21;' v2/runtime/src/index.js
          grep -Fq '2.0.7-game-baseline-ab-c1' v2/runtime/src/index.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add v2/runtime/src/index.js
          if ! git diff --cached --quiet; then git commit -m 'Add historical game baseline A/B runtime channel'; fi
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Deploy runtime Worker
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          response="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          database_id="$(printf '%s' "$response" | jq -r '.result[] | select(.name=="gams-license-db") | (.uuid // .id)' | head -n1)"
          test -n "$database_id" && test "$database_id" != null
          sed "s/__D1_DATABASE_ID__/${database_id}/g" v2/runtime/wrangler.template.jsonc > v2/runtime/wrangler.game-ab.generated.jsonc
          cd v2/runtime
          printf '%s' "$TOKEN_SIGNING_SECRET" | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.game-ab.generated.jsonc
          printf '%s' "$RUNTIME_MASTER_KEY" | npx --yes wrangler@4 secret put RUNTIME_MASTER_KEY --config wrangler.game-ab.generated.jsonc
          npx --yes wrangler@4 deploy --config wrangler.game-ab.generated.jsonc

      - name: Verify default and historical channels
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          candidate_ok=false
          default_ok=false
          for attempt in $(seq 1 24); do
            candidate_body="$(curl -fsS --connect-timeout 5 --max-time 15 "https://${RUNTIME_WORKER_HOST}/health?candidate=21&attempt=${attempt}" 2>/dev/null || true)"
            default_body="$(curl -fsS --connect-timeout 5 --max-time 15 "https://${RUNTIME_WORKER_HOST}/health?attempt=${attempt}" 2>/dev/null || true)"
            if printf '%s' "$candidate_body" | jq -e '.ok == true and .historicalGameAbAppVersion == 21 and .historicalGameAbRuntimeVersion == "2.0.7-game-baseline-ab-c1"' >/dev/null 2>&1; then candidate_ok=true; fi
            if printf '%s' "$default_body" | jq -e '.ok == true and .encryptedRuntime == true and .historicalGameAbRuntimeVersion == null' >/dev/null 2>&1; then default_ok=true; fi
            if [[ "$candidate_ok" == true && "$default_ok" == true ]]; then break; fi
            sleep 5
          done
          [[ "$candidate_ok" == true && "$default_ok" == true ]]
          custom_code="$(curl -sS --connect-timeout 5 --max-time 15 -o /tmp/custom-game-ab.json -w '%{http_code}' "https://${RUNTIME_CUSTOM_HOST}/health?candidate=21" || true)"
          printf '%s' "$custom_code" > /tmp/custom-game-ab-code.txt

      - name: Patch candidate client only
        id: client_patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          manager = Path('v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java')
          text = manager.read_text(encoding='utf-8')
          if text.count('PROTOCOL_APP_VERSION = 12') != 1:
              raise SystemExit('protocol baseline mismatch')
          manager.write_text(text.replace('PROTOCOL_APP_VERSION = 12', 'PROTOCOL_APP_VERSION = 21', 1), encoding='utf-8')

          gradle = Path('v2/android/client/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          if text.count('versionCode = 16') != 1 or text.count('versionName = "2.0.3-stable"') != 1:
              raise SystemExit('APK baseline mismatch')
          text = text.replace('versionCode = 16', 'versionCode = 21', 1)
          text = text.replace('versionName = "2.0.3-stable"', 'versionName = "2.0.11-game-baseline-ab"', 1)
          gradle.write_text(text, encoding='utf-8')
          PY
          sha256sum -c /tmp/main-activity.sha256
          sha256sum -c /tmp/runtime-names.sha256
          grep -Fq 'PROTOCOL_APP_VERSION = 21' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          grep -Fq 'versionCode = 21' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.11-game-baseline-ab"' v2/android/client/build.gradle.kts

      - name: Build sign and verify APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p v2/android :client:clean :client:lintRelease :client:assembleRelease
          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$unsigned"

          trap 'rm -f /tmp/gg-release.jks' EXIT
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > /tmp/gg-release.jks
          test -s /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool-game-ab.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool-game-ab.txt

          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"

          mkdir -p /tmp/historical-game-ab
          signed="/tmp/historical-game-ab/GG-${APK_VERSION_NAME}-code${APK_VERSION_CODE}.apk"
          "$apksigner" sign \
            --ks /tmp/gg-release.jks --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false --out "$signed" "$unsigned"
          "$apksigner" verify --verbose --print-certs "$signed" > /tmp/apk-game-ab-verify.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' /tmp/apk-game-ab-verify.txt
          grep -Fq 'Verified using v3 scheme (APK Signature Scheme v3): true' /tmp/apk-game-ab-verify.txt
          "$aapt" dump badging "$signed" > /tmp/apk-game-ab-badging.txt
          grep -Fq "package: name='com.jinli.quickweb' versionCode='21' versionName='2.0.11-game-baseline-ab'" /tmp/apk-game-ab-badging.txt
          sha256sum "$signed" | tee /tmp/historical-game-ab/SHA256SUMS.txt
          jq -n \
            --arg versionName "$APK_VERSION_NAME" \
            --argjson versionCode "$APK_VERSION_CODE" \
            --arg runtimeVersion "$CANDIDATE_RUNTIME_VERSION" \
            --arg historicalGameVersion '1.0.2' \
            --arg historicalGameSha256 "$HISTORICAL_GAME_SHA256" \
            --arg sourceCommit "${{ steps.runtime.outputs.source_sha }}" \
            '{schemaVersion:1,kind:"historical-game-baseline-ab",versionName:$versionName,versionCode:$versionCode,runtimeVersion:$runtimeVersion,historicalGameVersion:$historicalGameVersion,historicalGameSha256:$historicalGameSha256,sourceCommit:$sourceCommit,isolation:{stableFirstFile:true,onlySecondFileVersionChanged:true,androidMainActivityChanged:false,clientNetworkHostsChanged:false,productionDefaultChannelChanged:false}}' \
            > /tmp/historical-game-ab/CANDIDATE_INFO.json

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: GG-2.0.11-game-baseline-ab
          path: /tmp/historical-game-ab/**
          retention-days: 30
          if-no-files-found: error

      - name: Record candidate status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.verify.outcome }}" == success \
             && "${{ steps.runtime.outcome }}" == success \
             && "${{ steps.source.outcome }}" == success \
             && "${{ steps.deploy.outcome }}" == success \
             && "${{ steps.probe.outcome }}" == success \
             && "${{ steps.client_patch.outcome }}" == success \
             && "${{ steps.apk.outcome }}" == success \
             && "${{ steps.artifact.outcome }}" == success ]]; then
            ok=true
          fi
          apk_sha=''
          if [[ -f /tmp/historical-game-ab/SHA256SUMS.txt ]]; then apk_sha="$(awk '{print $1}' /tmp/historical-game-ab/SHA256SUMS.txt | head -n1)"; fi
          custom_code="$(cat /tmp/custom-game-ab-code.txt 2>/dev/null || true)"
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson ok "$ok" \
            --arg apkVersionName "$APK_VERSION_NAME" \
            --argjson apkVersionCode "$APK_VERSION_CODE" \
            --arg apkSha256 "$apk_sha" \
            --arg runtimeVersion "$CANDIDATE_RUNTIME_VERSION" \
            --arg branch "$CANDIDATE_BRANCH" \
            --arg historicalGameVersion '1.0.2' \
            --arg historicalGameSha256 "$HISTORICAL_GAME_SHA256" \
            --arg customDomainHttpCode "$custom_code" \
            --arg verify "${{ steps.verify.outcome }}" \
            --arg runtime "${{ steps.runtime.outcome }}" \
            --arg source "${{ steps.source.outcome }}" \
            --arg deploy "${{ steps.deploy.outcome }}" \
            --arg probe "${{ steps.probe.outcome }}" \
            --arg clientPatch "${{ steps.client_patch.outcome }}" \
            --arg apk "${{ steps.apk.outcome }}" \
            --arg artifact "${{ steps.artifact.outcome }}" \
            '{schemaVersion:1,generatedAt:$generatedAt,runId:$runId,ok:$ok,apk:{versionName:$apkVersionName,versionCode:$apkVersionCode,sha256:$apkSha256},runtime:{version:$runtimeVersion,branch:$branch},versionPair:{firstFile:"1.1.4",secondFile:$historicalGameVersion,secondFileSha256:$historicalGameSha256},probe:{worker:true,customDomainHttpCode:$customDomainHttpCode},isolation:{onlySecondFileVersionChanged:true,androidMainActivityChanged:false,clientNetworkHostsChanged:false,productionDefaultChannelChanged:false},steps:{verify:$verify,runtime:$runtime,source:$source,deploy:$deploy,probe:$probe,clientPatch:$clientPatch,apk:$apk,artifact:$artifact},secretsExposed:false}' \
            > /tmp/HISTORICAL_GAME_AB_CANDIDATE_STATUS.json
          git fetch origin main --quiet
          git checkout -B status-main origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p docs
          cp /tmp/HISTORICAL_GAME_AB_CANDIDATE_STATUS.json docs/HISTORICAL_GAME_AB_CANDIDATE_STATUS.json
          git add docs/HISTORICAL_GAME_AB_CANDIDATE_STATUS.json
          if ! git diff --cached --quiet; then git commit -m 'Record historical game baseline A/B candidate'; git push origin HEAD:main; fi
          [[ "$ok" == true ]]
