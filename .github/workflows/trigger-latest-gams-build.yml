name: Trigger latest GAMS APK build

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/trigger-latest-gams-build.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Remove one-shot trigger
        shell: bash
        run: |
          rm -f .github/workflows/trigger-latest-gams-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove one-shot GAMS build trigger"
          git push origin HEAD:main
