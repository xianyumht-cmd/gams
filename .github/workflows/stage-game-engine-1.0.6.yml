name: Temporary stage engine 1.0.6

on:
  push:
    branches: [main]
    paths:
      - '.release-upload/**'

permissions:
  contents: write
  actions: write

jobs:
  signature:
    if: github.event.head_commit.message == 'Generate temporary engine signature 1.0.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Build block signature
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .release-upload
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path

          source = Path('game-engine/release/game-1.0.5.js')
          data = source.read_bytes()
          block_size = 8192
          blocks = []
          full_bytes = (len(data) // block_size) * block_size
          for offset in range(0, full_bytes, block_size):
              block = data[offset:offset + block_size]
              n = len(block)
              a = sum(block) & 0xffff
              b = sum((n-j) * value for j, value in enumerate(block)) & 0xffff
              blocks.append([offset // block_size, (b << 16) | a, hashlib.sha256(block).hexdigest()])
          out = {
              'schema': 1,
              'block_size': block_size,
              'source_size': len(data),
              'source_sha256': hashlib.sha256(data).hexdigest(),
              'blocks': blocks,
          }
          Path('.release-upload/old-1.0.5.sig.json').write_text(json.dumps(out, separators=(',', ':')), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-upload/old-1.0.5.sig.json
          git commit -m 'Store temporary engine signature 1.0.6'
          git push origin HEAD:main

  finalize:
    if: github.event.head_commit.message == 'Stage temporary engine patch 1.0.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Reconstruct, verify and dispatch signed publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json
          from pathlib import Path

          source = Path('game-engine/release/game-1.0.5.js').read_bytes()
          patch = json.loads(Path('.release-upload/patch-1.0.6.json').read_text(encoding='utf-8'))
          if hashlib.sha256(source).hexdigest() != patch['source_sha256']:
              raise SystemExit('source SHA-256 mismatch')
          block_size = int(patch['block_size'])
          out = bytearray()
          for op in patch['ops']:
              if op[0] == 'c':
                  index = int(op[1])
                  start = index * block_size
                  out.extend(source[start:start + block_size])
              elif op[0] == 'l':
                  out.extend(base64.b64decode(op[1]))
              else:
                  raise SystemExit('invalid patch operation')
          data = bytes(out)
          if len(data) != int(patch['target_size']):
              raise SystemExit('target size mismatch')
          if hashlib.sha256(data).hexdigest() != patch['target_sha256']:
              raise SystemExit('target SHA-256 mismatch')
          Path('.release-upload/staging-1.0.6.js').write_bytes(data)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .release-upload/staging-1.0.6.js
          git commit -m 'Stage reconstructed engine 1.0.6'
          git push origin HEAD:main
          stage_sha="$(git rev-parse HEAD)"
          source_url="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${stage_sha}/.release-upload/staging-1.0.6.js"
          gh workflow run publish-game-engine.yml --ref main \
            -f source_url="${source_url}" \
            -f version_name='1.0.6' \
            -f expected_sha256='61903eb697e82ae09f03a8ae87bd8808b6063191a224057fcb5e75813573e7a8' \
            -f expected_size='11590600' \
            -f min_noname_version='1.1.3'
        env:
          GH_TOKEN: ${{ github.token }}
