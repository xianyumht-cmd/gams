name: Deploy online license API

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - license-api/**
      - .github/workflows/deploy-license-api.yml

permissions:
  contents: read

concurrency:
  group: production-license-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ADMIN_LOGIN_SECRET: ${{ secrets.LICENSE_ADMIN_PASSWORD }}
      TOKEN_SIGNING_SECRET: ${{ secrets.TOKEN_SIGNING_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ADMIN_LOGIN_SECRET TOKEN_SIGNING_SECRET; do
            test -n "${!name:-}" || { echo "$name is missing"; exit 1; }
          done
          test "${#TOKEN_SIGNING_SECRET}" -ge 32 || {
            echo "TOKEN_SIGNING_SECRET must contain at least 32 characters"
            exit 1
          }
          node --check license-api/src/index.js
          grep -Fq 'ADMIN_LOGIN_SECRET' license-api/src/index.js
          grep -Fq 'TOKEN_SIGNING_SECRET' license-api/src/index.js

      - name: Find or create D1 database
        id: d1
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database"
          list="$(curl -fsS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$api?per_page=100")"
          database_id="$(printf '%s' "$list" | jq -r '.result[] | select(.name=="gams-license-db") | (.uuid // .id)' | head -n1)"
          if [[ -z "$database_id" || "$database_id" == "null" ]]; then
            created="$(curl -fsS -X POST \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"gams-license-db"}' \
              "$api")"
            database_id="$(printf '%s' "$created" | jq -r '.result.uuid // .result.id')"
          fi
          test -n "$database_id" && test "$database_id" != "null"
          echo "database_id=$database_id" >> "$GITHUB_OUTPUT"

      - name: Generate Wrangler configuration
        working-directory: license-api
        shell: bash
        run: |
          set -euo pipefail
          sed "s/__D1_DATABASE_ID__/${{ steps.d1.outputs.database_id }}/g" \
            wrangler.template.jsonc > wrangler.generated.jsonc

      - name: Configure independent License secrets
        working-directory: license-api
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ADMIN_LOGIN_SECRET" \
            | npx --yes wrangler@4 secret put ADMIN_LOGIN_SECRET --config wrangler.generated.jsonc
          printf '%s' "$TOKEN_SIGNING_SECRET" \
            | npx --yes wrangler@4 secret put TOKEN_SIGNING_SECRET --config wrangler.generated.jsonc

      - name: Apply existing D1 migrations
        working-directory: license-api
        run: npx --yes wrangler@4 d1 migrations apply gams-license-db --remote --config wrangler.generated.jsonc

      - name: Deploy production License Worker
        working-directory: license-api
        run: npx --yes wrangler@4 deploy --config wrangler.generated.jsonc

      - name: Verify signed License endpoint
        shell: bash
        run: |
          set -euo pipefail
          endpoint="https://gams-license-api.2320006072.workers.dev"
          for attempt in $(seq 1 30); do
            status="$(curl -sS -o /tmp/license-health.json -w '%{http_code}' "$endpoint/health" || true)"
            if [[ "$status" == "200" ]] \
              && jq -e '.ok == true and .service == "gams-license-api" and .version == 2 and .signedProtocol == true' \
                /tmp/license-health.json >/dev/null; then
              echo "Signed License API is ready"
              exit 0
            fi
            sleep 5
          done
          cat /tmp/license-health.json 2>/dev/null || true
          exit 1
