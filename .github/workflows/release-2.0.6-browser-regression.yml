name: Release GG 2.0.6 browser regression fix

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-2.0.6-browser-regression.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-gg-2-0-6-browser-regression
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GG_RELEASE_KEYSTORE_BASE64: ${{ secrets.GG_RELEASE_KEYSTORE_BASE64 }}
      GG_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.GG_RELEASE_KEYSTORE_PASSWORD }}
      CERT_SHA256: 70:60:83:47:EE:8C:C3:CD:72:E7:DC:70:C5:04:01:3E:26:1C:9A:2F:EE:98:50:53:92:19:CD:A5:19:C8:7F:34
      GH_TOKEN: ${{ github.token }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Apply focused browser regression fix
        id: patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_2_0_6_browser_window_regression_fix.py
          python3 scripts/apply_2_0_6_browser_window_regression_fix.py
          main='v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java'
          grep -Fq 'settings.setSupportMultipleWindows(false);' "$main"
          grep -Fq 'view.loadUrl(target);' "$main"
          grep -Fq 'return true;' "$main"
          ! grep -Fq 'boolean onCreateWindow' "$main"
          ! grep -Fq 'new WebView(MainActivity.this)' "$main"
          grep -Fq 'versionCode = 15' v2/android/client/build.gradle.kts
          grep -Fq 'versionName = "2.0.6"' v2/android/client/build.gradle.kts
          grep -Fq 'PROTOCOL_APP_VERSION = 15' v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java

      - name: Build and lint GG client 2.0.6
        id: build
        working-directory: v2/android
        run: gradle --no-daemon :client:clean :client:lintRelease :client:assembleRelease

      - name: Sign and verify formal APK
        id: sign
        shell: bash
        run: |
          set -euo pipefail
          test -n "${GG_RELEASE_KEYSTORE_BASE64:-}"
          test -n "${GG_RELEASE_KEYSTORE_PASSWORD:-}"
          trap 'rm -f /tmp/gg-release.jks' EXIT
          printf '%s' "$GG_RELEASE_KEYSTORE_BASE64" | base64 -d > /tmp/gg-release.jks
          keytool -list -v -keystore /tmp/gg-release.jks \
            -storepass "$GG_RELEASE_KEYSTORE_PASSWORD" -alias gg-release > /tmp/keytool.txt
          grep -Fq "SHA256: $CERT_SHA256" /tmp/keytool.txt
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          apksigner="$(find "$sdk_root/build-tools" -type f -name apksigner -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          aapt="$(find "$sdk_root/build-tools" -type f -name aapt -perm -u+x 2>/dev/null | sort -V | tail -n1)"
          test -x "$apksigner" && test -x "$aapt"
          unsigned="$(find v2/android/client/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n1)"
          test -s "$unsigned"
          mkdir -p /tmp/gg-2.0.6
          signed=/tmp/gg-2.0.6/GG-2.0.6-code15.apk
          "$apksigner" sign --ks /tmp/gg-release.jks --ks-key-alias gg-release \
            --ks-pass env:GG_RELEASE_KEYSTORE_PASSWORD --key-pass env:GG_RELEASE_KEYSTORE_PASSWORD \
            --v1-signing-enabled false --v2-signing-enabled true --v3-signing-enabled true \
            --v4-signing-enabled false --out "$signed" "$unsigned"
          "$apksigner" verify --min-sdk-version 24 "$signed"
          "$aapt" dump badging "$signed" > /tmp/badging.txt
          grep -Fq "package: name='com.jinli.quickweb'" /tmp/badging.txt
          grep -Fq "versionCode='15'" /tmp/badging.txt
          grep -Fq "versionName='2.0.6'" /tmp/badging.txt
          sha256sum "$signed" | awk '{print $1}' > /tmp/client-sha256.txt

      - name: Commit verified client source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            v2/android/client/build.gradle.kts \
            v2/android/client/src/main/java/com/jinli/ggsecure/MainActivity.java \
            v2/android/client/src/main/java/com/jinli/ggsecure/V2LicenseManager.java
          git commit -m 'Fix browser window regression causing blank pages'
          git pull --rebase origin main
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Publish GG 2.0.6
        id: release
        shell: bash
        run: |
          set -euo pipefail
          client_sha="$(cat /tmp/client-sha256.txt)"
          cat > /tmp/release-notes.txt <<EOF
          GG 2.0.6

          - 修复 2.0.4 浏览器接管改动引入的页面白屏回归。
          - 恢复单窗口 WebView，不再创建临时空白弹窗 WebView。
          - HTTP/HTTPS 链接只由 GG 当前 WebView 处理，不调用系统浏览器。
          - APK SHA-256：${client_sha}
          - 签名证书 SHA-256：${CERT_SHA256}
          EOF
          gh release delete gg-2.0.6 --yes --cleanup-tag 2>/dev/null || true
          gh release create gg-2.0.6 /tmp/gg-2.0.6/GG-2.0.6-code15.apk \
            --target "${{ steps.commit.outputs.sha }}" \
            --title 'GG 2.0.6' --notes-file /tmp/release-notes.txt

      - uses: actions/upload-artifact@v4
        id: artifact
        with:
          name: GG-2.0.6-code15
          path: /tmp/gg-2.0.6/GG-2.0.6-code15.apk
          retention-days: 30
          if-no-files-found: error

      - name: Record final status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ok=false
          if [[ "${{ steps.patch.outcome }}" == success \
             && "${{ steps.build.outcome }}" == success \
             && "${{ steps.sign.outcome }}" == success \
             && "${{ steps.commit.outcome }}" == success \
             && "${{ steps.release.outcome }}" == success \
             && "${{ steps.artifact.outcome }}" == success ]]; then ok=true; fi
          jq -n \
            --arg generatedAt "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson runId "$GITHUB_RUN_ID" \
            --argjson ok "$ok" \
            --arg sha256 "$(cat /tmp/client-sha256.txt 2>/dev/null || true)" \
            --arg patch "${{ steps.patch.outcome }}" \
            --arg build "${{ steps.build.outcome }}" \
            --arg sign "${{ steps.sign.outcome }}" \
            --arg commit "${{ steps.commit.outcome }}" \
            --arg release "${{ steps.release.outcome }}" \
            --arg artifact "${{ steps.artifact.outcome }}" \
            '{schemaVersion:1,generatedAt:$generatedAt,runId:$runId,ok:$ok,client:{versionName:"2.0.6",versionCode:15,sha256:$sha256},fix:{regressionSource:"2.0.4 multi-window interception",singleWindowRestored:true,popupWebViewRemoved:true,httpOwnedByMainWebView:true,systemBrowserForHttp:false},steps:{patch:$patch,build:$build,sign:$sign,commit:$commit,release:$release,artifact:$artifact},secretsExposed:false}' > /tmp/status.json
          path='docs/BROWSER_WINDOW_REGRESSION_FIX_STATUS.json'
          content="$(base64 -w0 /tmp/status.json)"
          old_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/${path}?ref=main" --jq '.sha' 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/${path}" -f message='Record browser window regression fix status' -f content="$content" -f branch=main)
          [[ -z "$old_sha" ]] || args+=(-f sha="$old_sha")
          gh api "${args[@]}" >/dev/null

      - name: Require complete release
        if: always()
        shell: bash
        run: |
          test "${{ steps.patch.outcome }}" = success
          test "${{ steps.build.outcome }}" = success
          test "${{ steps.sign.outcome }}" = success
          test "${{ steps.commit.outcome }}" = success
          test "${{ steps.release.outcome }}" = success
          test "${{ steps.artifact.outcome }}" = success
