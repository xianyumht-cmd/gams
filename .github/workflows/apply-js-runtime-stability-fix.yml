name: Apply JS runtime stability fix

on:
  push:
    branches:
      - fix/js-runtime-stability-20260807
    paths:
      - scripts/apply_js_runtime_stability_fix.py
      - .github/workflows/apply-js-runtime-stability-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: js-runtime-stability-20260807
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/js-runtime-stability-20260807
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply deterministic patch
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/apply_js_runtime_stability_fix.py
          python3 scripts/apply_js_runtime_stability_fix.py
          python3 scripts/apply_js_runtime_stability_fix.py --verify-only
          git diff --check

      - name: Verify narrow change boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'Symbol.for("gg.runtime.storage-hook.v2")' remote-script/src/noname.js
          grep -Fq 'Symbol.for("gg.runtime.xhr-open.v2")' remote-script/src/noname.js
          grep -Fq 'Symbol.for("gg.runtime.jsonp-create-element.v2")' remote-script/src/noname.js
          ! grep -Fq 'Object["defineProperty"](Object["prototype"]' remote-script/src/noname.js
          grep -Fq '__gg_engine_load_started_at__' game-engine/release/game-1.0.5.js
          ! grep -Fq '__gg_engine_alert_filter_installed__' game-engine/release/game-1.0.5.js
          node --check remote-script/src/noname.js
          node --check game-engine/release/game-1.0.5.js
          git diff --stat

      - name: Commit patched JavaScript
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-script/src/noname.js game-engine/release/game-1.0.5.js
          git diff --cached --quiet && { echo 'No generated changes'; exit 1; }
          git commit -m 'fix(js): remove destructive guards and stabilize runtime hooks [skip ci]'
          git push origin HEAD:fix/js-runtime-stability-20260807
