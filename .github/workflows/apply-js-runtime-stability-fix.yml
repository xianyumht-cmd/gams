name: Apply JS runtime stability fix

on:
  push:
    branches:
      - fix/page5-missing-constructor-mobile-bridge-20260806
    paths:
      - scripts/apply_js_runtime_stability_fix.trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-js-runtime-stability-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/page5-missing-constructor-mobile-bridge-20260806
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Fetch reviewed deterministic patcher
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 4 --retry-all-errors \
            'https://raw.githubusercontent.com/xianyumht-cmd/gams/fix/js-runtime-stability-20260807/scripts/apply_js_runtime_stability_fix.py' \
            -o /tmp/apply_js_runtime_stability_fix.py
          python3 -m py_compile /tmp/apply_js_runtime_stability_fix.py

      - name: Patch and verify JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/apply_js_runtime_stability_fix.py
          python3 /tmp/apply_js_runtime_stability_fix.py --verify-only
          node --check remote-script/src/noname.js
          node --check game-engine/release/game-1.0.5.js
          git diff --check
          git diff --stat

      - name: Commit repaired sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add remote-script/src/noname.js game-engine/release/game-1.0.5.js
          git diff --cached --quiet && { echo 'No source changes produced'; exit 1; }
          git commit -m 'fix(js): restore stable hooks and remove destructive guards [skip ci]'
          git push origin HEAD:fix/page5-missing-constructor-mobile-bridge-20260806
